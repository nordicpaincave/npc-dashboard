name: Atualizar Dashboard NPC

on:
  schedule:
    - cron: "17 9 * * *"    # todo dia 06h17 Curitiba — pega sono/HRV da noite
    - cron: "17 15 * * *"   # todo dia 12h17 Curitiba — 25 min após a análise diária das 11h52
    - cron: "17 1 * * *"    # todo dia 22h17 Curitiba — 25 min após a análise diária das 21h52
  workflow_dispatch:          # permite rodar manualmente pelo GitHub

# Evita duas execuções ao mesmo tempo disputando o push
concurrency:
  group: atualizar-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests "psycopg[binary]"

      # Se o TP ou o Supabase falhar, o generate.py sai com código 1:
      # o job fica vermelho, o GitHub avisa por e-mail e o passo de publicação
      # abaixo NÃO roda (o site mantém a última versão boa).
      - name: Gerar dashboard (Intervals.icu + Supabase)
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          # TrainingPeaks: só até 15/11/2026 (o generate.py troca sozinho na data do corte).
          # Depois do corte pode apagar o secret TP_COOKIE; para voltar ao TP, restaure-o.
          TP_COOKIE: ${{ secrets.TP_COOKIE }}
          SUPABASE_READER_PASSWORD: ${{ secrets.SUPABASE_READER_PASSWORD }}
        run: python generate.py

      - name: Commitar e publicar
        run: |
          git config user.name  "npc-bot"
          git config user.email "bot@npcendurance.com"
          git add index.html files/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada."
            exit 0
          fi
          git commit -m "Dashboard atualizado — $(date -u +'%d/%m/%Y %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
