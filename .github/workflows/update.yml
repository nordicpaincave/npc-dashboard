name: Atualizar Dashboard NPC

on:
  schedule:
    - cron: "0 7 */2 * *"   # a cada 2 dias às 07h UTC (04h Curitiba)
  workflow_dispatch:          # permite rodar manualmente pelo GitHub

# Evita duas execuções ao mesmo tempo disputando o push
concurrency:
  group: atualizar-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests "psycopg[binary]"

      # Se o TP ou o Supabase falhar, o generate.py sai com código 1:
      # o job fica vermelho, o GitHub avisa por e-mail e o passo de publicação
      # abaixo NÃO roda (o site mantém a última versão boa).
      - name: Gerar dashboard (TrainingPeaks + Supabase)
        env:
          TP_COOKIE: ${{ secrets.TP_COOKIE }}
          SUPABASE_READER_PASSWORD: ${{ secrets.SUPABASE_READER_PASSWORD }}
        run: python generate.py

      - name: Commitar e publicar
        run: |
          git config user.name  "npc-bot"
          git config user.email "bot@npcendurance.com"
          git add index.html files/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada."
            exit 0
          fi
          git commit -m "Dashboard atualizado — $(date -u +'%d/%m/%Y %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
