name: Testar fonte Intervals (sem publicar)

# Só manual. Gera o dashboard a partir do Intervals.icu e NÃO commita nada:
# serve para validar a troca de fonte antes/depois do corte de 16/11/2026.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests "psycopg[binary]"
      - name: Gerar dashboard pelo Intervals (dry run)
        env:
          NPC_DATA_SOURCE: intervals
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          SUPABASE_READER_PASSWORD: ${{ secrets.SUPABASE_READER_PASSWORD }}
        run: |
          python generate.py
          python - <<'PY'
          import json, re
          html = open("index.html", encoding="utf-8").read()
          m = re.search(r"const DB = (\{.*?\});\n", html, re.S)
          db = json.loads(m.group(1))
          for key, a in db["athletes"].items():
              print("\n=====", key.upper(), "=====")
              done = [w for w in a["workouts"] if w["done"]]
              plan = [w for w in a["workouts"] if not w["done"]]
              print("treinos feitos:", len(done), "| planejados:", len(plan))
              print("PMC último:", a["pmc"][-2:])
              print("wellness último:", a.get("wellness", [])[-2:])
              print("plano:", (a.get("plan") or {}).get("name"), "| zonas:", {k: len(v) for k, v in (a.get("zones") or {}).items()},
                    "| histórico:", [h["name"] for h in a.get("history", [])])
              for w in sorted(a["workouts"], key=lambda w: w["date"])[-12:]:
                  print(w["date"], w["sport"], "done" if w["done"] else "plan", "|", w["title"][:60],
                        "| tss", (w["act"] or {}).get("tss"), "plan", w["plan"]["tss"], "| rpe", (w["act"] or {}).get("rpe"))
          PY

      - name: Diagnóstico — campos brutos de wellness no Intervals (últimos 10 dias)
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          SUPABASE_READER_PASSWORD: ${{ secrets.SUPABASE_READER_PASSWORD }}
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from npc import intervals as icu, supa
          import generate
          sb = supa.fetch(supa.connect(), source="intervals")
          ros = generate.roster(sb)
          end = date.today(); start = end - timedelta(days=10)
          for key, cfg in ros.items():
              aid = cfg["icu_id"]
              rows = icu._get(f"/athlete/{aid}/wellness", {"oldest": start.isoformat(), "newest": end.isoformat()})
              print(f"\n===== {key.upper()} ({aid}) — {len(rows)} dias =====")
              keys = sorted({k for r in rows for k, v in r.items() if v not in (None, [], {}, "") and k not in ("id", "updated")})
              print("campos com valor:", keys)
              for r in rows[-4:]:
                  print(r.get("id"), {k: r.get(k) for k in ("hrv", "hrvSDNN", "restingHR", "sleepSecs", "spO2", "BodyBatteryMin", "BodyBatteryMax", "steps") if r.get(k) is not None})
          PY
