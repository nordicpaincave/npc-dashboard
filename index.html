<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPC Endurance — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#171b24;--bg3:#1e2333;--bg4:#262c3f;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
  --text:#eef0f5;--text2:#9aa0b2;--text3:#6b7185;
  --ctl:#4a9eff;--atl:#f472b6;--tsb:#f5c542;--tss:#5b6478;
  --swim:#4a9eff;--bike:#f5a623;--run:#4db87a;--strength:#9b8fff;--brick:#ff7c3a;--race:#ff5252;--other:#8b90a0;
  --ok:#3fbf6f;--warn:#e6b422;--bad:#ff8a3d;--miss:#ef4444;
  --lt1:#3b82f6;--lt2:#f97316;--accent:#ff7c3a;
  --r:12px;
}
html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
body{min-height:100vh}
a{color:#7ab8ff}
button{font:inherit;color:inherit;cursor:pointer}
.page{max-width:1320px;margin:0 auto;padding:16px 16px 48px}
/* Header */
.hdr{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px}
.logo-badge{background:var(--accent);color:#111;font-weight:800;border-radius:8px;padding:6px 9px;letter-spacing:.04em;font-size:13px}
.logo h1{font-size:17px;font-weight:700;letter-spacing:.01em}
.logo small{display:block;color:var(--text3);font-size:11px;font-weight:500}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--text2);font-weight:600;font-size:13px;min-height:36px}
.seg button.on{background:var(--bg4);color:var(--text)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:16px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--text2);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;min-height:42px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
/* Cards */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media(max-width:520px){.g3{grid-template-columns:1fr}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;min-width:0}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card h3 .sub{text-transform:none;letter-spacing:0;font-weight:500;color:var(--text3)}
.kpi .v{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi .s{font-size:12px;color:var(--text2);margin-top:4px}
.up{color:var(--ok)}.down{color:var(--bad)}
.section{margin-top:14px}
.muted{color:var(--text3)}
.small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border2);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--text2);background:none}
.chip.on{background:var(--bg4);color:var(--text);border-color:var(--text3)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--bg4);color:var(--text2)}
.tag.A{background:#7f1d1d;color:#fecaca}.tag.B{background:#78350f;color:#fde68a}.tag.C{background:#1e3a5f;color:#bfdbfe}
.chart-box{position:relative;height:300px}
.chart-box.sm{height:150px}.chart-box.md{height:230px}.chart-box.lg{height:360px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.empty{padding:28px 12px;text-align:center;color:var(--text3)}
.warnbox{background:#2a2212;border:1px solid #5c4716;color:#f3d48a;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:12px}
.note{background:var(--bg3);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text2)}
/* Tables */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);text-align:left;padding:8px 10px;background:var(--bg3);white-space:nowrap;font-weight:700}
td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.cur td{background:rgba(255,124,58,.08)}
tr.past td{color:var(--text2)}
/* Races */
.race{display:flex;gap:12px;align-items:center}
.race .days{font-size:26px;font-weight:800;min-width:64px;text-align:center;line-height:1}
.race .days small{display:block;font-size:10px;color:var(--text3);font-weight:700;letter-spacing:.06em;margin-top:2px}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-day{background:var(--bg2);border:1px solid var(--border);border-radius:10px;min-height:150px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cal-day.today{border-color:var(--accent)}
.cal-day .dh{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);font-weight:700}
.cal-day .dh b{color:var(--text)}
.wk{border:0;text-align:left;background:var(--bg3);border-radius:8px;padding:7px 8px 7px 10px;position:relative;width:100%;display:block;min-height:44px}
.wk::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--c)}
.wk .t{font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wk .m{font-size:11px;color:var(--text2);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.wk .st{position:absolute;right:7px;top:7px;width:9px;height:9px;border-radius:50%}
.st-ok{background:var(--ok)}.st-warn{background:var(--warn)}.st-bad{background:var(--bad)}.st-miss{background:var(--miss)}.st-fut{background:transparent;border:1.5px solid var(--text3)}.st-free{background:var(--text2)}
.wsum{margin-top:10px}
@media(max-width:900px){.cal{grid-template-columns:1fr}.cal-day{min-height:0}.cal-day.emptyday{display:none}}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:50;overflow-y:auto}
.modal.on{display:flex}
.modal .box{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;max-width:720px;width:100%;padding:18px}
.modal .x{float:right;border:0;background:var(--bg4);border-radius:8px;width:36px;height:36px;font-size:18px}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
@media(max-width:600px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.perc{background:var(--bg3);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:0 0 12px}
@media(max-width:600px){.perc{grid-template-columns:1fr}}
.perc .lbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.perc .val{font-size:15px;font-weight:700;margin:2px 0 6px}.perc .val small{font-weight:500;color:var(--text2);font-size:12px}
.rpebar{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.rpebar{max-width:260px}.rpebar i{height:10px;border-radius:2px;opacity:.18}.rpebar i.on{opacity:1}
.faces{display:flex;gap:8px;font-size:22px;line-height:1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}.faces span{opacity:.28;filter:grayscale(1)}.faces span.on{opacity:1;filter:none}
.an{border:1px solid var(--border2);border-radius:10px;padding:12px 14px;margin:0 0 12px;background:linear-gradient(180deg,rgba(74,158,255,.06),transparent)}
.an-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.an-h .lbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-right:4px}
.an-it{font-size:13px;line-height:1.5}.an-it ul,.wa ul{margin:6px 0 0;padding-left:18px;color:var(--text2);font-size:12.5px;line-height:1.5}
.an-short{font-size:13px;line-height:1.55;margin:8px 0 0;color:var(--text)}
.an details{margin-top:8px;font-size:12.5px;color:var(--text2);line-height:1.55}.an summary,.wa summary{cursor:pointer;color:#7ab8ff;font-size:12px}
.an .other{margin-top:8px;font-size:12px;color:var(--text2)}
.lts{display:flex;flex-direction:column;gap:10px}
.lts-row{display:grid;grid-template-columns:150px 1fr 1fr;gap:14px;align-items:start;padding:10px 0;border-top:1px solid var(--bg4)}
.lts-row:first-child{border-top:0}
.lts-v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.lts-cell .pill{margin-right:4px}
@media (max-width:700px){.lts-row{grid-template-columns:1fr}}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--bg4);color:var(--text2)}
.pill.g{background:#14532d;color:#bbf7d0}.pill.y{background:#78350f;color:#fde68a}.pill.r{background:#7f1d1d;color:#fecaca}.pill.b{background:#1e3a5f;color:#bfdbfe}
details.hw{border:1px solid var(--border);border-radius:10px;margin-top:8px;background:var(--bg2)}
details.hw>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap;font-size:13px}
details.hw>summary::-webkit-details-marker{display:none}
details.hw>summary .wn{font-weight:700;min-width:58px}details.hw>summary .wd{color:var(--text2);min-width:96px}
details.hw>summary .wt{font-variant-numeric:tabular-nums}details.hw>summary .car{margin-left:auto;color:var(--text3);transition:transform .15s}
details.hw[open]>summary .car{transform:rotate(180deg)}
details.hw .hb{padding:0 14px 14px}
.wa{background:var(--bg3);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.wa .k{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin:6px 0 8px}.wa .k b{color:var(--text)}
.wa p{margin:6px 0;font-size:13px;line-height:1.55}
.wa .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}@media(max-width:700px){.wa .cols{grid-template-columns:1fr}}
.wa h5{margin:8px 0 0;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.anlink{color:#7ab8ff;white-space:nowrap}
tr.miss td{color:var(--text3)}
.perc .foot{grid-column:1/-1;font-size:11px;color:var(--text2);border-top:1px solid var(--border);padding-top:7px}
.mgrid div{background:var(--bg3);border-radius:8px;padding:8px}
.mgrid b{display:block;font-size:16px}
.mgrid span{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
pre.desc{white-space:pre-wrap;font-family:inherit;font-size:13px;color:var(--text2);background:var(--bg3);border-radius:8px;padding:10px;max-height:340px;overflow:auto}
/* Macro */
.phasebar{display:flex;width:100%;border-radius:8px;overflow:hidden;min-height:34px}
.phasebar div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0f1117;padding:4px;text-align:center;line-height:1.15;overflow:hidden}
.notes-cell{max-width:440px;color:var(--text2);font-size:12px}
tr.wkrow{cursor:pointer}tr.wkrow:hover td{background:rgba(255,255,255,.03)}tr.wkrow.cur:hover td{background:rgba(255,124,58,.12)}tr.wkrow.open td{border-bottom:0}
.wk-sum{min-width:240px;max-width:380px;font-size:12px;color:var(--text2)}
.wk-sum .head{color:var(--text);font-size:13px;margin:3px 0}
.vchips{display:flex;gap:4px;flex-wrap:wrap}
.vchip{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--bg4);color:var(--text2);white-space:nowrap}
.vchip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:0}
.ntag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin:2px 4px 0 0;text-transform:uppercase;letter-spacing:.03em}
.ntag.lac{background:#7c2d12;color:#ffedd5}.ntag.nut{background:#14532d;color:#bbf7d0}
.wk-more{color:#7ab8ff;white-space:nowrap;margin-left:2px}.wk-more::after{content:' ▾'}tr.wkrow.open .wk-more::after{content:' ▴'}
tr.wk-detail td{background:var(--bg2);padding:14px 16px 16px;white-space:normal}
tr.wk-detail[hidden]{display:none}
.nsecs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 22px;margin-top:10px}
.nsec{border-left:3px solid var(--lt1);padding:2px 0 2px 12px}
.nsec.lac{border-color:var(--lt2)}.nsec.nut{border-color:var(--ok)}
.nsec h4{margin:0 0 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text)}
.nsec ul{margin:0;padding-left:16px;font-size:13px;line-height:1.5;color:var(--text2)}.nsec li+li{margin-top:4px}
.nsec li b{color:var(--text);font-weight:600}
/* Lactate */
.files a{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;text-decoration:none;color:var(--text);font-weight:600;font-size:13px;min-height:40px}
.files{display:flex;flex-wrap:wrap;gap:8px}
.big-lt{display:flex;gap:12px;flex-wrap:wrap}
.big-lt div{flex:1;min-width:150px;background:var(--bg3);border-radius:10px;padding:12px}
.big-lt b{font-size:28px;display:block}
.big-lt .lt1 b{color:#7cb2ff}.big-lt .lt2 b{color:#ffa45c}
footer{margin-top:28px;color:var(--text3);font-size:12px;border-top:1px solid var(--border);padding-top:12px}
.limz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:20px;align-items:start}.limz>div{min-width:0}@media(max-width:600px){.limz table th,.limz table td{white-space:normal;padding-left:5px;padding-right:5px;font-size:12px}.limz .tbl-wrap table{min-width:0;width:100%}}@media(max-width:900px){.limz{grid-template-columns:minmax(0,1fr)}}
.ztbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--border2)}.ztbar i{display:block;height:100%}

/* ── análise diária v2 ── */
.dv{display:flex;flex-direction:column;gap:14px}
.dv-hero{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;border:1px solid var(--border2)}
.dv-hero.g{background:linear-gradient(90deg,rgba(63,191,111,.16),transparent 70%)}.dv-hero.y{background:linear-gradient(90deg,rgba(230,180,34,.16),transparent 70%)}.dv-hero.r{background:linear-gradient(90deg,rgba(239,68,68,.16),transparent 70%)}
.dv-badge{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800}
.dv-hero.g .dv-badge{background:rgba(63,191,111,.22);color:var(--ok)}.dv-hero.y .dv-badge{background:rgba(230,180,34,.22);color:var(--warn)}.dv-hero.r .dv-badge{background:rgba(239,68,68,.22);color:var(--miss)}
.dv-hero .v{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.dv-hero .h{font-size:16px;font-weight:700;line-height:1.35;margin-top:2px}
.dv-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.dv-tile{border:1px solid var(--border2);border-radius:10px;padding:10px 12px;background:var(--bg3,rgba(255,255,255,.02))}
.dv-tile .l{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.dv-tile .n{font-size:20px;font-weight:800;margin-top:3px}.dv-tile .n small{font-size:12px;font-weight:600;color:var(--text2)}
.dv-tile .s{font-size:12px;color:var(--text2);margin-top:2px}
.dv-bar{height:6px;border-radius:3px;background:var(--border2);margin-top:6px;overflow:hidden}.dv-bar i{display:block;height:100%;background:var(--ok)}
.dv-sess{border:1px solid var(--border2);border-radius:12px;padding:12px 14px}
.dv-sess-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.dv-sess-h b{font-size:14.5px}
.dv-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.dv-kpi{border-radius:9px;padding:8px 10px;border-left:3px solid var(--border2);background:rgba(255,255,255,.025)}
.dv-kpi.g{border-left-color:var(--ok)}.dv-kpi.y{border-left-color:var(--warn)}.dv-kpi.r{border-left-color:var(--miss)}
.dv-kpi .l{font-size:11px;color:var(--text3)}.dv-kpi .v{font-size:16px;font-weight:800;margin-top:1px}.dv-kpi .t{font-size:11.5px;color:var(--text2)}
.dv-pts{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.dv-pts li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.45}
.dv-pts .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.dv-pts .good .ic{background:rgba(63,191,111,.2);color:var(--ok)}.dv-pts .warn .ic{background:rgba(230,180,34,.2);color:var(--warn)}.dv-pts .bad .ic{background:rgba(239,68,68,.2);color:var(--miss)}.dv-pts .info .ic{background:rgba(74,158,255,.18);color:#7cb2ff}
.dv-pts .area{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-right:6px}
.dv-tom{border-radius:12px;padding:12px 14px;border:1px solid rgba(74,158,255,.35);background:linear-gradient(180deg,rgba(74,158,255,.10),transparent)}
.dv-tom .l{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7cb2ff}
.dv-tom .t{font-size:16px;font-weight:800;margin:3px 0 8px}
.dv-tom .chips{display:flex;flex-wrap:wrap;gap:6px}.dv-tom .chips span{border:1px solid var(--border2);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.03)}
.dv-tom ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--text2)}
.dv-tech h6{margin:12px 0 4px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.dv-tech p{margin:0;font-size:13px;line-height:1.55;color:var(--text2)}
@media(max-width:700px){.dv-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.dv-hero .h{font-size:14.5px}}

/* ── Análise semanal visual (weekly_analyses.visual) ── */
.wv{display:flex;flex-direction:column;gap:12px}
.wv-scores{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media(max-width:980px){.wv-scores{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.wv-scores{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wv-score{border-radius:10px;padding:10px 12px;background:var(--bg3);border-top:3px solid var(--border2);min-width:0}
.wv-score.g{border-top-color:var(--ok)}.wv-score.y{border-top-color:var(--warn)}.wv-score.r{border-top-color:var(--miss)}
.wv-score .l{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:6px}
.wv-score .l i{width:8px;height:8px;border-radius:50%;background:var(--border2)}.wv-score.g .l i{background:var(--ok)}.wv-score.y .l i{background:var(--warn)}.wv-score.r .l i{background:var(--miss)}
.wv-score .v{font-size:20px;font-weight:800;margin-top:4px;line-height:1.15}.wv-score .s{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.35}
.wv-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px}.wv-2.eq{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media(max-width:820px){.wv-2,.wv-2.eq{grid-template-columns:minmax(0,1fr)}}
.wv-box{background:var(--bg3);border-radius:10px;padding:12px 14px;min-width:0}
.wv-box h5{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.wv-box h5 span{text-transform:none;letter-spacing:0;font-weight:500}
.wv-box .dv-pts{margin-top:0}
.wv-flags{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px;text-align:center;font-size:10.5px;color:var(--text3)}
.wv-flags i{display:block;height:7px;border-radius:4px;margin-bottom:3px;background:var(--border)}
.wv-flags .g i{background:var(--ok)}.wv-flags .y i{background:var(--warn)}.wv-flags .r i{background:var(--miss)}

.wv-sc{position:relative;text-align:left;border:1px solid var(--border2);border-left:3px solid var(--c);border-radius:10px;padding:9px 30px 9px 11px;background:var(--bg2);min-width:0}

4 bpm (LT1 validado em 158). Pace de referência: 4:45–5:10/km. Mais rápido que 4:27/km já é zona cinzenta.\n→ Primeiros 10 min bem leves.\n→ Se encostar no teto no último terço, REDUZA o pace — o fim no mesmo ritmo do início.\n→ Se a FC estiver mais alta que na semana passada para o mesmo pace (+5 bpm ou mais): encerre em 60 min.\n→ Subida: segure pela FC e deixe o pace cair. 80 min é TETO.\n→ Água ~500 ml/h e 1 gel a cada ~40 min.\nPANTURRILHA (prioridade): dor acima de 2/10 em qualquer momento encerra o treino. Anote dor (0–10), local e o km em que começou, mesmo que seja 0.\n\nMain\n- 80m 120-154bpm","done":true,"plan":{"h":1.333,"tss":null,"km":null,"if":null},"act":{"h":1.022,"tss":64.0,"km":12.05,"if":0.79,"np":null,"pw":null,"hr":154,"hrmax":171,"cad":86,"pace":305,"elev":131,"rpe":5,"feel":5},"comments":[{"who":"btmromero","text":"Dor voltando a aparecer… 2/10"},{"who":"btmromero","text":"Corri sem cinta cardíaca."}]},{"id":156335360,"date":"2026-11-16","sport":"dayoff","title":"Descanso (Sem. 4 · seg)","desc":"Descanso completo — sem cardio e sem força.\nMotivo: dia seguinte ao longão com panturrilha 2/10 (\"voltando a aparecer\") e fim da semana da virose. Hoje é o dia de observar a dor no dia seguinte, que decide a corrida de terça.\nAnote (comentário/wellness): dor da panturrilha ao acordar e ao descer escada (0–10), lado, e FC de repouso.\nFisio liberada se agendada (protocolo do fisio, sem pliometria).","done":false,"plan":{"h":null,"tss":null,"km":null,"if":null},"act":null,"comments":[]},{"id":210717307,"date":"2026-11-16","sport":"strength","title":"Força","desc":"","done":true,"plan":{"h":null,"tss":null,"km":null,"if":null},"act":{"h":0.484,"tss":15.0,"km":null,"if":0.56,"np":null,"pw":null,"hr":81,"hrmax":108,"cad":null,"pace":null,"elev":null,"rpe":2,"feel":5},"comments":[{"who":"btmromero","text":"Fisioterapia. 30min. Exercícios prioritariamente para panturrilhas. Dois para ombros."}]},{"id":211195084,"date":"2026-11-17","sport":"bike","title":"Bike limiar controlado — 3×12min 215–222W + fita (Sem. 4 · ter)","desc":"Retorno da intensidade na bike (adiado da semana 3 pela virose) · 1h30 · velódromo ou estrada plana · ANTECIPADO de qua para ter (viagem a trabalho à tarde). Terminar até ~10h30 para ter ≥1h30 antes da força das 12h00.\nFonte: passaporte de bike v9 (lactato R1). Limiar controlado 215–230 W; nesta 1ª sessão do retorno, metade de baixo: 215–222 W. FTP 281 · LT1 205 W · LT2 250 W. FC de referência da bike 138–158 bpm — é VALIDADOR, não teto: a zona é julgada pela potência.\nPRÉ-CONDIÇÃO (retorno pós-infecção): FC de repouso ≤47 em 2 manhãs seguidas (seg e ter), sem febre ou sintomas, e FC normal no aquecimento (~130–135 bpm a 190 W). Falhou → só Z1 60 min a 180–200 W, e anote o motivo.\nEstrutura: 20 min progressivos + 10 min a 180–200 W → 3×12 min a 215–222 W com 4 min leves (160–180 W) → desaquecimento 12 min. Cadência natural 85–95 rpm.\nSe a FC passar de ~160 de forma sustentada no 1º bloco, ou a potência não se sustentar, encerre após 2 blocos.\nFITA DE LACTATO (a fita da semana): ao fim do 3º bloco, antes da recuperação — dedo médio, mão seca, fita só na gota. Esperado 2,2–3,0 mmol. Dentro (±0,5) mantém; acima disso → próxima sessão −5 W.\nPós-treino: carbo + proteína logo após (força às 12h e viagem em seguida).\nNO COMENTÁRIO: local, lactato, FC média de cada bloco, RPE, Feel e FC de repouso de seg e ter.\n\nWarmup\n- 20m ramp 53-69%\n- 10m 180-200w\n\nMain 3x\n- 12m 215-222w\n- 4m 160-180w\n\nCooldown\n- 12m 160-185w","done":true,"plan":{"h":1.5,"tss":73.0,"km":null,"if":null},"act":{"h":1.481,"tss":75.0,"km":50.27,"if":0.71,"np":200,"pw":170,"hr":133,"hrmax":160,"cad":82,"pace":null,"elev":127,"rpe":5,"feel":5},"comments":[{"who":"btmromero","text":"Café da manhã as 6h20. Início do treino as 7h39, 1 gel no final da série de 10min (antes da 1a série de 12min). Lactato ao final da terceira série de 12min = 3,30mmol"}]},{"id":211312990,"date":"2026-11-17","sport":"strength","title":"Força — panturrilha (fisio) + core + superiores (Sem. 4 · ter)","desc":"Força 1 de 2 · ~45 min · 12h00 (bike limiar de manhã; viagem à tarde).\nConteúdo: protocolo de panturrilha do fisio (elevações lentas / isometria como ele passou) + core + membros superiores. Carga moderada.\nVem depois do limiar de bike: membros inferiores sem ir à falha (pare 2–3 reps antes) — amanhã tem corrida.\nSEM pliometria nesta semana (sem saltos, saltitos ou corda) — a curva de dor da panturrilha está subindo (1→2/10).\nSe a panturrilha doer acima de 2/10 no protocolo: reduza a carga até 0–2/10 (dor que não piora no dia seguinte).\nQua sem fisio/força (viagem): o protocolo de panturrilha volta na quinta.\nNo comentário: exercícios de panturrilha feitos, dor 0–10 durante e RPE.","done":true,"plan":{"h":0.75,"tss":20.0,"km":null,"if":null},"act":{"h":0.971,"tss":35.0,"km":null,"if":0.29,"np":null,"pw":null,"hr":77,"hrmax":106,"cad":null,"pace":null,"elev":null,"rpe":3,"feel":5},"comments":[{"who":"btmromero","text":"Treino com personal. Foco em abdomen, pernas e gluteo."}]},{"id":211717829,"date":"2026-11-18","sport":"run","title":"Corrida Z1 — 50min FC ≤154 (Sem. 4 · qua · viagem)","desc":"Corrida Z1 contínua · 50 min · esteira a 1% ou terreno PLANO · controle por FC COM CINTA. Dia de viagem: só esta sessão (sem força/fisio).\nSe não conseguir fazer: não compense — a corrida CONDICIONAL de sexta entra no lugar.\nFonte: passaporte de corrida v6 (lactato) — LT1 4:27/km e 158 bpm medido em carga constante (06/11). Teto de FC 154 bpm. Pace de referência 4:45–5:10/km; mais rápido que 4:27/km já é zona cinzenta.\nOntem teve limiar de bike + força com foco em pernas/glúteo: se as pernas estiverem pesadas, a FC tende a subir — respeite o teto e deixe o pace cair.\nDOR MUSCULAR (pernas/glúteo) ≥3/10 ao acordar → corra só 40 min.\nCRITÉRIO PARA CORRER (gate de dor — panturrilha subiu de 1 para 2/10 no domingo): 0/10 ao acordar, 0/10 caminhando e descendo escada, e 0–1/10 em 10 elevações de panturrilha unipodais por perna. Falhou qualquer um → NÃO corra (sem substituição hoje) e anote o motivo.\nDurante: dor acima de 2/10 encerra na hora. Se a FC bater 154 com pace mais lento que ~5:05/km: reduza e encerre em 40 min. 50 min é TETO.\nSem cinta: julgue só por pace 4:45–5:10 e RPE ≤3.\nNO COMENTÁRIO DO INTERVALS: dor 0–10, lado, km em que começou (mesmo que 0), RPE (1–10), Feel (1–5) e se usou cinta.\n\nMain\n- 50m 120-154bpm","done":true,"plan":{"h":0.833,"tss":52.0,"km":null,"if":null},"act":{"h":0.949,"tss":56.0,"km":10.66,"if":0.76,"np":null,"pw":null,"hr":142,"hrmax":169,"cad":85,"pace":321,"elev":213,"rpe":4,"feel":5},"comments":[{"who":"btmromero","text":"Dor leve, 1/10"}]},{"id":156335366,"date":"2026-11-19","sport":"strength","title":"Força — panturrilha (fisio) + core + superiores (Sem. 4 · qui)","desc":"Força 2 de 2 · ~45 min · 12h00 (bike Z1 de 1h30 de manhã).\nConteúdo: protocolo de panturrilha do fisio + core + membros superiores. Carga moderada.\nSEM pliometria nesta semana (curva de dor da panturrilha subindo).\nAmanhã é o bike longo de 3h + corrida de transição de 40 min (feriado): nada de exaustão em membros inferiores — pare 2–3 reps antes da falha.\nSe a panturrilha doer acima de 2/10 no protocolo: reduza a carga até 0–2/10.\nNo comentário: exercícios feitos, dor 0–10 e RPE.","done":false,"plan":{"h":0.75,"tss":27.0,"km":null,"if":null},"act":null,"comments":[]},{"id":212043098,"date":"2026-11-19","sport":"bike","title":"Bike Z1 — 1h30 180–200W (Sem. 4 · qui)","desc":"Bike Z1 · 1h30 TETO · rolo ou estrada plana · 180–200 W, teto 205 W (LT1) também nas subidas.\nAmpliado de 60 para 90 min a pedido. Não passa disso: amanhã é o dia mais pesado da semana (3h de bike + corrida de transição numa panturrilha que ainda está em observação), e hoje ainda tem a força.\nFonte: passaporte de bike v9 (lactato R1): Z1 até 205 W; FC de referência abaixo de 138 bpm.\nPapel na semana: volume aeróbio sem intensidade entre a corrida de quarta e o bike + corrida de sexta.\nSe a FC passar de 140 a ~190 W no plano por mais de 10 min → volte e feche em 60 min (sinal de fadiga).\nDeixe ≥1h30 entre o fim do bike e a força, e coma carbo + proteína no intervalo.\nCarbo ~40 g/h e água.\nNO COMENTÁRIO: RPE, Feel, FC de repouso e dor da panturrilha ao acordar.\n\nWarmup\n- 10m 160-185w\n\nMain\n- 70m 180-200w\n\nCooldown\n- 10m 160-180w","done":true,"plan":{"h":1.5,"tss":66.0,"km":null,"if":null},"act":{"h":1.448,"tss":54.0,"km":43.67,"if":0.61,"np":172,"pw":153,"hr":119,"hrmax":151,"cad":84,"pace":null,"elev":115,"rpe":3,"feel":5},"comments":[]},{"id":212483347,"date":"2026-11-20","sport":"bike","title":"Bike longo Z1 — 3h00 180–200W + intestino 60 g/h → transição para corrida (Sem. 4 · sex feriado)","desc":"Feriado (20/11) · Bike longo Z1 · 3h00 TETO · 180–200 W · subidas ≤205 W · EM SEGUIDA a corrida de transição de 40 min (evento separado).\nAJUSTE DE VIAGEM: viaja depois do treino. O longão de domingo saiu e virou a corrida de transição de hoje; o bike de sábado foi para domingo (2h).\nFonte: passaporte de bike v9 (lactato R1): Z1 até 205 W (LT1), alvo 180–200 W, FC de referência abaixo de 138 bpm.\n→ Se for em grupo, teto 205 W também nas subidas — chegar na corrida com as pernas \"inteiras\" é o objetivo do dia.\n→ Ao bater 3h00, encerre. Transição ≤10 min.\n→ Se a FC passar de 140 a ~190 W no plano por mais de 10 min: corte para 2h30 e a corrida cai para 30 min.\nNUTRIÇÃO (treino de intestino): 60 g de carbo/h — não subir para 70 nesta semana — ≈180 g no total, diluído ≤10%; sódio ~600 mg/h. Goles a cada 10–15 min desde os primeiros 15 min. Última meia hora sem deixar de beber (a corrida vem logo depois).\nPós-treino (depois da corrida), antes de viajar: carbo + proteína e hidratação.\nNO COMENTÁRIO: hora em que acordou, g de carbo/h, volume bebido, desconforto intestinal 0–10 e quando, sódio, local, RPE e Feel.\n\nWarmup\n- 15m 160-185w\n\nMain\n- 150m 180-200w\n\nCooldown\n- 15m 160-180w","done":true,"plan":{"h":3.0,"tss":133.0, orrida de domingo vira Z1.\n→ Água ≥ 0,75 L/h com sódio. Carbo livre (treino curto).\nNO COMENTÁRIO: RPE, Feel, local e a FC dos min 30–60.\n\nWarmup\n- 20m ramp 150-185w\n\nMain\n- 60m 180-195w\n\nCooldown\n- 15m 160-180w","done":true,"plan":{"h":1.583,"tss":66.0,"km":null,"if":null},"act":{"h":1.566,"tss":75.0,"km":51.95,"if":0.69,"np":195,"pw":176,"hr":132,"hrmax":159,"cad":79,"pace":null,"elev":140,"rpe":4,"feel":7},"comments":[{"who":"btmromero","text":"Velódromo.\n90g de carbo e 1L de água"}]},{"id":214136576,"date":"2026-11-24","sport":"strength","title":"Força — personal 1h, carga reduzida (Sem. 5 · ter · 12h00)","desc":"FORÇA COM PERSONAL · 12h00 · 1h (bike feito cedo).\nSemana de DESCARGA: executar o planejamento da personal com ~20–25% menos carga nas pernas, RPE ~3–4; manter panturrilha e core.\nO teste de potência foi para SÁBADO — ainda assim, nada de falha muscular nem pliometria pesada.\nNo Intervals: registre o RPE da sessão (~30 min depois).","done":true,"plan":{"h":1.0,"tss":36.0,"km":null,"if":null},"act":{"h":0.672,"tss":31.0,"km":null,"if":0.68,"np":null,"pw":null,"hr":81,"hrmax":125,"cad":null,"pace":null,"elev":null,"rpe":4,"feel":5},"comments":[{"who":"btmromero","text":"Treino sem personal hoje.\nFoco em pernas, panturrilhas e core"}]},{"id":214475574,"date":"2026-11-25","sport":"strength","title":"Fisioterapia — 30 min antes da corrida (Sem. 5 · qua)","desc":"FISIOTERAPIA de manhã, 30 min, ANTES da corrida (padrão novo: seg e qua).\nA força com personal saiu da quarta e foi para terça.\nPanturrilha + o que a fisio indicar. Depois, corrida Z1 de 30 min (início ~07h00).\nNo Intervals: registre RPE e dor da panturrilha 0–10 ao fim da sessão.","done":true,"plan":{"h":0.5,"tss":10.0,"km":null,"if":null},"act":{"h":0.576,"tss":17.0,"km":null,"if":0.54,"np":null,"pw":null,"hr":65,"hrmax":94,"cad":null,"pace":null,"elev":null,"rpe":2,"feel":5},"comments":[]},{"id":214567742,"date":"2026-11-25","sport":"run","title":"Corrida Z1 — 30min FC ≤154 plano (Sem. 5 · qua · após a fisio)","desc":"Depois da fisioterapia (06h30–07h00). Outdoor, PLANO. 30 min — mais curta que a de segunda (45 min): é semana de descarga e a corrida não progride antes do limiar de domingo.\nControle por FC (passaporte corrida v6: LT1 158 bpm; teto do Z1 = 154). Pace livre — referência 4:45–5:10/km.\nCRITÉRIO PARA CORRER: panturrilha 0/10 ao acordar, ao caminhar e em 10 saltitos por perna. Se não → 30 min de bike Z1 (≤205 W) no lugar, ou só a fisio.\n→ FC > 154 com pace mais lento que 5:10/km → caminhe 1 min e retome. Dor > 2/10 durante → encerre.\nNO COMENTÁRIO: RPE, Feel, dor da panturrilha (durante e ao acordar amanhã).\n\nMain\n- 30m 120-154bpm","done":true,"plan":{"h":0.5,"tss":30.0,"km":null,"if":null},"act":{"h":0.502,"tss":34.0,"km":6.24,"if":0.82,"np":null,"pw":null,"hr":145,"hrmax":157,"cad":87,"pace":290,"elev":37,"rpe":4,"feel":5},"comments":[{"who":"btmromero","text":"Sem dor hoje"}]},{"id":159349142,"date":"2026-11-26","sport":"strength","title":"Força — personal 1h, pernas moderadas (Sem. 5 · qui · 12h00)","desc":"FORÇA COM PERSONAL · 12h00 · 1h · sem cardio no dia.\nSemana de DESCARGA: executar o planejamento da personal com ~20–25% menos carga nas pernas, RPE ~3–4; manter panturrilha (protocolo da fisio) e core.\nTeste de potência foi para SÁBADO (sexta = viagem): ainda assim, nada de falha muscular nem pliometria pesada nas pernas.\nNo Intervals: registre o RPE da sessão (~30 min depois).","done":false,"plan":{"h":1.0,"tss":30.0,"km":null,"if":null},"act":null,"comments":[]},{"id":159087049,"date":"2026-11-28","sport":"bike","title":"Teste de perfil de potência — 5s / 1min / 5min (Sem. 5 · SÁB · velódromo)","desc":"TESTE DE PERFIL DE POTÊNCIA (decidido 10/11) — velódromo. Sem fitas.\nMOVIDO de sex 27/11 para SÁB 28/11 (24/11): sexta virou dia de viagem a trabalho (sai cedo, volta à noite). Substitui o bike Z1 em grupo de sábado.\nPor que sábado e não quinta à tarde: na quinta o teste viria ~4–5 h depois da força com a personal. A fadiga residual de força reduz sprint e esforços de 1–5 min, e o resultado subestimaria seus picos — viraria um teste da fadiga, não do perfil. No sábado você chega com a sexta parada (viagem = descanso), quase 48 h depois da força.\nCafé da manhã com carbo ≥1h30 antes, mesmo protocolo de cafeína dos testes. Sábado sem limite de horário.\nEstrutura (~85 min):\n→ Aquecimento 20 min Z1 + 3×1 min progressivos (Z2b 215–230 W → Z2c 230–238 W → Z3 255–270 W) com 2 min leves.\n→ 2× sprint 6 s ALL-OUT (5 min Z1 entre) — sentado ou em pé, marcha pesada, partida lançada.\n→ 1 min ALL-OUT.\n→ 10 min Z1.\n→ 5 min ALL-OUT: abrir ~300 W, segurar, último minuto tudo.\n→ Desaquecimento 30 min Z1 (estendido para recuperar parte do volume do grupo que saiu; teto 195 W).\nOs alvos dos trechos ALL-OUT abaixo são só referência para o Garmin — o objetivo é o máximo.\nREGISTRAR: picos 5 s / 1 min / 5 min (20 min usa a referência de 06/09 = 268 W).\nTreino de intestino da semana: SAI (não combina com esforços máximos) — volta no próximo bike longo.\nCANCELAR/ADIAR se: FC de terça ainda > 145 a 180–195 W, pernas pesadas no aquecimento, ou panturrilha > 2/10. Nesse caso → bike Z1 1h30 180–200 W no lugar.\nNO COMENTÁRIO: RPE, Feel, local, sensação em cada esforço.\n\nWarmup\n- 20m 160-195w\n- 1m 215-230w\n- 2m 140-170w\n- 1m 230-238w\n- 2m 140-170w\n- 1m 255-270w\n- 2m 140-170w\n\nMain\n- 6s 700w\n- 5m 140-180w\n- 6s 700w\n- 5m 140-180w\n- 1m 400w\n- 10m 160-195w\n- 5m 300w\n\nCooldown\n- 30m 150-190w","done":false,"plan":{"h":1.42,"tss":73.0,"km":null,"if":null},"act":null,"comments":[]},{"id":159087052,"date":"2026-11-29","sport":"run","title":"Corrida limiar controlado — 2×8min 4:20–4:15/km + fita (Sem. 5 · dom · pista)","desc":"1º LIMIAR DE CORRIDA DO RETORNO (critério cumprido: panturrilha 0/10 em 21 e 22/11). Pista ou rua plana.\nZona Z2b · limiar controlado — medido por lactato (R1 30/10, LT2 3:57/km). Faixa da zona 4:20–4:10; HOJE na metade lenta: 4:20–4:15/km.\nControle primá A DO PATAMAR = coleta de repouso pré-teste + degraus iniciais enquanto cada valor ≤ média acumulada + 0,3 mmol (0,3 = repetibilidade validada da técnica). Base: Coyle / Pallarés 2016 (basal = valores antes da subida); evita depender de leitura isolada (sensibilidade medida: na bike ±0,1 mmol no basal movia o LT1 em até 18 W). || LT1 PACE: 4:27/km (13,46 km/h) — patamar 1,4 (repouso) · 1,2 · 1,3 → basal 1,30 → alvo 1,80 na curva. Outros: basal+1,0 4:15, log-log 4:19 (a 14 km/h PSE 7 e FC 165 = 88% FCmáx — alto demais p/ teto de Z1). Histórico de hoje: 4:37 (interpolação linear) → 4:31 (basal = mínimo) → 4:27 (média do patamar, regra final). Era 4:58 cru da ergo. || LT2 PACE CONFIRMADO 3:57/km: OBLA 3:56, Dmax Modificado 3:49 (Bishop, subida >0,4), Dmax clássico 4:07; D7 incompleto (4:20). || LT1 FC PROVISÓRIA 155: FC do trecho final dos degraus interpolada em 13,46 km/h = 160; −5 bpm por CONVENÇÃO (FC é o canal primário do Z1 na corrida). Definitiva após rodagem de validação 25 min a 4:27 (coletas min 10 e 25; lactato ≤ ~1,8 e subida ≤0,5; FC = média min 15–25). || LT2 FC 177 mantida. FCmáx 187."},{"v":6,"from":"2026-11-06","ftp":null,"lt1_w":null,"lt2_w":null,"lt1_hr":158,"lt2_hr":177,"max_hr":187,"lt1_pace":267,"lt2_pace":237,"css":null,"vo2max":53.4,"source":"pace=measured_lactate_R1_2026-10-30+confirmed_constant_load_2026-11-06 | hr=measured_lactate_constant_load_2026-11-06 (LT1), measured_lactate_R1_2026-10-30 (LT2)","protocol":"R1 LACTATO corrida 30/10/2026 — pista, incremental 6min/degrau, +1 km/h, pausa 2min, coleta no 1º min, dedo médio (Lactate Plus). Degraus 11.1→17.1 km/h; lactato 1.2/1.3/1.7/2.0/3.9/5.5/9.0 (D7 incompleto 4:20). Basal repouso 1.4.","notes":"v6 (06/11/2026): LT1 4:27/km CONFIRMADO por carga constante 25min @4:27 (média real ~4:26; pista/rua plana, sem esteira): lactato 1,4 repouso · 1,9 min10 · 1,9 min25 (subida 0,0 = estado estável; critério ≤+0,5). 1,9 = basal do dia 1,4 + 0,5 → cai exatamente na definição NPC de LT1. LT1 FC 155 provisó  TSB −2,5 (🟢); ATL/CTL 1,03 — sem estouro de rampa.\n\nSESSÃO — Bike longo Z1 2h30 grupo (outdoor, estrada; local não informado no comentário). Timer 3h11min (elapsed 3h22) vs 2h30 prescrito (+27%). 97,5 km a 30,6 km/h, 1.155 m de ascensão, 22 °C. Pot. média 171 W · NP 203 W · IF 0,72 (FTP 281) · VI 1,19 · FC média 137 / máx 174 · cadência 77 rpm · Pw:Hr 12,6% · TSS 165.\nZonas: a Z1 de bike agora é medida por lactato (npc_lactate_v1, R1 28/10): ≤211 W, alvo 180–205 W, FC <144. A prescrição ainda citava 208 W (estimado) — NP 203 fica dentro dos dois. FC média 137 também abaixo do teto. A sessão é Z1 sem blocos estruturados → sem EF/decoupling de blocos (regra work_blocks); Pw:Hr da sessão (12,6%) entra só como contexto: deriva relevante para Z1, coerente com volume extra + subidas acima do teto. \nVolume: +41 min é crédito aeróbio pela regra 1 (NP dentro da Z1, rampa ok, sem sessão-chave amanhã). Ressalvas: (a) instrução explícita \"ao bater 2h30, volta — sem esticar\" e coaching_flag volume_tendency=overshoot → reforçar o teto; (b) intensidade escondida nas subidas: VI 1,19, pico 773 W e FC máx 174 (bem acima do teto de 144) indicam que o teto não foi segurado quando o grupo abriu. Tempo em zona indisponível (sem série temporal — análise reconstruída do .fit), então não dá para quantificar quanto ficou em Z2a/Z3.\nRPE 3 · Feeling 3 (normal) — compatível com Z1, sem sinal de fadiga escondida.\nNutrição (treino de intestino sem. 1): comentário relata 2 caramanholas com 90 g de carbo em 500 ml cada + 1 de 500 ml só água + 1 gel 30 g com cafeína = ~210 g de carbo em 3h11 (~66 g/h, meta 60 g/h ✅) e ~1,5 L (~470 ml/h). Concentração das caramanholas ~18% (pedido: ~8%, 3 × 600 ml). 2º comentário (19h23): desconforto intestinal ZERO antes/durante/depois; banheiro 2x antes de sair; sódio total 800 mg (~250 mg/h, ~40% dos ~600 mg/h prescritos). Leitura: tolerância boa a 66 g/h mesmo hipertônico — mas em Z1 (IF 0,72), onde o fluxo esplâncnico é preservado; a tolerância em intensidade de prova (IF ~0,80) ainda precisa ser testada. Rotina de banheiro pré-saída funcionou (foi o problema do 70.3). Sódio: em 22 °C e Z1 o déficit é de baixo risco, mas o protocolo de prova é ~600–700 mg/h — próxima sessão deve bater a meta para ensaiar. Faltou só: local e hora de acordar. \nLesão: panturrilha crônica em retorno — sem corrida hoje; último relato (30/10, R1) dor 3/10 bilateral no fim do teste, após corridas Z1 com zero dor em 25 e 26/10.\nSEMANA: Base Aeróbia I, sem. 1 (load), TSS 444/515; com o longão (~75) fecha ~519 — na meta.\nAMANHÃ: longão Z1 70 min. Teto de FC pelas zonas medidas = 155 bpm, pace alvo 4:45–5:10/km (Z1 > 4:27). Descrição no TP já atualizada (FC até 154–155, LT1 do R1, provisório até a validação de 25 min a 4:27). 70 min é teto (overshoot). Dor >2/10 encerra; anotar nível, local e momento. Pernas vêm de 3h11 com 1.155 m — manter o lado lento do alvo.","sum":{"week":{"tss":444,"label":"Base Aeróbia I · semana 1","target":515},"points":[{"t":"good","area":"Intestino","text":"Zero desconforto intestinal com ~66 g de carbo/h, mesmo com as caramanholas a ~18%. Banheiro 2x antes de sair — a rotina funcionou."},{"t":"warn","area":"Nutrição","text":"Sódio 800 mg em 3h11 (~250 mg/h), abaixo dos ~600 mg/h pedidos. Próxima: completar com cápsulas até ~600 mg/h."},{"t":"info","area":"Concentração","text":"Tolerou bem a ~18%, mas em Z1. Manter 3 × 600 ml (~8%) como padrão até testar a concentração alta em intensidade de prova."},{"t":"info","area":"Panturrilha","text":"Sem corrida hoje. Último relato: 3/10 no fim do teste de sexta."}],"verdict":"proceed","headline":"Longo Z1 com a intensidade média certa — mas passou 41 min do teto e estourou o teto nas subidas.","recovery":{"atl":76.1,"ctl":73.7,"rhr":46,"tsb":-2.5,"note":"FC repouso levemente acima da média (44)","hrv_ms":null,"sleep_h":8.7},"tomorrow":{"rules":["Sem acelerar no fim — pernas vêm de 3h11 com 1.155 m","Dor na panturrilha > 2/10 → encerra e anota"],"title":"Longão Z1 · 70 ha mantida.\nSEMANA: Base Aeróbia I · semana 3 (carga), alvo 605 TSS; acumulado ~117 até quarta. O alvo da semana já não é referência: semana de virose, não tentar compensar volume (o Bruno tende a compensar — overshoot).\nAMANHÃ: Bike Z1 leve 45 min (teto), 170–195 W, FC ≤ 135, plano, só se 24 h sem febre e sem antitérmico; FC passando de 140 a ~190 W de forma sustentada = encerrar. Limiar 3×12 Z2b e fita de lactato adiados para a semana 4. Força só core e membros superiores, sem pernas pesadas, pliometria ou excêntrico. Critério para voltar à intensidade: FC de repouso ~45–47 por 2 dias, sem sintomas e FC do Z1 normal para a potência — hoje (51) ainda não.","sum":{"week":{"tss":117,"label":"Base Aeróbia I · semana 3","target":605},"points":[{"t":"bad","area":"Saúde","text":"Febre e dor no corpo em 11/11: nada de intensidade até a FC de repouso voltar a ~45–47 por 2 dias."},{"t":"warn","area":"Volume","text":"Não compensar o volume perdido nesta semana — o alvo de 605 TSS deixa de valer."},{"t":"good","area":"Lesão","text":"Fisio de panturrilha mantida."},{"t":"info","area":"Registro","text":"Anote no TP: febre/antitérmico nas últimas 24 h e como se sentiu."}],"verdict":"reduce","headline":"Dia de virose com febre: corrida cancelada (certo), só fisio. Amanhã só Z1 leve, se estiver 24 h sem febre.","recovery":{"atl":69.4,"ctl":72.3,"rhr":51,"tsb":2.8,"note":"FC de repouso 51 (média ~46) — ainda em recuperação","hrv_ms":null,"sleep_h":8.1},"tomorrow":{"rules":["Tomou antitérmico nas últimas 24 h → descanso total","FC > 140 a ~190 W sustentada → encerrar","Força: só core e membros superiores"],"title":"Bike Z1 leve · 45 min (se 24 h sem febre)","targets":["170–195 W","FC ≤ 135","45 min é teto"]}},"hrv":"warn","flag":"reduce","items":[{"sport":"strength","title":"Mobilidade — quadril e tornozelo 20min (Sem. 3 · qua) → fisioterapia","summary":"Fisioterapia de panturrilha e ombro no lugar da mobilidade (30 min, RPE 1) — substituição prevista na prescrição.","status":"ok" iga.","status":"ok","flags":["sem comentário do atleta","picos acima de 205 W (~17 min)","potência média abaixo do alvo (Z1, sem impacto)"],"tss":54,"wid":212043098,"laps":[{"n":1,"hr":112,"cad":79,"role":"warmup","dur_s":1800,"value":122,"hr_max":151,"status":"warn","target":"Z1 160–185 W → 180–200 W","target_hi":200,"target_lo":160},{"n":2,"hr":125,"cad":89,"role":"work","dur_s":1800,"value":177,"hr_max":141,"status":"ok","target":"Z1 180–200 W","target_hi":200,"target_lo":180,"decoupling_pct":-3.0},{"n":3,"hr":118,"cad":79,"role":"work","dur_s":1800,"value":161,"hr_max":141,"status":"ok","target":"Z1 180–200 W","target_hi":200,"target_lo":180,"decoupling_pct":-2.9},{"n":4,"hr":117,"cad":74,"role":"cooldown","dur_s":80,"value":111,"hr_max":128,"status":"ok","target":"Z1 160–180 W","target_hi":180,"target_lo":160}],"zone_time":[{"min":74.2,"zone":"Z1"},{"min":3.6,"zone":"Z2a"},{"min":4.6,"zone":"Z2b"},{"min":4.1,"zone":"Z2c"},{"min":3.5,"zone":"Z3"},{"min":1.1,"zone":"Z4"}],"metrics":{"ef":null,"if":0.61,"np":172,"vi":1.12,"decoupling_pct":0.0},"lactate":[],"next":"Z1 de estrada: manter a duração no teto e segurar as subidas em ≤205 W; no plano, subir para 180–200 W.","kpis":[{"label":"Duração","value":"1h27","status":"ok","target":"1h30 (teto)"},{"label":"Potência média","value":"153 W","status":"warn","target":"180–200 W"},{"label":"NP","value":"172 W","status":"ok","target":"≤ 205 W"},{"label":"FC média","value":"119 bpm","status":"ok","target":"< 138"},{"label":"Pw:Hr","value":"0,0%","status":"ok","target":"< 5%"},{"label":"Acima de 205 W","value":"~17 min","status":"warn","target":"0 (teto)"},{"label":"Carga","value":"54","status":"ok","target":"66"}],"points":[{"t":"good","text":"FC média 119 e Pw:Hr 0%: nenhum sinal de fadiga para o dia pesado de amanhã."},{"t":"good","text":"Duração dentro do teto (87 de 90 min) — sem esticar o fácil."},{"t":"warn","text":"~17 min acima de 205 W em picos de estrada: amanhã, em 3h, segure as subidas no teto."},{"t":"info","t 172. Bloco principal (15–165 min) 182 W, NP 193, FC 145, decoupling 3,7%. FC a 170–210 W por meia hora: 143/147/139/146/149/152/150 — sempre acima de 140 a ~190 W (gatilho do plano). Pw:Hr da sessão 7,0%. ~60 min acima de 205 W em 16 picos de 235–278 W nas subidas. RPE 5 e Feel 3 (normal) no bike — acima do esperado para Z1 (1–3), coerente com o calor, a pouca água e o carbo abaixo do plano.\nSESSÃO 2 (corrida de transição): planejado 40 min (teto), FC ≤154, plano; pelo gatilho do bike o teto era 30 min. Executado: transição ~14 min (plano ≤10), 32 min, 6,1 km, 5:16/km (dentro do esperado 5:00–5:20), 49 m de subida, FC média 159, máx. 171. FC por 5 min: 145/160/165/163/160/157/163 — ~27 dos 32 min acima de 154 e a maior parte acima do LT1 de FC (158). Pelo pace foi Z1; pela FC, deriva para a zona cinzenta, puxada por calor e desidratação (e carbo abaixo do plano), não por ritmo. RPE 6 (esperado 1–3 num Z1) e Feel 5 no Intervals (fraco; 1 = forte … 5 = fraco) = 1 na escala NPC: fadiga escondida. FC registrada no Forerunner 935; uso de cinta não informado.\nCOMENTÁRIOS (lidos): bike — \"pedal solo, muito calor, 2 litros de água, banana passa, 2 sachês de eletrólitos; estava sem carboidrato hoje e sofri no final\". Correção do atleta em 22/11: foram 200 g de banana passa, não 100 g. Corrida — \"difícil pós-pedal, muito calor, 500 ml de água, sem gel novamente\".\nNUTRIÇÃO (revisada em 22/11 com a correção do atleta): o objetivo do dia era treino de intestino a 60 g/h (~180–200 g). Foram ~140 g de carbo em 3h17 (200 g de banana passa ≈ 70% de carbo), ~43 g/h — cerca de 70% do plano, todo em sólido e sem gel/bebida de carbo. O intestino foi treinado em parte (aceitou ~43 g/h de sólido no calor), mas o alvo de 60 g/h ainda não foi testado. Hidratação foi o ponto mais fraco: ~0,6 L/h de água a 27→32 °C. A FC subindo a potência constante, o sofrimento no fim do bike e a corrida pesada se explicam mais por calor + desidratação, com o carbo abaixo do plano somando no final. P ingo fim de tarde): 10 min 160–185 W → 100 min 180–200 W → 10 min 160–180 W. Teto 205 W também nas subidas; FC de referência < 138–140. Rolo ou plano. Cortes: chegou de viagem → 15 min iniciais bem leves; pernas pesadas ou FC > 140 a ~185 W no plano por 10 min → 1h15. Carbo 40–60 g/h + água. No comentário: RPE, Feel, dor da panturrilha ao acordar.","sum":{"week":{"tss":417,"label":"Base Aeróbia I · semana 4 (plano ajustado ~490)","target":565},"points":[{"t":"good","area":"Recuperação","text":"Sono de 9h12 e TSB subindo de −14 para −5: a sexta pesada foi absorvida."},{"t":"warn","area":"Nutrição","text":"Bike de amanhã com 40–60 g/h de carbo: leve gel ou bebida, não repita a sexta."},{"t":"info","area":"Lesão","text":"Sem atividade hoje, a dor da panturrilha ao acordar não foi registrada: anote no comentário do bike."},{"t":"good","area":"Semana","text":"Com o bike de domingo a semana fecha em ~506 TSS, em linha com o plano ajustado."}],"verdict":"proceed","headline":"Sábado de descanso/viagem como planejado: sono de 9h12 e TSB de volta a −5 — pronto para o bike Z1 de domingo.","recovery":{"atl":67.5,"ctl":62.4,"rhr":45,"tsb":-5.1,"note":"2ª noite seguida >8h; FC de repouso na média; sem VFC","hrv_ms":null,"sleep_h":9.2},"tomorrow":{"rules":["Chegou de viagem → 15 min iniciais bem leves","Pernas pesadas ou FC > 140 a ~185 W por 10 min → corta para 1h15","Comentário: RPE, Feel, dor da panturrilha ao acordar"],"title":"Bike Z1 · 2h00 (domingo fim de tarde)","targets":["180–200 W","Teto 205 W também nas subidas","FC < 140 a ~185 W","40–60 g/h de carbo"]}},"hrv":"ok","flag":"proceed","items":[]},"2026-11-22":{"d":"2026-11-22","at":"22/11 21:56","short":"Bike Z1 de 1h56 na rua (teto 2h00): bloco principal a 190 W (alvo 180–200), decoupling 2,4%, TSS 91 (plano 89), RPE 4 e Feel 3. Atenção: a potência alternou faixas de ~205 W e ~190 W, somando ~42 min acima do teto de 205 W (~35 min na zona cinzenta). A FC ficou em 143–150 a ~190 W, uns 10 bpm acima do normal pelo 2º trei lido) trouxe só a nutrição; a dor da panturrilha ao acordar, pedida no plano, não foi anotada. O plano da semana 5 registra 0/10 por 2 dias e libera o retorno. Anotar a dor 0–10 na corrida de amanhã.\nVOLUME: 1h56 contra 2h00 de teto. Sem excesso de volume; o desvio foi de zona.\nSEMANA: Semana 4 (Base Aeróbia I, carga) fecha com 508 TSS contra 565 no macro e ~490 no plano ajustado pela viagem.\nAMANHÃ: Segunda (semana 5, descarga mais branda ~320 TSS): fisioterapia 30 min às 06h30 → corrida Z1 45 min às 07h00, plano, FC ≤ 154, pace livre (ref. 4:45–5:10/km); FC > 154 com pace mais lento que 5:10 → caminhar 1 min; dor > 2/10 → encerrar. Terça: bike Z1 1h35 (aquec. 20 min, principal 60 min a 180–195 W, desaq. 15 min) com checagem da FC dos min 30–60 (≤ 140 normalizou; > 145 → encurtar a série para 30 min e o limiar de corrida de domingo vira Z1), depois força com personal, carga reduzida.","sum":{"week":{"tss":508,"label":"Base Aeróbia I · semana 4 (ajustada para ~490)","target":565},"points":[{"t":"warn","area":"Zona","text":"Z1 é até 205 W, também nos trechos rápidos. Hoje foram ~40 min acima disso."},{"t":"warn","area":"FC","text":"FC ~10 bpm acima do normal pelo 2º treino seguido. A checagem de terça (min 30–60) decide."},{"t":"warn","area":"Hidratação","text":"1 L em 2h a 25 °C é pouco: mire ≥ 0,75 L/h com sódio nos próximos bikes."},{"t":"info","area":"Lesão","text":"Dor da panturrilha não veio no comentário. Anote 0–10 na corrida de amanhã, durante e ao acordar."},{"t":"good","area":"Recuperação","text":"Sono de quase 10h e FC de repouso 41: pronto para abrir a semana 5."}],"verdict":"proceed","headline":"Bike Z1 no alvo de média, mas com ~40 min acima de 205 W e FC alta. Segunda: fisio + corrida Z1 de 45 min.","recovery":{"atl":70.6,"ctl":63.0,"rhr":41,"tsb":-7.6,"note":"Sono 10h e FC de repouso 41, a menor da semana","hrv_ms":null,"sleep_h":9.97},"tomorrow":{"rules":["FC > 154 com pace mais lento que 5:10 → caminha 1 min","Dor > 2/10 → caminha e encerra","Te ma sessão −5 W. (2) sex 20/11 (feriado): pedal longo Z1 3h00 TETO, 180–200 W, teto 205 W inclusive nas subidas — se for em grupo, sair à frente ou sozinho nas subidas; o sábado 14/11 teve 34 min acima do LT1. (3) demais: Z1 60 min.\nCORRIDA (~3 h, sem progressão): só Z1, em terreno plano/esteira 1%, FC ≤154 COM CINTA (sem cinta, julgar só por pace 4:45–5:10 e RPE ≤3). Longão 70 min TETO (não 90). Dor >2/10 encerra; anotar dor 0–10, lado e km em toda corrida. O 1º limiar de corrida (2×8 min Z2b 4:20–4:15/km) continua ADIADO: só é liberado depois de 2 corridas seguidas com dor ≤1/10 e RPE ≤3; se a dor passar de 2/10 ou aparecer no dia seguinte, a corrida da semana 5 desce 20%.\nFORÇA/FISIO: 2× força (protocolo de panturrilha do fisio + core + superiores), fisio 2×/sem; SEM pliometria nesta semana (curva de dor subindo).\nNUTRIÇÃO: bike longo a 60 g/h (não subir para 70), pó pesado antes, ≤10%, sódio ~600 mg/h; registrar g/h, volume, GI 0–10 e hora de acordar.\nLACTATO: nenhuma validação de LT1/MLSS na semana 3. Manter: perfil de potência 26/11 (sem. 5) e MLSS 250 W 30 min em 01/12 (sem. 6; critério Beneke ≤1,0 mmol do min 10 ao 30). Sem mudança de passaporte.","bike_flags":["10/11 Z1: potência certa (202–204 W), FC 145 acima do teto 141 — FC de repouso alta (51)","12/11 Z1 pós-virose: blocos a ~204 W (teto 195) com FC 150–151; 2º bloco não deveria ter sido feito","14/11 longo em grupo: NP 188 W ok, mas ~34 min >205 W e FC máx 177; nutrição ~40 g/h"],"run_flags":["11/11 Z1 não feita (febre) — correto","13/11 Z1 48 min a 5:02–5:06/km, FC 139→153 (pico 157), RPE 4/Feel 4; dor 1/10","15/11 longão 61/80 min a 5:05/km, FC ÓPTICA (sem cinta), RPE 5, dor 2/10 voltando"],"sessoes":"Bike: carga externa certa, intensidade escondida no grupo do sábado; resposta cardíaca normalizou no sábado. Corrida: pace sempre Z1, mas carga interna alta (RPE 4–5) e dor 1→2/10; HR do domingo sem cinta, fora da análise. Força: 3 sessões leves, sem pliometria. Sem lactato.","visual":{"next":{"tss" m 38–60 min acima de 205 W. Carga reconciliada: soma das atividades = 508 = training_load_daily (força incluída). CTL 61,0 → 63,0 (ramp +0,6), ATL 70,6, TSB −7,6. Sem degrau de transição TP→Intervals visível (a série toda já está na fonte Intervals). Semana 5 = descarga do macro, com o limiar de corrida e o teste de potência condicionados à checagem de FC de terça.","destaques":["Bike limiar 3×12 min a 222/221/222 W, VI 1,00 — execução exata; lactato 3,3 (tolerância)","Panturrilha 2 → 1 → 1 → 0/10: critério do 1º limiar de corrida cumprido","Corrida de transição após 3h17 de bike no calor com dor só 1/10","Sono médio 8,3 h e FC de repouso 41–45: recuperação sólida no fim da semana","Aderência 99% ao plano ajustado pela viagem (512 → 508 TSS)"],"alertas":["FC ~10 bpm acima do normal na mesma potência nos bikes de 20 e 22/11 (sem deriva) — checar na terça antes do teste e do MLSS","Z1 subindo: corridas com 12 e 27 min acima de 154 bpm; bikes com 38–60 min acima de 205 W","Hidratação 0,5–0,6 L/h e carbo 38–43 g/h nos longos (plano 60 g/h e ≥0,75 L/h no calor)","Volume acima do teto: corrida qua 57/50 min (ondulado, pedido era plano); bike sex 3h17/3h00","Registro: força de quinta não lançada; dor sem lado/km; força de terça foi pernas em vez do protocolo da panturrilha"],"descarga":true,"taper":false,"rev_zonas":false,"red_vol":37,"prescricao":"SEMANA 5 (23–29/11) · DESCARGA · ALVO 320 TSS (teto; macro 290). Por quê +30: a semana 3 já foi meio descarregada pela virose e o CTL está parado (~63); 320 ainda é −37% sobre os 508 desta semana — suficiente para o ATL cair abaixo do CTL e chegar com TSB positivo ao teste de quinta e ao MLSS de 01/12 (descarga de 40–60% do volume mantendo um toque de intensidade preserva as adaptações — Mujika/Bosquet). 2 dias sem cardio.\nCHECAGEM DE FC (decide a semana): terça, bike Z1 1h20 a 180–195 W no plano, FC média dos min 20–50: ≤140 = normalizou → segue tudo; 141–145 = limiar de corrida de domingo vira Z1 40 min; >145 = encurta para 50 min, o limiar de corrida sai e o teste de quinta vira Z1 60 min (repetir a checagem na sexta). Motivo: com a FC deslocada ~10 bpm, teste máximo e MLSS dão valores falsamente baixos.\nBIKE (~3h30): ter checagem 1h20; QUI 26/11 teste de perfil de potência no velódromo (protocolo do macro, sem fitas; registrar picos 5 s/1 min/5 min); sáb Z1 1h30 a 180–200 W. Teto 205 W também nas subidas — esta semana sem exceção.\nCORRIDA (teto 2h00 no total, só plano/pista, FC com cinta): seg Z1 45 min FC ≤154; qua Z1 40 min FC ≤154; DOM 29/11 1º limiar do retorno: 2×8 min Z2b 4:20–4:15/km (pista) com 3 min trote, aquec 20 + desaq 10, FC só valida (158–177). Gate do domingo: checagem de FC ok + panturrilha 0/10 ao acordar e 0–1/10 em 10 elevações unipodais. Dor >2/10 encerra; dor no dia seguinte >1/10 → semana 6 volta a só Z1 na corrida. FC >154 em Z1 → caminhar 1 min (regra para o creeps_up).\nFORÇA/FISIO: 2× protocolo da panturrilha + core + superiores (seg e qua, RPE ≤4). Na segunda, testar o critério de pliometria (25–30 elevações unipodais sem dor); passou → pliometria leve só na semana 6.\nNUTRIÇÃO/HIDRATAÇÃO: em todo treino >60 min, ≥0,75 L/h com sódio (~600 mg/h) e 40–60 g/h de carbo, parte em gel/bebida. O treino de 60 g/h volta no longo da semana 6.\nREGISTRO: dor 0–10 + lado + km em toda corrida; lançar toda força no Intervals com RPE.\nSEMANA 6: MLSS bike 30 min a 250 W na terça 01/12 só se a checagem de FC da semana 5 normalizar (≤140); senão adiar 1 semana. Zonas: sem mudança de passaporte. A fita de 17/11 (3,3 mmol a 222 W) é checagem de sessão, não validação de LT1/MLSS → próximo limiar de bike segue 215–222 W.","bike_flags":["17/11 limiar 3×12 a 222 W, VI 1,00, FC 148→156, lactato 3,3 (esperado 2,2–3,0 +0,5) → mantém 215–222 W","19/11 Z1 1h27, NP 172 W, FC 119, Pw:Hr 0% — sem fadiga; 17 min em picos >205 W","20/11 longo 3h17 (teto 3h), 27→32 °C, ~60 min >205 W nas subidas, FC 145 a 182 W, 43 g/h e 0,6 L/h","22/11 Z1 1h56, 190 W, decoupling 2,7%, mas FC ~147 a 185–1 const fmtN = (v, d=0) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtH = h => { if (h == null) return '—'; const m = Math.round(h*60); const hh = Math.floor(m/60), mm = m%60; return hh ? `${hh}h${String(mm).padStart(2,'0')}` : `${mm}min`; };

// Linhas verticais (hoje, provas) e faixas — plugin próprio, sem dependências
const markers = {
  id: 'markers',
  afterDatasetsDraw(chart, _args, opts) {
    const {ctx, chartArea:{top, bottom, left, right}, scales:{x}} = chart;
    // eixo de categorias: converte o rótulo em índice SEM deixar o Chart.js criar rótulos novos
    const px = v => { if (x.type === 'category') { const i = chart.data.labels.indexOf(v); return i < 0 ? null : x.getPixelForValue(i); } return x.getPixelForValue(v); };
    ctx.save();
    for (const b of (opts.bands || [])) {
      const x0 = px(b.from), x1 = px(b.to); if (x0 == null || x1 == null) continue;
      ctx.fillStyle = b.color; ctx.fillRect(Math.max(left, Math.min(x0,x1)), top, Math.abs(x1-x0), bottom-top);
    }
    for (const l of (opts.lines || [])) {
      const p = px(l.x);
      if (p == null || isNaN(p) || p < left - 1 || p > right + 1) continue;
      ctx.strokeStyle = l.color; ctx.lineWidth = l.width || 1; ctx.setLineDash(l.dash || [4,4]);
      ctx.beginPath(); ctx.moveTo(p, top); ctx.lineTo(p, bottom); ctx.stroke(); ctx.setLineDash([]);
      if (l.label) { ctx.fillStyle = l.color; ctx.font = '600 10px system-ui'; const rt = p > right - 90; ctx.textAlign = rt ? 'right' : 'left'; ctx.fillText(l.label, p + (rt ? -4 : 4), top + 10 + (l.row||0)*12); }
    }
    ctx.restore();
  }
};
Chart.register(markers);

function parseNote(t){
  t = (t || '').trim(); const vol = [];
  const m = t.match(/^\[([^\]]*)\]\s*/);
  if (m) { t = t.slice(m[0].length); m[1].split('·').forEach(x => { const mm = x.trim().match(/^(\S+)\s+([\d.,]+)h$/); if (mm && parseFloat(mm[2].replace(',','.')) > 0) vol.push([mm[1], parseFloat(mm[2].replace(',','.'))]); }); }
  const secs = t.split(/\s+\|\s+/).map((chunk, i) => {
    let title = i === 0 ? 'A semana' : '', body = chunk.trim();
    const hm = i > 0 && body.match(/^([A-ZÁÉÍÓÚÂÊÔÃÕÇ][^:]{0,70}?):\s+/);
    if (hm) { title = hm[1]; body = body.slice(hm[0].length); } else if (i > 0) title = 'Observação';
    const kind = /^LACTATO/i.test(title) ? 'lac' : /^NUTRI/i.test(title) ? 'nut' : '';
    const items = body.split(/(?<=[.;])\s+(?=[A-ZÁÉÍÓÚÂÊÔÃÕÇ])/).map(x => x.replace(/;$/,'').trim()).filter(Boolean);
    return {title, kind, items};
  }).filter(x => x.items.length);
  return {vol, secs};
}
const VOL_COLOR = {bike:'var(--bike)', corrida:'var(--run)', 'natação':'var(--swim)', 'força':'var(--strength)'};
function fmtHd(h){ const H = Math.floor(h), M = Math.round((h - H) * 60); return M ? `${H}h${String(M).padStart(2,'0')}` : `${H}h`; }
function emph(x){ return esc(x).replace(/\b([A-ZÁÉÍÓÚÂÊÔÃÕÇ]{4,}(?:[ -][A-ZÁÉÍÓÚÂÊÔÃÕÇ0-9.]{2,})*)\b/g, '<b>$1</b>'); }
function volChips(n){ return n.vol.length ? `<div class="vchips">${n.vol.map(([k,h]) => `<span class="vchip"><i style="background:${VOL_COLOR[k]||'var(--other)'}"></i>${esc(k)} ${fmtHd(h)}</span>`).join('')}</div>` : ''; }

function compliance(w){
  if (!w.done) return w.date < TODAY ? 'miss' : 'fut';
  const p = w.plan.tss || null, act = w.act.tss || null;
  let r = null;
  if (p && act) r = act / p; else if (w.plan.h && w.act.h) r = w.act.h / w.plan.h;

function drawPMC(a){
  kill('pmc');

  let start;
  if (state.pmcRange === 'plan') start = a.plan ? addDays(a.plan.start, -28) : addDays(TODAY, -90);
  else start = addDays(TODAY, -state.pmcRange);
  const hist = a.pmc.filter(p => p.d >= start);
  const showProj = state.pmcRange === 'plan' || state.pmcRange <= 180;
  const fut = showProj ? (state.pmcRange === 'plan' ? proj : proj.filter(p => p.d <= addDays(TODAY, 42))) : [];
  const labels = hist.map(p => p.d).concat(fut.map(p => p.d));
  const pad = arr => Array(hist.length).fill(null).concat(arr);
  const histPad = arr => arr.concat(Array(fut.length).fill(null));
  const joinProj = key => { const r = pad(fut.map(p => p[key])); if (fut.length && hist.length) r[hist.length-1] = hist[hist.length-1][key]; return r; };
  const races = (a.events||[]).filter(e => e.date >= labels[0] && e.date <= labels[labels.length-1]);
  charts.pmc = new Chart($('#pmc'), {
    data: {labels, datasets: [
      {type:'bar', label:'TSS', data: histPad(hist.map(p=>p.tss)), backgroundColor:'rgba(91,100,120,.55)', yAxisID:'y1', barPercentage:1, categoryPercentage:1, order:5},
      {type:'bar', label:'TSS planejado', data: pad(fut.map(p=>p.tss)), backgroundColor:'rgba(91,100,120,.22)', yAxisID:'y1', barPercentage:1, categoryPercentage:1, order:5},
      {type:'line', label:'CTL', data: histPad(hist.map(p=>p.ctl)), borderColor:'#4a9eff', backgroundColor:'rgba(74,158,255,.12)', fill:true, pointRadius:0, borderWidth:2, order:1},
      {type:'line', label:'ATL', data: histPad(hist.map(p=>p.atl)), borderColor:'#f472b6', pointRadius:0, borderWidth:1.5, order:2},
      {type:'line', label:'TSB', data: histPad(hist.map(p=>p.tsb)), borderColor:'#f5c542', pointRadius:0, borderWidth:1.5, order:3},
      {type:'line', label:'CTL projetado', data: joinProj('ctl'), borderColor:'#4a9eff', borderDash:[5,4], pointRadius:0, borderWidth:2, order:1},
      {type:'line', label:'ATL projetado', data: joinProj('atl'), borderColor:'#f472b6', borderDash:[5,4], pointRadius:0, borderWidth:1, order:2},
      {type:'line', label:'TSB projetado', data: joinProj('tsb'), borderColor:'#f5c542', borderDash:[5,4], pointRadius:0, borderWidth:1, order:3},

// SpO2 noturna: só sinalizador de doença respiratória (não é métrica de recuperação).
// MESMA regra da skill npc-daily-analysis (seção 2.1), com as mesmas janelas:
//  base   = noites de [D−60, D−2] (D = última noite com SpO2), n >= 20; limite = média − 2 DP (amostral)
//  alerta = noites D e D−1 (seguidas) <= limite E FC de repouso de D >= média de [D−7, D−1] + 5 bpm (mín. 3 dias)
// SpO2 baixa sem FC alta = provável posição de dormir (sensor de pulso) → só "atenção".
function spo2Eval(a){
  const w = (a.wellness||[]).filter(x => x.spo2 != null).sort((x,y) => x.d < y.d ? -1 : 1);
  if (w.length < 2) return null;
  const last = w[w.length-1], prev = w[w.length-2];
  if (last.d < addDays(TODAY,-2)) return null;
  const base = w.filter(x => x.d >= addDays(last.d,-60) && x.d <= addDays(last.d,-2)).map(x => x.spo2);
  if (base.length < 20) return null;
  const mean = base.reduce((s,v)=>s+v,0)/base.length;
  const sd = Math.sqrt(base.reduce((s,v)=>s+(v-mean)**2,0)/(base.length-1));
  const lim = mean - 2*sd;
  const consec = (new Date(last.d) - new Date(prev.d)) / 864e5 === 1;
  const low2 = consec && last.spo2 <= lim && prev.spo2 <= lim;
  const rh = (a.wellness||[]).filter(x => x.rhr != null && x.d < last.d && x.d >= addDays(last.d,-7)).map(x => x.rhr);
  const rhrBase = rh.length >= 3 ? rh.reduce((s,v)=>s+v,0)/rh.length : null;
  const rhrNow = ((a.wellness||[]).find(x => x.d === last.d) || {}).rhr;
  const rhrUp = rhrBase != null && rhrNow != null && rhrNow >= rhrBase + 5;
  const st = low2 && rhrUp ? 'alert' : low2 || last.spo2 <= lim ? 'watch' : 'ok';
  return {st, last, lim, mean, rhrNow, rhrBase};
}
function spo2Flag(a){
  const r = spo2Eval(a); if (!r) return '';
  const ST = {ok:['var(--ok)','✓ normal'], watch:['var(--warn)','atenção — provável posição de dormir; ver próxima noite'], alert:['var(--miss)','⚠ alerta respiratório — SpO2 baixa 2 noites + FC de repouso alta: treino do dia em Z1 curto ou descanso']};
  const [c, txt] = ST[r.st];
  return `<div class="small section" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:6px 10px;border-left:3px solid ${c};background:var(--bg2);border-radius:6px">
    <b>SpO2 noturna</b><span>${fmtN(r.last.spo2,1)}% <span class="muted">(${ddmm(r.last.d)} · média ${fmtN(r.mean,1)}% · limite ${fmtN(r.lim,1)}%)</span></span>
    ${r.rhrNow != null && r.rhrBase != null ? `<span class="muted">FC repouso ${r.rhrNow} vs ${fmtN(r.rhrBase,0)} (7d)</span>` : ''}
    <span style="color:${c};font-weight:600">${txt}</span></div>`;
}

// ── SESSÕES-CHAVE (limiar, validações, testes) ─────────────────────────
const STYPE = {z2b:['Limiar controlado','#22c55e'], z2c:['Limiar alto','#eab308'], mlss:['MLSS','#f97316'], valid:['Validação','#38bdf8'], test:['Teste incremental','#a78bfa'], blocos:['Outros blocos','#9aa0b2'], z1:['Z1 / rodagens','#3b82f6']};
function sessType(t, n){ t = t || ''; if (/mlss/i.test(t)) return 'mlss'; if (/valida/i.test(t)) return 'valid'; if (/incremental|r1 lactato/i.test(t)) return 'test'; if (/limiar alto|z2c/i.test(t)) return 'z2c'; if (/limiar controlado|z2b/i.test(t)) return 'z2b'; if (/\bz1\b|recupera|regenera|longo|longão/i.test(t)) return n >= 1 ? 'z1' : null; return n >= 2 ? 'blocos' : null; }
function keySessions(a){
  const out = [];
  Object.values(a.daily || {}).forEach(day => (day.items || []).forEach(it => {
    const sk = sportKey(it.sport); if (sk !== 'bike' && sk !== 'run') return;
    const w = it.wid ? a.workouts.find(x => String(x.id) === String(it.wid)) : null;
    const work = (it.laps || []).filter(l => l.role === 'work' && l.value != null && l.dur_s);
    const title = (w && w.title) || it.title || '';
    // atividade avulsa sem prescrição (título genérico do Garmin): os laps automáticos não são blocos de trabalho
    if (/^(running|road cycling|cycling|indoor cycling|virtual ride|treadmill running|corrida|ciclismo)$/i.test(title.trim()) && !/mlss|valida|incremental|r1 lactato|limiar|z2b|z2c/i.test(it.title || '')) return;
    const type = sessType(`${it.title || ''} ${title}`, work.length); if (!type) return; // título da análise primeiro: ela reclassifica (ex.: longo Z1 que virou MLSS)
    const wm = k => { const ps = work.filter(l => l[k] != null); const t = ps.reduce((s, l) => s + l.dur_s, 0); return t ? ps.reduce((s, l) => s + l[k] * l.dur_s, 0) / t : null; };
    const tl = work.find(l => l.target_lo != null && l.target_hi != null);
    const m = it.metrics || {};
    out.push({d: day.d, wid: it.wid, w, sport: sk, title, type, work, n: work.length, dur: work.reduce((s, l) => s + l.dur_s, 0),
      val: wm('value'), hr: wm('hr'), lo: tl && type !== 'test' ? Math.min(tl.target_lo, tl.target_hi) : null, hi: tl && type !== 'test' ? Math.max(tl.target_lo, tl.target_hi) : null,
      ef: m.ef, dec: m.decoupling_pct, lac: (it.lactate || []).map(x => x.mmol).filter(v => v != null),
      rpe: w && w.act ? w.act.rpe : null, status: it.status, summary: it.summary});
  }));
  return out.sort((x, y) => y.d.localeCompare(x.d));
}
function sessDelta(s){
  if (s.type === 'test') return ['teste em degraus', ''];
  if (s.val == null || s.lo == null) return ['sem alvo', ''];
  if (s.type === 'z1') { const over = s.sport === 'bike' ? s.val > s.hi : s.val < s.lo; if (!over) return ['dentro da Z1', 'g']; const d = s.sport === 'bike' ? s.val - s.hi : s.lo - s.val; return [s.sport === 'bike' ? `+${Math.round(d)} W acima da Z1` : `${Math.round(d)} s/km rápido demais`, d > (s.sport === 'bike' ? 10 : 8) ? 'r' : 'y']; }
  if (s.val >= s.lo && s.val <= s.hi) return ['no alvo', 'g'];
  if (s.sport === 'bike') { const d = s.val > s.hi ? s.val - s.hi : s.val - s.lo; return [`${d > 0 ? '+' : '−'}${Math.round(Math.abs(d))} W ${d > 0 ? 'acima' : 'abaixo'}`, Math.abs(d) > 10 ? 'r' : 'y']; }
  const d = s.val < s.lo ? s.lo - s.val : s.val - s.hi; const fast = s.val < s.lo;
  return [`${Math.round(d)} s/km ${fast ? 'mais rápido' : 'mais lento'}`, d > 8 ? 'r' : 'y'];
}
function copyLink(btn, wid){

        ${k !== 'swim' && cur.max_hr ? `<div><span>FC máx</span><b>${cur.max_hr} bpm</b></div>` : ''}
        ${cur.css ? `<div><span>CSS</span><b>${fmtPace(cur.css)}/100m</b></div>` : ''}
        ${swimLt1 ? `<div><span>LT1 ritmo${cur.lt1_pace ? '' : ' (estimado)'}</span><b>${fmtPace(swimLt1)}/100m</b></div><div><span>LT2 ritmo ≈ CSS</span><b>${fmtPace(cur.css)}/100m</b></div>` : ''}
      </div>
      </div><div>
      ${Z[k] && Z[k].length ? `<h4 style="margin:0 0 6px">Zonas de treino <span class="sub">${({lactate:'medidas por lactato', field_test:'pelo teste de campo (CSS)', ventilatory:'pela ergoespirometria'})[Z[k][0].source] || 'estimadas'} · as mesmas do Intervals.icu</span></h4>${zonesTable(k, Z[k])}`
        : z.length ? `<h4 style="margin:0 0 6px">Zonas de treino <span class="sub">calculadas do passaporte (estimadas)</span></h4><div class="tbl-wrap"><table><thead><tr><th></th><th>Z1 · base</th><th>Z2 · limiar</th><th>Z3 · acima do LT2</th></tr></thead><tbody>${z.map(r => `<tr><td class="muted">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>
          <div class="small muted section"><b>Z1 · base</b> — volume, técnica e educativos (mais de 80% do volume). <b>Z2 · limiar</b> — séries do duplo limiar, firmes e controladas, sem passar do CSS. <b>Z3</b> — mais rápido que o CSS, só em séries curtas planejadas.</div>` : ''}
      </div></div>
      ${cur.protocol ? `<details class="section"><summary class="small muted" style="cursor:pointer;min-height:32px">Como os limiares foram definidos</summary><div class="note section">${esc(cur.protocol)}</div></details>` : ''}
      ${P[k].length > 1 ? `<details class="section"><summary class="small muted" style="cursor:pointer;min-height:32px">Histórico de versões (${P[k].length})</summary><div class="tbl-wrap section"><table><thead><tr><th>v</th><th>Desde</th><th class="n">LT1</th><th class="n">LT2</th><th class="n">FC</th></tr></thead><tbody>${P[k].slice().reverse().map(v => `<tr><td>${v.v}</td><td>${ddmmyy(v.from)}</td><td class="n">${v.lt1_w ? v.lt1_w+' W' : v.lt1_pace ? fmtPace(v.lt1_pace) : '—'}</td><td class="n">${v.lt2_w ? v.lt2_w+' W' : v.lt2_pace ? fmtPace(v.lt2_pace) : '—'}</td><td class="n">${v.lt1_hr||'—'}/${v.lt2_hr||'—'}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
    </div>`; }).join('')}</div>
    <div class="card section"><h3>Como ler as zonas</h3><div class="grid g2 small">
      <div><b>3 domínios, 2 limiares</b><br><span class="muted">LT1 é onde o lactato começa a subir acima do repouso; LT2 é onde ele passa a acumular sem parar. Z1 fica abaixo do LT1, Z2 entre os dois e Z3 acima do LT2.</span></div>
      <div><b>O limiar norueguês fica ABAIXO do LT2</b><br><span class="muted">A Z2 é dividida: zona cinzenta (não usada), limiar controlado (sessão longa) e limiar alto (sessão curta). Os dois treinos de limiar miram o "Alvo do treino"; o LT2 é o teto, nunca o alvo.</span></div>
      <div><b>Escala norueguesa (Olympiatoppen)</b><br><span class="muted">A etiqueta ao lado de cada zona mostra a equivalência: Z1 = I-1/I-2 (leve) · Z2a/Z2b/Z2c = I-3 (limiar — onde mora o método norueguês: manhã ~2,5 e tarde ~3,5 mmol) · Z3 = I-4 · Z4 = I-5. As I-1 e I-2 ficam juntas porque a fita não separa com segurança ~1 de ~2 mmol.</span></div>
      <div><b>Mesmos números do Intervals.icu</b><br><span class="muted">As faixas vêm da mesma tabela que monta os treinos no Intervals.icu. "Medido" = teste de lactato; "estimado" = % do FTP, CSS ou outro teste. FC é validador quando há pace (corrida), watts (bike) e ritmo (natação); para quem não tem medidor de potência nem pace validado, a FC é o controle.</span></div>
    </div></div>`;
}

// ── COMPARATIVO ──────────────────────────────────────────────────────
function vComp(){
  const start = addDays(TODAY, -120);
  const rows = KEYS.map(k => { const a = DB.athletes[k], l = a.pmc[a.pmc.length-1], cw = curWeek(a) || {}; return {k, a, l, cw}; });
  $('#view').innerHTML = `
  <div class="card"><h3>CTL — últimos 120 dias e projeção</h3><div class="chart-box"><canvas id="comp-ctl"></canvas></div>
    <div class="legend">${KEYS.map(k => `<span><i class="dot" style="background:${ATH_COLOR[k]}"></i>${esc(DB.athletes[k].short)}</span>`).join('')}<span>- - - projeção pelo plano</span></div></div>
  <div class="card section"><h3>% do alvo semanal cumprido</h3><div class="chart-box md"><canvas id="comp-pct"></canvas></div></div>
  <div class="card section"><h3>Agora</h3><div class="tbl-wrap"><table><thead><tr><th>Atleta</th><th class="n">CTL</th><th class="n">ATL</th><th class="n">TSB</th><th class="n">TSS semana</th><th class="n">Alvo semana</th><th>Próxima prova A</th></tr></thead><tbody>${rows.map(r => { const ra = nextRaces(r.a).find(e => e.priority === 'A'); return `<tr><td><span class="dot" style="background:${ATH_COLOR[r.k]}"></span> ${esc(r.a.short)}</td><td class="n">${fmtN(r.l.ctl,1)}</td><td class="n">${fmtN(r.l.atl,1)}</td><td class="n">${sign(r.l.tsb)}</td><td class="n">${fmtN(r.cw.tss)}</td><td class="n">${fmtN(r.cw.target_tss)}</td><td>${ra ? `${esc(ra.name)} · ${daysBetween(TODAY, ra.date)} dias` : '—'}</td></tr>`; }).join('')}</tbody></table></div>
    <div class="note section">Compare tendências e % do plano, não valores absolutos: CTL e TSS dependem do FTP/limiar de cada um.</div></div>`;
  const endAll = KEYS.map(k => DB.athletes[k].projection || []).flat().map(p => p.d).sort().pop() || TODAY;
  const labels = []; for (let x = start; x <= endAll; x = addDays(x, 1)) labels.push(x);
  const ds = [];
  for (const k of KEYS) {
    const a = DB.athletes[k];
    const hm = Object.fromEntries(a.pmc.map(p => [p.d, p.ctl])), pm = Object.fromEntries((a.projection||[]).map(p => [p.d, p.ctl]));
    ds.push({type:'line', label: a.short, data: labels.map(x => x <= TODAY ? hm[x] ?? null : null), borderColor: ATH_COLOR[k], pointRadius:0, borderWidth:2, spanGaps:true});
    ds.push({type:'line', label: a.short + ' (projeção)', data: labels.map(x => x === TODAY ? hm[x] ?? null : x > TODAY ? pm[x] ?? null : null), borderColor: ATH_COLOR[k], borderDash:[5,4], pointRadius:0, borderWidth:1.5, spanGaps:true});
  }
  const races = KEYS.flatMap(k => DB.athletes[k].events || []).filter((e,i,arr) => e.date >= start && e.date <= endAll && arr.findIndex(x => x.date === e.date && x.name === e.name) === i);
  charts.compCtl = new Chart($('#comp-ctl'), {data:{labels, datasets:ds}, options:{interaction:{mode:'index',intersect:false}, plugins:{tooltip:{callbacks:{title: it => ddmmyy(it[0].label), label: c => c.raw==null?null:`${c.dataset.label}: ${fmtN(c.raw,1)}`}}, markers:{lines:[{x:TODAY,color:'#ff7c3a',label:'hoje'}].concat(races.map((e,i)=>({x:e.date,color:'#ff5252',label:e.name,row:i%3,dash:[]})))}},
    scales:{x:{ticks:{maxTicksLimit:10, callback(v){return ddmm(this.getLabelForValue(v));}}, grid:{display:false}}, y:{title:{display:true,text:'CTL'}}}}});
  const mons = [...new Set(KEYS.flatMap(k => DB.athletes[k].weeks.filter(w => w.target_tss && w.tss != null).map(w => w.mon)))].sort();
  charts.compPct = new Chart($('#comp-pct'), {type:'bar', data:{labels: mons.map(ddmm), datasets: KEYS.map(k => { const by = Object.fromEntries(DB.athletes[k].weeks.map(w => [w.mon, w])); return {label: DB.athletes[k].short, data: mons.map(m => by[m] && by[m].target_tss && by[m].tss != null ? Math.round(by[m].tss/by[m].target_tss*100) : null), backgroundColor: ATH_COLOR[k]}; })},
    options:{plugins:{legend:{display:true, labels:{boxWidth:10}}, tooltip:{callbacks:{label: c => `${c.dataset.label}: ${c.raw}%`}}}, scales:{y:{beginAtZero:true, suggestedMax:120, title:{display:true,text:'% do alvo'}}, x:{grid:{display:false}}}}});
}

initNav();
render();
</script>
</body>
