4 ou fita na pele: anotar e coletar de novo.\n\nANOTAR por degrau (áudio): mmol + RPE (1–10) + erros/falhas de coleta. Mande para o Bruno/Claude.","done":true,"plan":{"h":1.4,"tss":75.0,"km":null,"if":null},"act":{"h":1.155,"tss":87.3,"km":13.82,"if":0.82,"np":null,"pw":384,"hr":145,"hrmax":179,"cad":151,"pace":301,"elev":84,"rpe":8,"feel":9},"comments":[]},{"id":4020821357,"date":"2026-10-31","sport":"bike","title":"Bike longo Z1 — 2h30 grupo (Sem. 1 · sáb)","desc":"Bike longo Z1 · 2h30 · Grupo NPC.\n\nFTP 304W · seu teto 225W (74% FTP) · FC abaixo de 144bpm (estimado).\nO teto do GRUPO é o do Bruno (~208W): para você, isso é Z1 confortável — não puxe acima disso.\n\n→ Ao bater 2h30, volta — 2h30 é teto, não mínimo.\n→ Hidratação 500–750ml/h; 40–60g de carboidrato/h.\nRegistre o local no comentário.","done":true,"plan":{"h":2.5,"tss":130.0,"km":null,"if":null},"act":{"h":2.713,"tss":136.7,"km":75.08,"if":0.71,"np":216,"pw":189,"hr":117,"hrmax":162,"cad":67,"pace":null,"elev":901,"rpe":null,"feel":null},"comments":[]},{"id":4020821397,"date":"2026-11-01","sport":"dayoff","title":"Repouso — véspera do teste R1 de bike","desc":"REPOUSO (longão de 70 min cancelado para o teste de bike de segunda).\n\nPor quê: VFC ~7% abaixo da média nos últimos dias (R1 de corrida + longo de sábado) e glicogênio cheio deixa o teste de lactato confiável — glicogênio baixo derruba o lactato e superestima os limiares.\n\n• No máximo 20–30 min de rolo/caminhada BEM leve, se quiser soltar as pernas.\n• Alimentação normal, SEM cortar carboidrato. Boa hidratação.\n• Dormir bem.\n• ANOTE no comentário o que comeu no jantar e no café de segunda — o próximo teste tem de repetir as mesmas condições.","done":false,"plan":{"h":0.0,"tss":0.0,"km":null,"if":0.6},"act":null,"comments":[]},{"id":4034602490,"date":"2026-11-02","sport":"bike","title":"R1 Lactato — Bike teste incremental 5 min/+25 W","desc":"TESTE DE LACTATO INCREMENTAL — BIKE (R1, refazendo o de 27/10 invalidado por suor)\n\nANTES\n• Domingo de repouso, alimentação normal com carboidrato. Café da manhã ≥ 1h30 antes, nada sólido depois; durante o teste, só água.\n• Mesma bike e mesmo medidor de potência dos treinos. Fazer o ZERO OFFSET do medidor antes de começar.\n• CINTA CARDÍACA obrigatória (sem ela a FC fica fora do teste).\n• Material: Lactate Plus, fitas, lancetas, borrifador com água, DUAS toalhas (uma só para a mão, outra para o suor), caneta e a ficha.\n\nPROTOCOLO (o Garmin guia os degraus)\n1. Repouso sentado 5 min → COLETA (basal).\n2. Aquecimento 10 min bem leve (120–140 W) → COLETA.\n3. Degraus de 5 min: 150 → 175 → 200 → 225 → 250 → 275 → 300 → 325 W.\nPotência ESTÁVEL no alvo (±5 W), cadência livre mas constante (85–95 rpm).\n4. Após cada degrau: pausa de 2 min parado, COLETA no 1º minuto.\n5. PARAR: no degrau seguinte ao primeiro valor acima de 4 mmol, ou na exaustão. Não precisa ir até o fim da lista.\n6. Desaquecimento 10 min leve.\n\nCOLETA (o que invalidou o último teste — atenção total)\n• Dedo médio. Mão e antebraço SECOS com a toalha da mão (nunca a do suor).\n• Borrifar água no dedo, secar, furar, DESCARTAR A 1ª GOTA, encostar a fita SÓ na 2ª gota — fita nunca toca a pele.\n• Valor estranho (fora da sequência) → 2ª coleta na hora, mesmo minuto.\n\nANOTAR EM CADA DEGRAU: lactato, PSE (1–10 do TP), horário. FC, potência e cadência saem do arquivo.\nNo fim: comentário no TP com o que comeu (jantar + café), sono e qualquer erro de fita.\n\nOrdem sugerida com o Bruno: o teste do Jean primeiro (Bruno coleta), depois a validação do Bruno (Jean coleta).","done":true,"plan":{"h":1.35,"tss":68.0,"km":null,"if":null},"act":{"h":0.848,"tss":43.6,"km":28.79,"if":0.72,"np":219,"pw":202,"hr":123,"hrmax":158,"cad":73,"pace":null,"elev":15,"rpe":null,"feel":null},"comments":[]},{"id":4038165904,"date":"2026-11-02","sport":"swim","title":"Lap Swimming","desc":"","done":true,"plan":{"h":null,"tss":null,"km":null,"if":null},"act":{"h":0.542,"tss":54.4,"km":2.1,"if":1.0,"np":null,"pw":null,"hr": 8322251,"date":"2026-11-04","sport":"swim","title":"Natação aula — 50min técnico (Sem. 2 · qua)","desc":"Aula com professor.\n\nCONTEXTO DO DIA:\n→ Corrida leve (Z1) feita de manhã.\n\nRECOMENDAÇÃO DE INTENSIDADE:\n→ Volume e técnica. Evitar séries em CSS ou mais rápidas.\n\nMOTIVO:\n→ Amanhã cedo o Jean faz um teste de lactato na bike (30 min perto do limiar) e precisa chegar descansado.\n\nReferência: CSS 1:33/100m · teto 50 min.","done":true,"plan":{"h":0.833,"tss":55.0,"km":null,"if":null},"act":{"h":0.762,"tss":65.2,"km":2.8,"if":0.95,"np":null,"pw":null,"hr":138,"hrmax":175,"cad":25,"pace":98,"elev":null,"rpe":null,"feel":null},"comments":[]},{"id":4038978193,"date":"2026-11-04","sport":"run","title":"Corrida Z1 — 60min pace 4:40–5:00 + alarme FC 144 (Sem. 2 · qua)","desc":"Corrida Z1 contínua · 60 min · NOVO: controle por PACE, com teto de FC por alarme (o Garmin guia pelo pace).\n\nANTES DE SAIR (uma vez só, fica salvo): no relógio, no perfil de Corrida, em Alertas, crie um alerta de FREQUÊNCIA CARDÍACA ALTA em 144 bpm.\n\nALVOS (zona Z1 oficial, a mesma do dashboard e do TP)\n• Pace: 4:40–5:00/km. Hoje, véspera do teste de MLSS, prefira o lado lento (4:50–5:00).\n• Nunca mais rápido que 4:40/km.\n• FC: teto 144 (FC do LT1). O alarme tocou → reduza até ele parar, mesmo que o pace saia da faixa.\n• Subida: quem manda é a FC. Deixe o pace cair à vontade.\nFonte: teste de lactato de corrida R1 (30/10): LT1 4:22/km · LT2 3:53/km. A 4:39/km o seu lactato no teste ficou no basal (1,9) com FC ~139–141.\n\n→ Conversa possível o tempo todo.\n→ Sem acelerações: amanhã cedo é o teste de MLSS na bike.\n→ 60 min é TETO do cronômetro.\n\nTESTE DESTA SEMANA (anote no comentário):\n• Quantas vezes o alarme de FC tocou e em que trecho (subida, final...).\n• Se o alarme de FC tocou junto com os avisos de pace do treino (confirmar que os dois funcionam ao mesmo tempo).\n• Como foi correr por pace em vez de FC.","done":true,"plan":{"h":1.0,"tss":60.0,"km":null,"if":null},"act":{"h":0.924,"tss":63.2,"km":11.16,"if":0.79,"np":null,"pw":394,"hr":142,"hrmax":167,"cad":164,"pace":298,"elev":47,"rpe":null,"feel":null},"comments":[]},{"id":4038132878,"date":"2026-11-05","sport":"bike","title":"MLSS bike #1 — 30 min a 265 W + coletas (Sem. 2 · qui)","desc":"MLSS #1 — CONFIRMAR O LT2 DA BIKE POR CARGA CONSTANTE (método de Beneke)\n\nPOR QUE: o teste em degraus de 02/11 deu valores incompatíveis com o seu desempenho de campo (70.3 com NP 253 W por 2h13). Este teste não depende do valor absoluto do lactato, só da VARIAÇÃO entre os 10 e os 30 min — por isso funciona mesmo que as suas leituras saiam mais altas que as do Bruno.\n\nDIAGNÓSTICO DO BASAL (3 fitas, além das 2 do teste)\n1. Em casa, EM JEJUM, ao acordar (antes de café, comida ou cafeína): lavar a mão com sabão, secar bem, coletar no dedo. Anotar horário.\n2. No velódromo, antes do aquecimento: coleta no DEDO com o protocolo completo.\n3. Na mesma hora: coleta no LÓBULO DA ORELHA (limpar com água, secar, furar a lateral do lóbulo, descartar a 1ª gota).\nAnotar também o que comeu e bebeu no café (principalmente fruta, tâmara, mel, suco e cafeína).\n\nANTES\n• Mesmo café da manhã do teste de 02/11, terminado ≥1h30 antes; depois, só água.\n• Velódromo (blocos planos). ZERO OFFSET do medidor. CINTA CARDÍACA obrigatória.\n• Material: Lactate Plus, fitas, lancetas, borrifador, DUAS toalhas (uma só para a mão), caneta.\n\nPROTOCOLO (o Garmin avança SOZINHO por tempo — NÃO apertar o botão de lap em nenhum momento)\n1. Aquecimento 15 min progressivo: 167 → 225 W.\n2. 265 W por 10 min — potência LISA (±5 W), cadência constante 85–95 rpm.\n3. COLETA aos 10 min: parada de até 45 s (o passo do Garmin já tem 45 s) e volta direto para 265 W.\n4. Mais 20 min a 265 W (total 30).\n5. COLETA aos 30 min, logo ao parar. Depois 10 min de desaquecimento leve.\n\nCOLETA (o mais importante): mão e antebraço SECOS com a toalha própria, borrifar e secar o dedo, DESCARTAR a 1ª gota, fita só na 2ª gota, fita nunca toca a pele. Se a diferença entre as duas coletas der entre 0,7 e 1,2 mmol, fazer uma 2ª coleta na hora (o resultado fica na zona de decisão).\n\nANOTAR: os lactatos com horário, PSE (1–10) aos 10 e aos 30 min, e qualquer erro de fita.\n\nCRITÉRIO (eu avalio)\n• Subida ≤ 1,0 mmol entre os 10 e os 30 min → 265 W está abaixo ou no MLSS → próximo teste a 275 W.\n• Subida > 1,0 mmol, ou não conseguir manter os 30 min → 265 W está acima do MLSS → próximo teste a 255 W.\n• A FC média dos min 15–30 entra como referência de FC da bike.","done":true,"plan":{"h":0.929,"tss":57.0,"km":null,"if":null},"act":{"h":1.001,"tss":66.6,"km":40.29,"if":0.82,"np":249,"pw":235,"hr":138,"hrmax":162,"cad":79,"pace":null,"elev":43,"rpe":null,"feel":null},"comments":[]},{"id":4038322395,"date":"2026-11-05","sport":"strength","title":"Força — base / adaptação (Sem. 2 · qui)","desc":"Força — fase Base (adaptação anatômica). À tarde, depois do teste da manhã. Teto: 35 min.\n\nO conteúdo segue o planejamento do personal: membros inferiores e core liberados, com carga normal.\n\nEVITAR: pliometria máxima. Amanhã cedo tem corrida com blocos de limiar controlado.","done":true,"plan":{"h":0.583,"tss":15.0,"km":null,"if":null},"act":{"h":0.998,"tss":33.5,"km":null,"if":0.55,"np":null,"pw":null,"hr":88,"hrmax":129,"cad":null,"pace":null,"elev":null,"rpe":null,"feel":null},"comments":[]},{"id":4038322650,"date":"2026-11-06","sport":"run","title":"Corrida limiar controlado — 2×10min Z2b (Sem. 2 · sex)","desc":"Corrida com limiar controlado (Z2b) · 61 min · controle primário por PACE (o Garmin guia pelo pace).\n\nFonte: teste de lactato de corrida R1 (30/10): LT1 4:22/km · LT2 3:53/km (FC 170).\nLimiar controlado (Z2b) = 4:16–4:06/km. Como é a 1ª sessão com as zonas novas, hoje vai na METADE LENTA: 4:16–4:11/km.\n\nEstrutura:\n→ Aquecimento 20 min Z1 (mais lento que 4:22/km)\n→ 2 × 10 min a 4:16–4:11/km, com 3 min de trote Z1 entre eles\n→ 15 min Z1 + desaquecimento\n\nREGRAS:\n→ Nunca mais rápido que 4:06/km SCARTADO: artefato de esteira (VO2 medido ~12 ml/kg/min abaixo do previsto pela ACSM para a velocidade). max_hr 185 -> 176 (ergo 06/04: 2o limiar/VO2max FC=176). LT1 pace (4:19) segue cru da ergo, NAO validado em campo.\n\n== PADRAO DE CANAL DE CONTROLE — CORRIDA (confirmado pelo treinador 11/08/2026, PERMANENTE) ==\nZ1 / Z2 base / LT1 (incl. tempos de LT1) -> controle por FC (percentOfThresholdHr); pace = validador.\nZ3 / LT2+ (e Z2 forte de duplo-limiar genuino) -> controle por PACE (percentOfThresholdPace); FC = validador.\nSubida (qualquer zona) -> FC. Espelha a regra de analise (Z3+ pace primario; Z1/Z2 FC primario) — as duas DEVEM concordar.\n\n== FC DE CINTA — VALIDA (confirmado 11/08/2026) ==\nJean usa cinta cardiaca por padrao; quando esquece, sinaliza no comentario do treino. FC VALIDA para EF/decoupling e como validador. NAO tratar como optica/invalida por padrao — descartar so quando um comentario do proprio atleta indicar treino sem cinta."},{"v":2,"from":"2026-10-30","ftp":null,"lt1_w":null,"lt2_w":null,"lt1_hr":144,"lt2_hr":170,"max_hr":179,"lt1_pace":262,"lt2_pace":233,"css":null,"vo2max":null,"source":"pace=measured_lactate_R1_2026-10-30 | hr=ergo_2026-04-06_confirmed_R1","protocol":"R1 LACTATO corrida 30/10/2026 — pista, incremental 6min/degrau, +1 km/h, pausa 2min, coleta no 1º min, dedo médio (Lactate Plus). Degraus 11.9→17.9 km/h; lactato 1.9/1.9/2.9/3.5/5.0/7.9/10.6 (D7 incompleto 5min). Basal repouso 2.1 (basal habitual ~2.0, igual à validação de 24/10).","notes":"REGRA NPC DE LT1 (30/10/2026, bike e corrida): basal + 0,5 mmol na CURVA AJUSTADA; basal = MÉDIA DO PATAMAR (repouso pré-teste + degraus iniciais enquanto ≤ média acumulada + 0,3 mmol). || LT1 PACE: 4:22/km (13,73 km/h) — patamar 2,1 (repouso) · 1,9 · 1,9 → basal 1,97 → alvo 2,47 na curva. Outros: basal+1,0 4:10, log-log 4:36. Histórico de hoje: 4:27 (interp. linear) → 4:24 (basal = mínimo) → 4:22 (regra final). Era 4:19 cru da ergo. || LT2 PACE 3:53/km (15,4 km/h): Dmax Modificado 3 ações percentuais do FTP (228 = 75% de 304; 280 = 92% de 304). A nota anterior afirmava \"LT1/LT2 em watts são válidos — vieram de teste de bike\"; isso estava INCORRETO e foi removido. Apenas o FTP (304W) é medido. || FC também não validada para bike: lt1_hr (144) e lt2_hr (170) são idênticos aos de Corrida/Natação da mesma bateria (06/04), refletindo padrão de corrida. Hipótese de conversa anterior (02-06/07): LT1 de bike real ~135bpm — não testado. || CONSEQUÊNCIA: nesta linha, o ÚNICO valor medido é o FTP. Tratar lt1_watts, lt2_watts, lt1_hr e lt2_hr como ESTIMATIVAS. Potência (via FTP) segue como critério primário; zonas de bike caem no fallback %FTP até reteste. Medidor de lactato pendente.\n\n== FC DE CINTA — VALIDA para EF (confirmado 11/08/2026) ==\nBike controlada por POTENCIA (primario). FC por cinta e VALIDA -> computar EF/decoupling normalmente e usar como validador. NAO tratar como optica/invalida por padrao — descartar so se o atleta sinalizar treino sem cinta no comentario."},{"v":2,"from":"2026-11-02","ftp":304,"lt1_w":228,"lt2_w":270,"lt1_hr":144,"lt2_hr":170,"max_hr":185,"lt1_pace":null,"lt2_pace":null,"css":null,"vo2max":null,"source":"watts=provisional_field_triangulation_2026-11-02 | hr=estimated_v1","protocol":"PROVISÓRIO até confirmação por MLSS (carga constante 30min, coletas min 10 e 30, critério Beneke Δ≤1,0 mmol). Sessão 1 agendada 05/11 @265W; depois 275W (se estável) ou 255W (se não).","notes":"v2 (02/11/2026). LT2 270W = triangulação de campo: (a) 0,93 × melhor 20min 293W (mesma razão LT2/20min do Bruno: 250/268) = 272; (b) 70.3 de 04/10 com NP 253W por 2h13 ⇒ LT2 ≈ 270–280 há 1 mês; (c) 0,89 × FTP 304 (mesma razão LT2/FTP do Bruno 250/281) = 271; −~2% de destreino (4 sem só Z1). LT1 228W = 0,844 × 270 (razão LT1/LT2 do Bruno 211/250), coincide com o v1. Faixas pela mesma dose relativa do Bruno: Z2b 86–92% LT2, Z2c alvo 92–95%. || TESTE R1 LACTATO 02/11 DESCARTADO PARA ZONAS: degrau de 175W perdido (pneu furou após 150W, ~7,5min parado oints":[],"detail":null}]},"2026-09-26":{"d":"2026-09-26","at":"26/09 19:01","short":"Bike leve extra (43min, fora do plano) + a corrida de sábado — mas a corrida \"Z1 + strides\" saiu a 3:50/km, ritmo de limiar, longe de Z1. Curta (16min), mas de novo o fácil virou forte. Segue fresco (TSB +13,7).","tech":"Dois treinos. Uma bike \"Road Cycling\" de 43min (TSS 42) que NÃO estava prescrita - extra leve, FC 137 (Z1 óptico), sem custo relevante. E a corrida de sábado: prescrita \"Z1 20min + strides\", saiu a pace médio 3:50/km - isso é faixa de LT2/limiar (LT2 pace dele 3:40), não Z1. Ou seja, mais uma vez o treino fácil virou forte. É curto (16min), então o custo é baixo e ele está fresco (TSB +13,7 - o taper finalmente pegou), mas é o padrão de intensidade a vigiar na semana de prova: o \"fácil\" TEM que ser fácil pra não serrar o frescor recém-conquistado. Recuperação: HRV 52 (~88%), RHR 47, sono 7,2h, BB 44. Dia somou ~69 TSS.","sum":null,"hrv":"warn","flag":"proceed","items":[{"sport":"bike","title":null,"summary":"Bike 'Road Cycling' 43min extra (fora do plano), FC 137 (Z1), leve.","status":"ok","flags":["nao estava prescrita - extra leve"],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null},{"sport":"run","title":null,"summary":"'Z1 20min + strides' saiu a 3:50/km = limiar, nao Z1. Curta (16min) mas o facil virou forte de novo.","status":"deviation","flags":["pace 3:50/km (limiar) num treino que era Z1","padrao de intensidade - facil precisa ser facil na semana de prova"],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-28":{"d":"2026-09-28","at":"29/09 07:44","short":"Natação de segunda (rotina), 54min/TSS 76 — grande como sempre, mas fácil (FC 127). A boa notícia é a recuperação entrando na semana de prova: HRV 63 (melhor em semanas), BB 54, TSB +7,7. Chegou fresco.","tech":"Natação de segunda (dia de nado de // Linhas verticais (hoje, provas) e faixas — plugin próprio, sem dependências
const markers = {
  id: 'markers',
  afterDatasetsDraw(chart, _args, opts) {
    const {ctx, chartArea:{top, bottom, left, right}, scales:{x}} = chart;
    // eixo de categorias: converte o rótulo em índice SEM deixar o Chart.js criar rótulos novos
    const px = v => { if (x.type === 'category') { const i = chart.data.labels.indexOf(v); return i < 0 ? null : x.getPixelForValue(i); } return x.getPixelForValue(v); };
    ctx.save();
    for (const b of (opts.bands || [])) {
      const x0 = px(b.from), x1 = px(b.to); if (x0 == null || x1 == null) continue;
      ctx.fillStyle = b.color; ctx.fillRect(Math.max(left, Math.min(x0,x1)), top, Math.abs(x1-x0), bottom-top);
    }
    for (const l of (opts.lines || [])) {
      const p = px(l.x);
      if (p == null || isNaN(p) || p < left - 1 || p > right + 1) continue;
      ctx.strokeStyle = l.color; ctx.lineWidth = l.width || 1; ctx.setLineDash(l.dash || [4,4]);
      ctx.beginPath(); ctx.moveTo(p, top); ctx.lineTo(p, bottom); ctx.stroke(); ctx.setLineDash([]);
      if (l.label) { ctx.fillStyle = l.color; ctx.font = '600 10px system-ui'; const rt = p > right - 90; ctx.textAlign = rt ? 'right' : 'left'; ctx.fillText(l.label, p + (rt ? -4 : 4), top + 10 + (l.row||0)*12); }
    }
    ctx.restore();
  }
};
Chart.register(markers);

function parseNote(t){
  t = (t || '').trim(); const vol = [];
  const m = t.match(/^\[([^\]]*)\]\s*/);
  if (m) { t = t.slice(m[0].length); m[1].split('·').forEach(x => { const mm = x.trim().match(/^(\S+)\s+([\d.,]+)h$/); if (mm && parseFloat(mm[2].replace(',','.')) > 0) vol.push([mm[1], parseFloat(mm[2].replace(',','.'))]); }); }
  const secs = t.split(/\s+\|\s+/).map((chunk, i) => {
    let title = i === 0 ? 'A semana' : '', body = chunk.trim();
    const hm = i > 0 && body.match(/^([A-ZÁÉÍÓÚÂÊÔÃÕÇ][^:]{0,70}?):\s+/);
    if (hm) { title = hm[1]; body = body.slice(hm[0].length); } else if (i > 0) title = 'Observação';
    const kind = /^LACTATO/i.test(title) ? 'lac' : /^NUTRI/i.test(title) ? 'nut' : '';
    const items = body.split(/(?<=[.;])\s+(?=[A-ZÁÉÍÓÚÂÊÔÃÕÇ])/).map(x => x.replace(/;$/,'').trim()).filter(Boolean);
    return {title, kind, items};
  }).filter(x => x.items.length);

}

function compliance(w){

function drawLactate(t){
  const run = t.sport === 'run';

  const an = t.analysis;
  const curve = an ? an.curve.map(([x,y]) => ({x, y})) : [];
  const bands = [];
  if (an) for (const [k, col] of [['lt1','rgba(59,130,246,.18)'],['lt2','rgba(249,115,22,.18)']]) {
    const v = an[k].map(m => m.value).filter(x => x != null); if (v.length) bands.push({from: Math.min(...v), to: Math.max(...v), color: col});
  }
  const off = t.official || {};
  const lines = [];
  if (off.lt1 != null) lines.push({x: off.lt1, color:'#3b82f6', label:`LT1 ${run ? fmtN(off.lt1,1)+' · '+fmtPace(3600/off.lt1) : off.lt1}`, dash:[]});
  if (off.lt2 != null) lines.push({x: off.lt2, color:'#f97316', label:`LT2 ${run ? fmtN(off.lt2,1)+' · '+fmtPace(3600/off.lt2) : off.lt2}`, dash:[], row:1});
  charts.lac = new Chart($('#lac-chart'), {
    type:'scatter',
    data:{datasets:[
      {label:'Curva ajustada', data: curve, showLine:true, pointRadius:0, borderColor:'#9aa0b2', borderWidth:1.5, yAxisID:'y'},
      {label:'Lactato', data: pts.map(s => ({x:s.load, y:s.mmol})), pointRadius:5, pointBackgroundColor:'#eef0f5', borderColor:'#eef0f5', yAxisID:'y'},
      {label:'FC', data: pts.filter(s=>s.hr).map(s => ({x:s.load, y:s.hr})), showLine:true, pointRadius:3, borderColor:'#f87171', pointBackgroundColor:'#f87171', borderWidth:1, borderDash:[3,3], yAxisID:'y1'},
    ]},
    options:{plugins:{markers:{bands, lines}, tooltip:{callbacks:{label: c => c.dataset.label === 'FC' ? `FC ${c.raw.y} bpm` : `${c.dataset.label}: ${fmtN(c.raw.y,1)} mmol/L a ${run ? fmtN(c.raw.x,1)+' km/h ('+fmtPace(3600/c.raw.x)+'/km)' : fmtN(c.raw.x)+' W'}`}}},
      scales:{x:{type:'linear', title:{display:true, text: run ? 'Velocidade (km/h)' : 'Potência (W)'}}, y:{beginAtZero:true, title:{display:true,text:'Lactato (mmol/L)'}}, y1:{position:'right', grid:{display:false}, title:{display:true,text:'FC (bpm)'}}}}
  });
}

const ZONE_ROLE = {
  recovery: {c:'#64748b', t:'Trote e recuperação: entre tiros, desaquecimento e dias bem leves.'},
  base: {c:'#3b82f6', t:'Base aeróbia: rodagens, longões e aquecimento. Mais de 80% do volume da semana fica aqui. Conversa fácil (PSE ≤3).'},

  threshold_controlled: {c:'#22c55e', t:'Duplo limiar, sessão longa e controlada (ex.: 5×6 min com 1 min de pausa). Esforço firme e sustentável (PSE 5–6).'},
  threshold_high: {c:'#eab308', t:'Duplo limiar, sessão curta e mais forte (ex.: 8–10×3 min). PSE 6–7. O LT2 é o teto: o alvo fica antes dele.'},
  above_lt2: {c:'#f97316', t:'Acima do LT2: o lactato acumula sem parar. Só em sessão de VO2 prevista no plano — o treino de limiar não entra aqui.'},

const ZONE_SWIM = {
  base: 'Base técnica: volume, educativos e técnica (mais de 80% do volume).',
  threshold_controlled: 'Limiar controlado: séries mais longas do duplo limiar, firmes e sustentáveis.',
  threshold_high: 'Limiar alto: séries mais curtas e fortes; o CSS é o teto.',
  above_lt2: 'Mais rápido que o CSS: só séries curtas planejadas.',
};
const OLT = {recovery:'I-1', base:'I-1/I-2', grey:'I-3 baixo', threshold_controlled:'I-3', threshold_high:'I-3', above_lt2:'I-4', vo2:'I-5'};
const fmtRange = (lo, hi, unit, open) => lo == null && hi == null ? '—' : (!lo || lo === 0) ? `< ${hi}${unit}` : (hi == null || hi >= open) ? `> ${lo}${unit}` : `${lo}–${hi}${unit}`;
function zoneFaixa(k, z, target){
  if (k === 'run' || k === 'swim') {
    const u = k === 'swim' ? '/100m' : '/km';
    const [f, sl] = target ? z.tpace : z.pace;   // f = limite rápido, sl = limite lento (s/km)
    if (f == null && sl == null) return '—';
    return `${fmtPace(sl)}–${fmtPace(f)}${u}`;
  }
  const [lo, hi] = target ? z.tw : z.w;
  if (lo == null && hi == null) return '—';
  return fmtRange(lo, hi, ' W', 1500);
}
function runOpen(z, u = '/km'){ // pace aberto: Z1 "mais lento que", Z4 "mais rápido que"
  const [f, sl] = z.pace;
  if (sl == null) return `mais lento que ${fmtPace(f)}${u}`;
  if (f == null || f <= (u === '/km' ? 150 : 60)) return `mais rápido que ${fmtPace(sl)}${u}`;
  return `${fmtPace(sl)}–${fmtPace(f)}${u}`;
}
function zonesTable(k, zs){
  const lac = zs.some(z => z.lac[0] != null || z.lac[1] != null);
  const isP = k === 'run' || k === 'swim';
  const hasT = zs.some(z => (isP ? z.tpace[0] : z.tw[0]) != null);
  const hasHr = zs.some(z => z.hr[1] != null);
  const faixa = z => isP ? runOpen(z, k === 'swim' ? '/100m' : '/km') : zoneFaixa(k, z, false);
  const alvo = z => (isP ? z.tpace[0] : z.tw[0]) != null ? zoneFaixa(k, z, true) : '';
  const hr = z => z.hr[0] == null && z.hr[1] == null ? '—' : !z.hr[0] ? `≤ ${z.hr[1]}` : `${z.hr[0]}–${z.hr[1]}`;
  const lc = z => z.lac[0] == null && z.lac[1] == null ? '—' : z.lac[0] == null ? `< ${fmtN(z.lac[1],1)}` : z.lac[1] == null ? `> ${fmtN(z.lac[0],1)}` : `${fmtN(z.lac[0],1)}–${fmtN(z.lac[1],1)}`;
  return `<div class="tbl-wrap"><table><thead><tr><th>Zona</th><th>${k === 'run' ? 'Pace' : k === 'swim' ? 'Ritmo' : 'Potência'}</th>${hasT ? '<th>Alvo do treino</th>' : ''}${hasHr ? '<th>FC (bpm)</th>' : ''}${lac ? '<th>Lactato (mmol)</th>' : ''}</tr></thead><tbody>${zs.map(z => {
    const r0 = ZONE_ROLE[z.role] || {c:'#9aa0b2', t:''}, r = {c: r0.c, t: (k === 'swim' && ZONE_SWIM[z.role]) || r0.t};
    return `<tr${z.role === 'grey' ? ' style="opacity:.7"' : ''}><td><span class="dot" style="background:${r.c}"></span> <b>${esc(z.name)}</b>${OLT[z.role] ? ` <span class="tag" title="Escala Olympiatoppen (Noruega)" style="font-size:10px;padding:1px 5px">${OLT[z.role]}</span>` : ''}</td><td>${faixa(z)}</td>${hasT ? `<td>${alvo(z) ? `<b>${alvo(z)}</b>` : '<span class="muted">—</span>'}</td>` : ''} ${hasHr ? `<td>${hr(z)}</td>` : ''}${lac ? `<td>${lc(z)}</td>` : ''}</tr>
      <tr> <td colspan="${2 + (hasHr?1:0) + (hasT?1:0) + (lac?1:0)}" class="small muted" style="padding-top:0;border-top:none;white-space:normal">${r.t}${z.notes ? ` <i>${esc(z.notes)}</i>` : ''}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function vLimiares(){

    if (k !== 'swim' && cur.lt1_hr && cur.lt2_hr) z.push(['FC', `< ${cur.lt1_hr}`, `${cur.lt1_hr}–${cur.lt2_hr}`, `> ${cur.lt2_hr}`]);
    if (k === 'run' && cur.lt1_pace && cur.lt2_pace) z.push(['Pace', `> ${fmtPace(cur.lt1_pace)}/km`, `${fmtPace(cur.lt1_pace)}–${fmtPace(cur.lt2_pace)}/km`, `< ${fmtPace(cur.lt2_pace)}/km`]);
    return `<div class="card"><h3>${SPORT_LABEL[k]||k} <span class="sub">passaporte v${cur.v}${cur.from ? ' · desde ' + ddmmyy(cur.from) : ''}</span></h3>
      <div class="limz"><div>
      <div>${srcTag(cur.source)}${cur.source ? `<div class="small muted" style="margin-top:4px">${esc(srcHuman(cur.source))}</div>` : ''}</div>
      <div class="mgrid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
        ${cur.ftp ? `<div><span>FTP</span><b>${cur.ftp} W</b></div>` : ''}

        ${cur.lt2_pace ? `<div><span>LT2 pace</span><b>${fmtPace(cur.lt2_pace)}/km</b></div>` : ''}
        ${k !== 'swim' && cur.lt1_hr ? `<div><span>FC LT1</span><b>${cur.lt1_hr} bpm</b></div>` : ''}
        ${k !== 'swim' && cur.lt2_hr ? `<div><span>FC LT2</span><b>${cur.lt2_hr} bpm</b></div>` : ''}
        ${k !== 'swim' && cur.max_hr ? `<div><span>FC máx</span><b>${cur.max_hr} bpm</b></div>` : ''}
        ${cur.css ? `<div><span>CSS</span><b>${fmtPace(cur.css)}/100m</b></div>` : ''}
        ${swimLt1 ? `<div><span>LT1 ritmo${cur.lt1_pace ? '' : ' (estimado)'}</span><b>${fmtPace(swimLt1)}/100m</b></div><div><span>LT2 ritmo ≈ CSS</span><b>${fmtPace(cur.css)}/100m</b></div>` : ''}
      </div>
      </div><div>
      ${Z[k] && Z[k].length ? `<h4 style="margin:0 0 6px">Zonas de treino <span class="sub">${({lactate:'medidas por lactato', field_test:'pelo teste de campo (CSS)', ventilatory:'pela ergoespirometria'})[Z[k][0].source] || 'estimadas'} · as mesmas do TrainingPeaks</span></h4>${zonesTable(k, Z[k])}`
        : z.length ? `<h4 style="margin:0 0 6px">Zonas de treino <span class="sub">calculadas do passaporte (estimadas)</span></h4><div class="tbl-wrap"><table><thead><tr><th></th><th>Z1 · base</th><th>Z2 · limiar</th><th>Z3 · acima do LT2</th></tr></thead><tbody>${z.map(r => `<tr><td class="muted">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>
          <div class="small muted section"><b>Z1 · base</b> — volume, técnica e educativos (mais de 80% do volume). <b>Z2 · limiar</b> — séries do duplo limiar, firmes e controladas, sem passar do CSS. <b>Z3</b> — mais rápido que o CSS, só em séries curtas planejadas.</div>` : ''}

    </div></div>`;
}

    <div class="legend">${KEYS.map(k => `<span><i class="dot" style="background:${ATH_COLOR[k]}"></i>${esc(DB.athletes[k].short)}</span>`).join('')}<span>- - - projeção pelo plano</span></div></div>
  <div class="card section"><h3>% do alvo semanal cumprido</h3><div class="chart-box md"><canvas id="comp-pct"></canvas></div></div>
  <div class="card section"><h3>Agora</h3><div class="tbl-wrap"><table><thead><tr><th>Atleta</th><th class="n">CTL</th><th class="n">ATL</th><th class="n">TSB</th><th class="n">TSS semana</th><th class="n">Alvo semana</th><th>Próxima prova A</th></tr></thead><tbody>${rows.map(r => { const ra = nextRaces(r.a).find(e => e.priority === 'A'); return `<tr><td><span class="dot" style="background:${ATH_COLOR[r.k]}"></span> ${esc(r.a.short)}</td><td class="n">${fmtN(r.l.ctl,1)}</td><td class="n">${fmtN(r.l.atl,1)}</td><td class="n">${sign(r.l.tsb)}</td><td class="n">${fmtN(r.cw.tss)}</td><td class="n">${fmtN(r.cw.target_tss)}</td><td>${ra ? `${esc(ra.name)} · ${daysBetween(TODAY, ra.date)} dias` : '—'}</td></tr>`; }).join('')}</tbody></table></div>
    <div class="note section">Compare tendências e % do plano, não valores absolutos: CTL e TSS dependem do FTP/limiar de cada um.</div></div>`;
  const endAll = KEYS.map(k => DB.athletes[k].projection || []).flat().map(p => p.d).sort().pop() || TODAY;
  const labels = []; for (let x = start; x <= endAll; x = addDays(x, 1)) labels.push(x);
  const ds = [];
  for (const k of KEYS) {
    const a = DB.athletes[k];
    const hm = Object.fromEntries(a.pmc.map(p => [p.d, p.ctl])), pm = Object.fromEntries((a.projection||[]).map(p => [p.d, p.ctl]));
    ds.push({type:'line', label: a.short, data: labels.map(x => x <= TODAY ? hm[x] ?? null : null), borderColor: ATH_COLOR[k], pointRadius:0, borderWidth:2, spanGaps:true});
    ds.push({type:'line', label: a.short + ' (projeção)', data: labels.map(x => x === TODAY ? hm[x] ?? null : x > TODAY ? pm[x] ?? null : null), borderColor: ATH_COLOR[k], borderDash:[5,4], pointRadius:0, borderWidth:1.5, spanGaps:true});
  }
  const races = KEYS.flatMap(k => DB.athletes[k].events || []).filter((e,i,arr) => e.date >= start && e.date <= endAll && arr.findIndex(x => x.date === e.date && x.name === e.name) === i);
  charts.compCtl = new Chart($('#comp-ctl'), {data:{labels, datasets:ds}, options:{interaction:{mode:'index',intersect:false}, plugins:{tooltip:{callbacks:{title: it => ddmmyy(it[0].label), label: c => c.raw==null?null:`${c.dataset.label}: ${fmtN(c.raw,1)}`}}, markers:{lines:[{x:TODAY,color:'#ff7c3a',label:'hoje'}].concat(races.map((e,i)=>({x:e.date,color:'#ff5252',label:e.name,row:i%3,dash:[]})))}},
    scales:{x:{ticks:{maxTicksLimit:10, callback(v){return ddmm(this.getLabelForValue(v));}}, grid:{display:false}}, y:{title:{display:true,text:'CTL'}}}}});
  const mons = [...new Set(KEYS.flatMap(k => DB.athletes[k].weeks.filter(w => w.target_tss && w.tss != null).map(w => w.mon)))].sort();
  charts.compPct = new Chart($('#comp-pct'), {type:'bar', data:{labels: mons.map(ddmm), datasets: KEYS.map(k => { const by = Object.fromEntries(DB.athletes[k].weeks.map(w => [w.mon, w])); return {label: DB.athletes[k].short, data: mons.map(m => by[m] && by[m].target_tss && by[m].tss != null ? Math.round(by[m].tss/by[m].target_tss*100) : null), backgroundColor: ATH_COLOR[k]}; })},
    options:{plugins:{legend:{display:true, labels:{boxWidth:10}}, tooltip:{callbacks:{label: c => `${c.dataset.label}: ${c.raw}%`}}}, scales:{y:{beginAtZero:true, suggestedMax:120, title:{display:true,text:'% do alvo'}}, x:{grid:{display:false}}}}});
}

initNav();
render();
</script>
</body>
</html>
