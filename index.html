<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPC Endurance — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#171b24;--bg3:#1e2333;--bg4:#262c3f;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
  --text:#eef0f5;--text2:#9aa0b2;--text3:#6b7185;
  --ctl:#4a9eff;--atl:#f472b6;--tsb:#f5c542;--tss:#5b6478;
  --swim:#4a9eff;--bike:#f5a623;--run:#4db87a;--strength:#9b8fff;--brick:#ff7c3a;--race:#ff5252;--other:#8b90a0;
  --ok:#3fbf6f;--warn:#e6b422;--bad:#ff8a3d;--miss:#ef4444;
  --lt1:#3b82f6;--lt2:#f97316;--accent:#ff7c3a;
  --r:12px;
}
html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
body{min-height:100vh}
a{color:#7ab8ff}
button{font:inherit;color:inherit;cursor:pointer}
.page{max-width:1320px;margin:0 auto;padding:16px 16px 48px}
/* Header */
.hdr{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px}
.logo-badge{background:var(--accent);color:#111;font-weight:800;border-radius:8px;padding:6px 9px;letter-spacing:.04em;font-size:13px}
.logo h1{font-size:17px;font-weight:700;letter-spacing:.01em}
.logo small{display:block;color:var(--text3);font-size:11px;font-weight:500}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--text2);font-weight:600;font-size:13px;min-height:36px}
.seg button.on{background:var(--bg4);color:var(--text)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:16px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--text2);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;min-height:42px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
/* Cards */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media(max-width:520px){.g3{grid-template-columns:1fr}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;min-width:0}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card h3 .sub{text-transform:none;letter-spacing:0;font-weight:500;color:var(--text3)}
.kpi .v{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi .s{font-size:12px;color:var(--text2);margin-top:4px}
.up{color:var(--ok)}.down{color:var(--bad)}
.section{margin-top:14px}
.muted{color:var(--text3)}
.small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border2);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--text2);background:none}
.chip.on{background:var(--bg4);color:var(--text);border-color:var(--text3)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--bg4);color:var(--text2)}
.tag.A{background:#7f1d1d;color:#fecaca}.tag.B{background:#78350f;color:#fde68a}.tag.C{background:#1e3a5f;color:#bfdbfe}
.chart-box{position:relative;height:300px}
.chart-box.sm{height:150px}.chart-box.md{height:230px}.chart-box.lg{height:360px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.empty{padding:28px 12px;text-align:center;color:var(--text3)}
.warnbox{background:#2a2212;border:1px solid #5c4716;color:#f3d48a;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:12px}
.note{background:var(--bg3);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text2)}
/* Tables */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);text-align:left;padding:8px 10px;background:var(--bg3);white-space:nowrap;font-weight:700}
td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.cur td{background:rgba(255,124,58,.08)}
tr.past td{color:var(--text2)}
/* Races */
.race{display:flex;gap:12px;align-items:center}
.race .days{font-size:26px;font-weight:800;min-width:64px;text-align:center;line-height:1}
.race .days small{display:block;font-size:10px;color:var(--text3);font-weight:700;letter-spacing:.06em;margin-top:2px}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-day{background:var(--bg2);border:1px solid var(--border);border-radius:10px;min-height:150px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cal-day.today{border-color:var(--accent)}
.cal-day .dh{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);font-weight:700}
.cal-day .dh b{color:var(--text)}
.wk{border:0;text-align:left;background:var(--bg3);border-radius:8px;padding:7px 8px 7px 10px;position:relative;width:100%;display:block;min-height:44px}
.wk::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--c)}
.wk .t{font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wk .m{font-size:11px;color:var(--text2);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.wk .st{position:absolute;right:7px;top:7px;width:9px;height:9px;border-radius:50%}
.st-ok{background:var(--ok)}.st-warn{background:var(--warn)}.st-bad{background:var(--bad)}.st-miss{background:var(--miss)}.st-fut{background:transparent;border:1.5px solid var(--text3)}.st-free{background:var(--text2)}
.wsum{margin-top:10px}
@media(max-width:900px){.cal{grid-template-columns:1fr}.cal-day{min-height:0}.cal-day.emptyday{display:none}}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:50;overflow-y:auto}
.modal.on{display:flex}
.modal .box{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;max-width:720px;width:100%;padding:18px}
.modal .x{float:right;border:0;background:var(--bg4);border-radius:8px;width:36px;height:36px;font-size:18px}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
@media(max-width:600px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.perc{background:var(--bg3);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin:0 0 12px}
@media(max-width:600px){.perc{grid-template-columns:1fr}}
.perc .lbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.perc .val{font-size:15px;font-weight:700;margin:2px 0 6px}.perc .val small{font-weight:500;color:var(--text2);font-size:12px}
.rpebar{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.rpebar{max-width:260px}.rpebar i{height:10px;border-radius:2px;opacity:.18}.rpebar i.on{opacity:1}
.faces{display:flex;gap:8px;font-size:22px;line-height:1;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}.faces span{opacity:.28;filter:grayscale(1)}.faces span.on{opacity:1;filter:none}
.an{border:1px solid var(--border2);border-radius:10px;padding:12px 14px;margin:0 0 12px;background:linear-gradient(180deg,rgba(74,158,255,.06),transparent)}
.an-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.an-h .lbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-right:4px}
.an-it{font-size:13px;line-height:1.5}.an-it ul,.wa ul{margin:6px 0 0;padding-left:18px;color:var(--text2);font-size:12.5px;line-height:1.5}
.an-short{font-size:13px;line-height:1.55;margin:8px 0 0;color:var(--text)}
.an details{margin-top:8px;font-size:12.5px;color:var(--text2);line-height:1.55}.an summary,.wa summary{cursor:pointer;color:#7ab8ff;font-size:12px}
.an .other{margin-top:8px;font-size:12px;color:var(--text2)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--bg4);color:var(--text2)}
.pill.g{background:#14532d;color:#bbf7d0}.pill.y{background:#78350f;color:#fde68a}.pill.r{background:#7f1d1d;color:#fecaca}.pill.b{background:#1e3a5f;color:#bfdbfe}
details.hw{border:1px solid var(--border);border-radius:10px;margin-top:8px;background:var(--bg2)}
details.hw>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap;font-size:13px}
details.hw>summary::-webkit-details-marker{display:none}
details.hw>summary .wn{font-weight:700;min-width:58px}details.hw>summary .wd{color:var(--text2);min-width:96px}
details.hw>summary .wt{font-variant-numeric:tabular-nums}details.hw>summary .car{margin-left:auto;color:var(--text3);transition:transform .15s}
details.hw[open]>summary .car{transform:rotate(180deg)}
details.hw .hb{padding:0 14px 14px}
.wa{background:var(--bg3);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.wa .k{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12px;color:var(--text2);margin:6px 0 8px}.wa .k b{color:var(--text)}
.wa p{margin:6px 0;font-size:13px;line-height:1.55}
.wa .cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}@media(max-width:700px){.wa .cols{grid-template-columns:1fr}}
.wa h5{margin:8px 0 0;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.anlink{color:#7ab8ff;white-space:nowrap}
tr.miss td{color:var(--text3)}
.perc .foot{grid-column:1/-1;font-size:11px;color:var(--text2);border-top:1px solid var(--border);padding-top:7px}
.mgrid div{background:var(--bg3);border-radius:8px;padding:8px}
.mgrid b{display:block;font-size:16px}
.mgrid span{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
pre.desc{white-space:pre-wrap;font-family:inherit;font-size:13px;color:var(--text2);background:var(--bg3);border-radius:8px;padding:10px;max-height:340px;overflow:auto}
/* Macro */
.phasebar{display:flex;width:100%;border-radius:8px;overflow:hidden;min-height:34px}
.phasebar div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0f1117;padding:4px;text-align:center;line-height:1.15;overflow:hidden}
.notes-cell{max-width:440px;color:var(--text2);font-size:12px}
tr.wkrow{cursor:pointer}tr.wkrow:hover td{background:rgba(255,255,255,.03)}tr.wkrow.cur:hover td{background:rgba(255,124,58,.12)}tr.wkrow.open td{border-bottom:0}
.wk-sum{min-width:240px;max-width:380px;font-size:12px;color:var(--text2)}
.wk-sum .head{color:var(--text);font-size:13px;margin:3px 0}
.vchips{display:flex;gap:4px;flex-wrap:wrap}
.vchip{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--bg4);color:var(--text2);white-space:nowrap}
.vchip i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:0}
.ntag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin:2px 4px 0 0;text-transform:uppercase;letter-spacing:.03em}
.ntag.lac{background:#7c2d12;color:#ffedd5}.ntag.nut{background:#14532d;color:#bbf7d0}
.wk-more{color:#7ab8ff;white-space:nowrap;margin-left:2px}.wk-more::after{content:' ▾'}tr.wkrow.open .wk-more::after{content:' ▴'}
tr.wk-detail td{background:var(--bg2);padding:14px 16px 16px;white-space:normal}
tr.wk-detail[hidden]{display:none}
.nsecs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 22px;margin-top:10px}
.nsec{border-left:3px solid var(--lt1);padding:2px 0 2px 12px}
.nsec.lac{border-color:var(--lt2)}.nsec.nut{border-color:var(--ok)}
.nsec h4{margin:0 0 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text)}
.nsec ul{margin:0;padding-left:16px;font-size:13px;line-height:1.5;color:var(--text2)}.nsec li+li{margin-top:4px}
.nsec li b{color:var(--text);font-weight:600}
/* Lactate */
.files a{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;text-decoration:none;color:var(--text);font-weight:600;font-size:13px;min-height:40px}
.files{display:flex;flex-wrap:wrap;gap:8px}
.big-lt{display:flex;gap:12px;flex-wrap:wrap}
.big-lt div{flex:1;min-width:150px;background:var(--bg3);border-radius:10px;padding:12px}
.big-lt b{font-size:28px;display:block}
.big-lt .lt1 b{color:#7cb2ff}.big-lt .lt2 b{color:#ffa45c}
footer{margin-top:28px;color:var(--text3);font-size:12px;border-top:1px solid var(--border);padding-top:12px}
.limz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:20px;align-items:start}.limz>div{min-width:0}@media(max-width:600px){.limz table th,.limz table td{white-space:normal;padding-left:5px;padding-right:5px;font-size:12px}.limz .tbl-wrap table{min-width:0;width:100%}}@media(max-width:900px){.limz{grid-template-columns:minmax(0,1fr)}}
.ztbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--border2)}.ztbar i{display:block;height:100%}

/* ── análise diária v2 ── */
.dv{display:flex;flex-direction:column;gap:14px}
.dv-hero{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:12px;border:1px solid var(--border2)}
.dv-hero.g{background:linear-gradient(90deg,rgba(63,191,111,.16),transparent 70%)}.dv-hero.y{background:linear-gradient(90deg,rgba(230,180,34,.16),transparent 70%)}.dv-hero.r{background:linear-gradient(90deg,rgba(239,68,68,.16),transparent 70%)}
.dv-badge{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800}
.dv-hero.g .dv-badge{background:rgba(63,191,111,.22);color:var(--ok)}.dv-hero.y .dv-badge{background:rgba(230,180,34,.22);color:var(--warn)}.dv-hero.r .dv-badge{background:rgba(239,68,68,.22);color:var(--miss)}
.dv-hero .v{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.dv-hero .h{font-size:16px;font-weight:700;line-height:1.35;margin-top:2px}
.dv-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.dv-tile{border:1px solid var(--border2);border-radius:10px;padding:10px 12px;background:var(--bg3,rgba(255,255,255,.02))}
.dv-tile .l{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.dv-tile .n{font-size:20px;font-weight:800;margin-top:3px}.dv-tile .n small{font-size:12px;font-weight:600;color:var(--text2)}
.dv-tile .s{font-size:12px;color:var(--text2);margin-top:2px}
.dv-bar{height:6px;border-radius:3px;background:var(--border2);margin-top:6px;overflow:hidden}.dv-bar i{display:block;height:100%;background:var(--ok)}
.dv-sess{border:1px solid var(--border2);border-radius:12px;padding:12px 14px}
.dv-sess-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.dv-sess-h b{font-size:14.5px}
.dv-kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.dv-kpi{border-radius:9px;padding:8px 10px;border-left:3px solid var(--border2);background:rgba(255,255,255,.025)}
.dv-kpi.g{border-left-color:var(--ok)}.dv-kpi.y{border-left-color:var(--warn)}.dv-kpi.r{border-left-color:var(--miss)}
.dv-kpi .l{font-size:11px;color:var(--text3)}.dv-kpi .v{font-size:16px;font-weight:800;margin-top:1px}.dv-kpi .t{font-size:11.5px;color:var(--text2)}
.dv-pts{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.dv-pts li{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.45}
.dv-pts .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.dv-pts .good .ic{background:rgba(63,191,111,.2);color:var(--ok)}.dv-pts .warn .ic{background:rgba(230,180,34,.2);color:var(--warn)}.dv-pts .bad .ic{background:rgba(239,68,68,.2);color:var(--miss)}.dv-pts .info .ic{background:rgba(74,158,255,.18);color:#7cb2ff}
.dv-pts .area{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-right:6px}
.dv-tom{border-radius:12px;padding:12px 14px;border:1px solid rgba(74,158,255,.35);background:linear-gradient(180deg,rgba(74,158,255,.10),transparent)}
.dv-tom .l{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#7cb2ff}
.dv-tom .t{font-size:16px;font-weight:800;margin:3px 0 8px}
.dv-tom .chips{display:flex;flex-wrap:wrap;gap:6px}.dv-tom .chips span{border:1px solid var(--border2);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.03)}
.dv-tom ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--text2)}
.dv-tech h6{margin:12px 0 4px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.dv-tech p{margin:0;font-size:13px;line-height:1.55;color:var(--text2)}
@media(max-width:700px){.dv-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.dv-hero .h{font-size:14.5px}}
</style>
</head>
<body>
<div class="page">
  <header class="hdr">
    <div class="logo"><span class="logo-badge">NPC</span><div><h1>NPC Endurance</h1><small>Treinos · plano · limiares — dados do TrainingPeaks e do Supabase</small></div></div>
    <div class="seg" id="ath-seg" role="group" aria-label="Atleta"></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Seções">
    <button data-tab="geral">Visão geral</button>
    <button data-tab="cal">Calendário</button>
    <button data-tab="macro">Plano macro</button>
    <button data-tab="lactato">Lactato</button>
    <button data-tab="limiares">Limiares e zonas</button>
    <button data-tab="hist">Histórico</button>
    <button data-tab="comp">Comparativo</button>
  </nav>
  <div id="warn"></div>
  <main id="view"></main>
  <footer>Gerado em 07/11/2026 16:28 (Brasília) · PMC, treinos e wellness: TrainingPeaks · plano macro, provas, passaportes e lactato: Supabase NPC · Atualização automática 2× por dia (GitHub Actions).</footer>
</div>

alidado; o R1 vai medir o LT1 de verdade.\n\n→ Conversa possível o tempo todo.\n→ NÃO acelerar no fim — os últimos 10min no mesmo ritmo dos primeiros.\n→ Ao bater 50min, acabou (sem esticar).\n\nPanturrilha: anote no comentário a dor (0–10), o LOCAL e o MOMENTO em que apareceu, se aparecer.","done":true,"plan":{"h":0.833,"tss":55.0,"km":null,"if":null},"act":{"h":0.9,"tss":57.9,"km":10.01,"if":0.76,"np":null,"pw":null,"hr":130,"hrmax":172,"cad":171,"pace":324,"elev":270,"rpe":3,"feel":5},"comments":[{"who":"Bruno Trevisan Romero","text":"Zero dor"}]},{"id":4022236952,"date":"2026-10-28","sport":"bike","title":"R1 Lactato — Bike teste incremental (Sem. 1 · qua)","desc":"R1 — TESTE INCREMENTAL DE LACTATO · BIKE (linha de base do ciclo 2027)\nLocal: VELÓDROMO (blocos 100% planos). Registre o local no comentário. O JEAN FAZ AS COLETAS.\n\nFTP 281W (medido). LT1 211W e LT2 253W são ESTIMADOS (75% e 90% do FTP) — este teste existe para medi-los.\n\nPADRONIZAÇÃO (vai se repetir igual no R2, em 27/01):\n→ Café da manhã de sempre ≥1h30 antes do 1º degrau, nada sólido depois; café na quantidade/horário de sempre. Anote tudo (horários e o que comeu).\n→ Trajeto casa → velódromo em Z1 (FC < 138) = parte do aquecimento. No R2, mesmo trajeto e mesma intensidade.\n→ Durante o teste: SÓ ÁGUA (sem gel/carboidrato).\n→ Kit num ponto fixo: aparelho, fitas, lancetas, papel toalha NOVO, borrifador com água e DUAS toalhas — uma seca e limpa só para a mão da coleta, outra para o suor.\n\nESTRUTURA:\n→ Trajeto/aquecimento ~20min Z1.\n→ PRÉ-TESTE: ao chegar, 5min parado (sentado) e coleta de lactato (1 fita). Não é um basal de repouso verdadeiro (veio pedalando), mas em Z1 o lactato fica perto do repouso. Serve também de CONTROLE DE TÉCNICA: o seu repouso validado em 24/10 foi 1,4–1,5 mmol. Se der ≥2,5, revisar a coleta e repetir ANTES de começar os degraus.\n→ Degraus de 5min, cadência ~90rpm, potência EXATA (é teste, não treino): 175 · 200 · 225 · 250 · 275 · 300 · (325)\n→ Ao fim de CADA degrau: PARAR, pausa de 2min, coleta no 1º minuto.\n→ REGRA DE PARADA: quando um degrau passar de 4,0 mmol, faça MAIS UM degrau (+25W) e encerre. Esse degrau extra é necessário para calcular o LT2 pelo método Dmax Modificado. Encerrar antes se não sustentar a potência, RPE ≥9 ou lactato >8 mmol.\n→ Desaquecimento 20min Z1 (trajeto de volta)\n\nTÉCNICA DE COLETA (o R1 do Jean em 27/10 foi invalidado por provável contaminação com suor):\n1) Enxugar mão e antebraço com a toalha SECA e limpa (nunca a do suor).\n2) Borrifar água no dedo MÉDIO e secar com papel NOVO.\n3) Fita no aparelho ANTES de furar.\n4) Furar, LIMPAR a 1ª gota com papel seco, esperar a 2ª formar sozinha — sem espremer forte.\n5) A fita toca SÓ a gota, nunca a pele; segurar ~1s depois do bipe.\nSe E3/E4 ou se a fita encostar na pele: anotar e coletar de novo (novo furo, mesmo processo).\n\nANOTAR por degrau (áudio no celular): mmol + RPE (escala 1–10) + erros E3/E4 + qualquer falha de coleta. Potência, FC e cadência saem do arquivo. Mande para o Claude junto com o horário do D1 e o que comeu/bebeu antes.","done":true,"plan":{"h":1.583,"tss":57.0,"km":null,"if":null},"act":{"h":1.239,"tss":69.3,"km":37.45,"if":0.75,"np":211,"pw":173,"hr":130,"hrmax":212,"cad":80,"pace":null,"elev":127,"rpe":4,"feel":5},"comments":[]},{"id":4020818908,"date":"2026-10-29","sport":"strength","title":"Força — 1ª sessão com personal (Sem. 1 · qui)","desc":"Força com personal · 12h–13h · 1ª sessão do acompanhamento. Resto do dia: REPOUSO (sem bike/corrida).\n\nAMANHÃ CEDO É O R1 DE LACTATO NA CORRIDA (~18h depois desta sessão). Por isso, HOJE:\n→ Ideal: avaliação/anamnese + membros superiores, core e mobilidade.\n→ SEM carga em membros inferiores, SEM excêntrico de panturrilha/quadríceps e SEM pliometria.\n\nPOR QUÊ: exercício novo (principalmente excêntrico) causa dano muscular. Meta-análise (Burt, Doma & Connor, Science & Sports 2023) mostrou que, 24–48h depois, as respostas fisiológicas na corrida acima de ~75% do VO2max ficam significativamente alteradas — exatamente os degraus que definem o LT2. Sendo a primeira sessão, não há efeito protetor de treinos anteriores. O trabalho de pernas começa na semana que vem.\n\nCombine isso com o personal antes de começar. Informe também: meniscectomia no joelho D e retorno de panturrilha crônica (protocolo do fisio).","done":true,"plan":{"h":1.0,"tss":10.0,"km":null,"if":null},"act":{"h":1.046,"tss":30.8,"km":null,"if":0.52,"np":null,"pw":null,"hr":63,"hrmax":104,"cad":null,"pace":null,"elev":null,"rpe":1,"feel":5},"comments":[]},{"id":4028251885,"date":"2026-10-30","sport":"run","title":"R1 Lactato — Corrida teste incremental 6min (Sem. 1 · sex)","desc":"R1 LACTATO · CORRIDA (linha de base 2027) · PISTA. Sem força hoje. Começar cedo (teste ~15min mais longo).\nLT1 4:58/km (cru, nunca validado) e LT2 3:57/km (FC 177 validador) — este teste mede os dois.\n\nPADRONIZAÇÃO (igual ao R2 em 30/01): véspera repouso; café da manhã de sempre ≥1h30 antes do D1, nada sólido depois; mesmo café; anote tudo. Durante o teste SÓ ÁGUA. Kit fixo fora da pista: papel toalha NOVO + DUAS toalhas (uma seca só para a mão da coleta, outra para o suor).\n\nESTRUTURA — degraus de 6min (≥6min recomendado para lactato x velocidade na corrida), controle por PACE (400m):\n→ BASAL: antes do aquecimento, 5min parado + 1 coleta\n→ Aquecimento 15min Z1\n→ D1 11km/h 5:27 (400m 2:11) · D2 12 5:00 (2:00) · D3 13 4:37 (1:51) · D4 14 4:17 (1:43) · D5 15 4:00 (1:36) · D6 16 3:45 (1:30) · D7 17 3:32 (1:25) se necessário\n→ Após CADA degrau: PARAR 2min, coleta no 1º minuto.\n→ PARADA: degrau passou de 4,0 mmol → faça MAIS UM e encerre (necessário p/ Dmax Modificado). Antes disso, encerrar se não sustentar o pace, RPE ≥9 ou lactato >8. Degraus que sobrarem: pule para o desaquecimento.\n→ Desaquecimento 10min\n\nCOLETA: 1) enxugar mão e antebraço com a toalha SECA; 2) borrifar água no dedo MÉDIO e secar com papel NOVO; 3) fita no aparelho antes; 4) furar, LIMPAR a 1ª gota, esperar a 2ª sem espremer forte; 5) fita toca SÓ a gota; segurar ~1s após o bipe. E3/E4 ou fita na pele: anotar e coletar de novo.\n\nPANTURRILHA: dor >2/10 encerra o teste na hora.\n\nJean larga 3min depois. ANOTAR por degrau (áudio): mmol + RPE (1–10) + erros/falhas de coleta. Mande para o Claude.","done":true,"plan":{"h":1.35,"tss":75.0,"km":null,"if":null},"act":{"h":1.286,"tss":106.7,"km":14.36,"if":0.86,"np":null,"pw":null,"hr":141,"hrmax":186,"cad":154,"pace":323,"elev":0,"rpe":7,"feel":3},"comments":[{"who":"Bruno Trevisan Romero","text":"Café da manhã: início às 5:35 e fim 6h10. 1 crepioca com queijo branco e 1 fatia de pão com geleia. 3 xícaras de café. 1 copo d’água."},{"who":"Bruno Trevisan Romero","text":"Dor leve no final do treino, 3/10 em ambas as panturrilhas"}]},{"id":4020819127,"date":"2026-10-31","sport":"bike","title":"Bike longo Z1 — 2h30 grupo (Sem. 1 · sáb)","desc":"Bike longo Z1 · 2h30 · Grupo NPC.\n\nFTP 281W · teto 208W (74% FTP) · FC abaixo de 138bpm (estimado).\nVocê tem o menor LT1 de potência do grupo, então o seu teto é o teto do grupo.\n\n→ Subidas: segurar o teto mesmo que o grupo abra.\n→ Ao bater 2h30, volta — sem esticar.\nRegistre o local no comentário.\n\n️ TREINO DE INTESTINO — semana 1 (60 g de carbo/h)\n→ Total: ~160 g de Z2 Powder (≈150 g de carbo) em 2h30.\n→ DILUÍDO: dividir em 3 caramanholas de 600 ml (~53 g de pó em cada ≈ 8%) — NÃO concentrar 100 g numa só (isso dá ~15%). Se só couberem 2, levar o pó da 3ª num saquinho e reabastecer.\n→ Beber em goles a cada 10–15 min, começando nos primeiros 15 min.\n→ Sódio fixo ~600 mg/h: o pó dá ~220 mg/h, então completar com ~380 mg/h em cápsulas (~950 mg no total), SEMPRE com água.\n\nREGISTRAR NO COMENTÁRIO DO TP:\n• hora em que acordou e nº de idas ao banheiro antes de sair\n• gramas de carbo/h e volume total bebido\n• qualquer desconforto intestinal (0–10) e em que momento","done":true,"plan":{"h":2.5,"tss":130.0,"km":null,"if":null},"act":{"h":3.187,"tss":164.6,"km":97.52,"if":0.72,"np":202,"pw":171,"hr":137,"hrmax":174,"cad":77,"pace":null,"elev":1155,"rpe":3,"feel":5},"comments":[{"who":"Bruno Trevisan Romero","text":"2 caramanholas com 90g de carbo e 500ml de água cada uma. 1 caramanhola só com 500ml de água. 1 gel de 30g de carbo com cafeína."},{"who":"Bruno Trevisan Romero","text":"Zero desconforto intestinal antes, durante ou depois.\nSódio total: 800mg.\nBanheiro 2x antes."}]},{"id":4020819178,"date":"2026-11-01","sport":"run","title":"Longão Z1 — 70min (Sem. 1 · dom)","desc":"Longão Z1 · 70 min · controle por FC (atualizado sáb 31/10 com o LT1 do R1).\n\nALVOS\n• FC: até 154–155 bpm (LT1 do R1 de 30/10, provisório até a validação de 25 min a 4:27)\n• Pace de referência: 4:45–5:10/km (mais lento é ok; mais rápido que 4:27 = já é zona cinzenta)\n• 70 min é TETO do cronômetro: ao bater, acabou.\n\nCOMO EXECUTAR\n→ Primeiros 10 min bem leves, deixando a FC subir devagar.\n→ Conversa possível o tempo todo. Nada de acelerar no fim — as pernas vêm de 3h11 de bike com 1.155 m.\n→ Subida: segure pela FC, deixe o pace cair.\n→ Água/gel conforme o calor.\n\nPANTURRILHA (prioridade)\n→ Dor > 2/10 em qualquer momento = encerra o treino e anota.\n→ Anote no comentário: dor (0–10), LOCAL e MOMENTO, mesmo que seja 0.\n\nDepois: registre RPE e sensação no TP.","done":true,"plan":{"h":1.167,"tss":75.0,"km":null,"if":null},"act":{"h":1.176,"tss":73.1,"km":13.16,"if":0.74,"np":null,"pw":null,"hr":137,"hrmax":156,"cad":172,"pace":322,"elev":31,"rpe":3,"feel":5},"comments":[{"who":"Bruno Trevisan Romero","text":"Dor 1/10. 1 gel 25g + 350ml água."}]},{"id":4034602566,"date":"2026-11-02","sport":"bike","title":"Validação LT1 bike — 30 min contínuos a 215 W + 2 coletas","desc":"VALIDAÇÃO DO LT1 DA BIKE — 30 min contínuos a 215 W\n\nOBJETIVO: confirmar que 215 W (início do seu limiar controlado, LT1 = 211 W) é um esforço estável. É o que decide se as zonas de bike ficam como estão.\n\nANTES\n• Mesmas condições do teste de 28/10: café da manhã ≥ 1h30 antes, nada sólido depois, só água.\n• Mesma bike e medidor; ZERO OFFSET antes. Cinta cardíaca.\n• Coletas com o mesmo cuidado do teste do Jean: mão seca com toalha própria, borrifar e secar o dedo, descartar a 1ª gota, fita só na gota.\n\nPROTOCOLO\n1. Repouso sentado 5 min → COLETA (basal).\n2. Aquecimento 15 min progressivo: 155 → 195 W.\n3. 215 W por 10 min — potência LISA (±5 W), cadência constante 85–95 rpm.\n4. COLETA aos 10 min: parada curta (até 45 s) e volta direto para 215 W.\n5. Mais 20 min a 215 W (total 30).\n6. COLETA aos 30 min, logo ao parar.\n7. Desaquecimento 10 min leve.\n\nCRITÉRIO (eu avalio depois)\n• Lactato perto de 2,2–2,5 mmol E subida de no máximo 0,5 entre os 10 e os 30 min → LT1 de bike confirmado.\n• Subida maior que 0,5 ou valor acima de ~3,0 → o LT1 está alto e eu corrijo as zonas para baixo.\n• FC média dos min 15–30 vira referência da FC de LT1 na bike.\n\nANOTAR: os 3 lactatos com horário, PSE (1–10) aos 10 e aos 30 min, e qualquer erro de fita.\n\nOrdem sugerida: primeiro o teste do Jean (você coleta), depois esta validação (Jean coleta).","done":true,"plan":{"h":1.029,"tss":47.0,"km":null,"if":null},"act":{"h":0.755,"tss":40.8,"km":28.5,"if":0.74,"np":207,"pw":205,"hr":136,"hrmax":150,"cad":85,"pace":null,"elev":18,"rpe":3,"feel":5},"comments":[]},{"id":4038330626,"date":"2026-11-03","sport":"bike","title":"Bike Z1 recuperação — 60min ≤190 W (Sem. 2 · ter)","desc":"Bike Z1 de RECUPERAÇÃO · 60 min · 06h00–07h00, força em seguida (terminar até 08h00).\n\nFTP 281 W · Z1 até 211 W. HOJE fica no LADO LEVE da Z1: 160–190 W · FC até 135 bpm.\nÉ giro de recuperação, não rodagem: o objetivo é circular sangue e chegar inteiro a sexta (validação do LT1 de corrida) e a sábado (3h15).\n\n→ TETO DURO: 190 W e FC 135. Nada de subida forte nem de \"encaixar um ritmo\".\n→ Cadência solta, 90+ rpm.\n→ 60 min é TETO: ao bater, acabou.\nRegistre o local no comentário.","done":true,"plan":{"h":1.0,"tss":35.0,"km":null,"if":null},"act":{"h":1.001,"tss":39.7,"km":30.04,"if":0.63,"np":176,"pw":162,"hr":122,"hrmax":144,"cad":81,"pace":null,"elev":117,"rpe":2,"feel":5},"comments":[]},{"id":4038330686,"date":"2026-11-03","sport":"strength","title":"Força — base / panturrilha + core (Sem. 2 · ter)","desc":"Força — fase Base (adaptação anatômica). Depois do giro de bike · teto 40 min · terminar até 08h00.\n\nConteúdo: protocolo de panturrilha do fisio, core e membros superiores. Pernas com carga leve a moderada.\nSem pliometria e sem excêntrico pesado: quinta tem personal com pernas e sexta a validação do LT1 de corrida.","done":true,"plan":{"h":0.667,"tss":18.0,"km":null,"if":null},"act":{"h":1.0,"tss":30.0,"km":null,"if":null,"np":null,"pw":null,"hr":null,"hrmax":null,"cad":null,"pace":null,"elev":null,"rpe":3,"feel":5},"comments":[{"who":"Bruno Trevisan Romero","text":"Treino com personal. Foco em core e início de pliometria"}]},{"id":4038323168,"date":"2026-11-04","sport":"run","title":"Corrida Z1 — 50min FC ≤154 (Sem. 2 · qua)","desc":"Corrida Z1 contínua · 50 min · esteira · controle por FC (o Garmin guia pela FC). Terminar até 08h30; força em seguida.\n\nFonte: teste de lactato de corrida R1 (30/10). LT1 4:27/km · FC do LT1 155 (PROVISÓRIA, será fechada na sexta) · LT2 3:57/km.\nTETO DE FC: 154 bpm. Pace de referência: mais lento que 4:27/km. Esteira a 1% de inclinação.\n\n→ Conversa possível o tempo todo.\n→ NÃO acelerar no fim: os últimos 10 min no mesmo ritmo dos primeiros.\n→ Ao bater 50 min, acabou.\n\nPANTURRILHA: anote no comentário a dor (0–10), o LOCAL e o MOMENTO, mesmo que seja 0. Dor acima de 2/10 = encerra.","done":true,"plan":{"h":0.833,"tss":50.0,"km":null,"if":null},"act":{"h":0.857,"tss":61.2,"km":10.46,"if":0.8,"np":null,"pw":null,"hr":151,"hrmax":161,"cad":172,"pace":295,"elev":20,"rpe":3,"feel":7},"comments":[{"who":"Bruno Trevisan Romero","text":"Sem dor. 1 gel 25g e 300ml água"}]},{"id":4038323236,"date":"2026-11-04","sport":"strength","title":"Mobilidade — quadril e tornozelo 20min (Sem. 2 · qua)","desc":"Mobilidade · depois da corrida · teto 20 min · terminar até 08h30.\n\nQuadril, tornozelo e coluna torácica, sem carga.\nPor quê: a força com carga desta semana fica na terça (protocolo de panturrilha) e na quinta (personal). Três dias seguidos de força nas pernas antes da validação de sexta é demais.","done":true,"plan":{"h":0.333,"tss":8.0,"km":null,"if":null},"act":{"h":0.467,"tss":13.9,"km":null,"if":0.52,"np":null,"pw":null,"hr":68,"hrmax":98,"cad":null,"pace":null,"elev":null,"rpe":1,"feel":5},"comments":[{"who":"Bruno Trevisan Romero","text":"Fisioterapia: panturrilhas e ombro"}]},{"id":4038323429,"date":"2026-11-05","sport":"bike","title":"Bike Z1 — 1h50 velódromo + coletas do Jean (Sem. 2 · qui)","desc":"Bike Z1 contínuo · 1h50 · velódromo, junto com o teste do Jean · terminar até 08h00.\n\nFTP 281 W · Z1 até 211 W · alvo 180–205 W · FC abaixo de 141 bpm (medida na validação de 02/11). Fonte: lactato R1 (28/10) + carga constante (02/11).\n\nVOCÊ FAZ AS COLETAS DO JEAN (teste de MLSS a 265 W):\n→ Uma coleta antes do aquecimento dele (dedo) e uma no lóbulo da orelha, na mesma hora.\n→ Aos 10 min do bloco dele: ele para até 45 s, você coleta.\n→ Aos 30 min, logo que ele parar.\nPare de pedalar para coletar; o tempo parado não precisa ser compensado.\nTécnica: mão dele seca com a toalha própria, borrifar e secar o dedo, descartar a 1ª gota, fita só na gota.\n\nRegistre \"velódromo\" no comentário.","done":true,"plan":{"h":1.833,"tss":80.0,"km":null,"if":null},"act":{"h":0.75,"tss":80.0,"km":null,"if":null,"np":null,"pw":null,"hr":null,"hrmax":null,"cad":null,"pace":null,"elev":null,"rpe":3,"feel":5},"comments":[{"who":"Bruno Trevisan Romero","text":"Treino executado indoor, na bike da academia."}]},{"id":4038323499,"date":"2026-11-05","sport":"strength","title":"Força com personal — 12h (Sem. 2 · qui)","desc":"Força com personal · 12h–13h · fase Base.\n\nAMANHÃ CEDO É A VALIDAÇÃO DO LT1 DE CORRIDA (25 min a 4:27/km com lactato). Por isso, HOJE:\n→ Pode trabalhar pernas com carga moderada.\n→ SEM excêntrico pesado de panturrilha e quadríceps e SEM pliometria. Dor muscular nas 24 h seguintes altera o lactato e a FC da validação.\n\nCombine isso com o personal antes de começar.","done":true,"plan":{"h":1.0,"tss":30.0,"km":null,"if":null},"act":{"h":0.564,"tss":19.3,"km":null,"if":0.56,"np":null,"pw":null,"hr":93,"hrmax":129,"cad":null,"pace":null,"elev":null,"rpe":2,"feel":5},"comments":[{"who":"Bruno Trevisan Romero","text":"Treino com personal foi terça. Hoje fiz sozinho na academia."}]},{"id":4038323723,"date":"2026-11-06","sport":"run","title":"Validação LT1 corrida — 25 min a 4:27/km + coletas (Sem. 2 · sex)","desc":"VALIDAÇÃO DO LT1 DE CORRIDA · 25 min contínuos a 4:27/km · PISTA ou rua plana (NÃO esteira: o teste foi na pista, e o pace da esteira não é comparável). Sem força hoje.\n\nOBJETIVO: confirmar que 4:27/km (LT1 do R1 de 30/10) é um esforço estável e fechar a FC do LT1 (hoje provisória em 155).\n\nANTES: café da manhã de sempre, terminado ≥1h30 antes; depois só água. Cinta cardíaca.\n\nPROTOCOLO (o Garmin avança sozinho — NÃO apertar lap):\n1. 5 min parado, sentado → COLETA (basal).\n2. Aquecimento 15 min Z1, mais lento que 4:39/km.\n3. 4:27/km por 10 min, pace LISO.\n4. COLETA aos 10 min: parada de até 45 s e volta direto para 4:27.\n5. Mais 15 min a 4:27/km (total 25).\n6. COLETA aos 25 min, logo ao parar. Depois 15 min Z1 e 5 min de desaquecimento.\n\nCOLETA (autocoleta): mão seca com a toalha própria, borrifar e secar o dedo médio, descartar a 1ª gota, fita só na gota.\n\nCRITÉRIO (eu avalio):\n• Lactato até ~1,8 mmol E subida de no máximo 0,5 entre os 10 e os 25 min → LT1 4:27 confirmado.\n• Acima de ~2,3, ou subida maior que 0,5 → o LT1 está rápido demais e eu corrijo as zonas para mais lento.\n• A FC média dos min 15–25 vira a FC do LT1 definitiva.\n\nPANTURRILHA: dor acima de 2/10 encerra na hora. Anote dor (0–10), local e momento.\nANOTAR: os 3 lactatos com horário, PSE (1–10) aos 10 e aos 25 min, erros de fita.","done":true,"plan":{"h":1.012,"tss":68.0,"km":null,"if":null},"act":{"h":0.874,"tss":66.6,"km":10.67,"if":0.83,"np":null,"pw":null,"hr":142,"hrmax":162,"cad":167,"pace":295,"elev":167,"rpe":4,"feel":5},"comments":[{"who":"Bruno Trevisan Romero","text":"Zero dor. Cafe da manhã às 7h45. Medição 1, basal em repouso, as 8:59, lactato 1.4mmol. Início dos 15min de aquecimento as 9h00. Medição 1, após 10min, lactato 1.9mmol. Medição 2 após mais 15min, lactato 1.9mmol."}]},{"id":4046070277,"date":"2026-11-07","sport":"run","title":"Longão Z1 — 80min FC ≤154 (Sem. 2 · dom)","desc":"Longão Z1 · 80 min (+10 min sobre a semana passada) · controle por FC (o Garmin guia pela FC).\n\nTETO DE FC: 154 bpm (FC do LT1 provisória 155; se a validação de sexta mudar esse valor, eu atualizo este treino).\nPace de referência: 4:45–5:10/km. Mais lento é ok; mais rápido que 4:27/km já é zona cinzenta.\n\n→ Primeiros 10 min bem leves.\n→ Conversa possível o tempo todo. Nada de acelerar no fim: as pernas vêm de 3h15 de bike.\n→ Subida: segure pela FC e deixe o pace cair.\n→ 80 min é TETO: ao bater, acabou.\n\nPANTURRILHA (prioridade): dor acima de 2/10 em qualquer momento encerra o treino. Anote dor (0–10), local e momento, mesmo que seja 0.","done":true,"plan":{"h":1.333,"tss":80.0,"km":null,"if":null},"act":{"h":1.334,"tss":87.8,"km":15.19,"if":0.77,"np":null,"pw":null,"hr":139,"hrmax":154,"cad":172,"pace":316,"elev":388,"rpe":3,"feel":5},"comments":[{"who":"Bruno Trevisan Romero","text":"Dor mínima, 1/10.\n1 gel 40g e 300ml água"}]},{"id":4038323883,"date":"2026-11-08","sport":"bike","title":"Bike longo Z1 — 3h15 grupo + treino de intestino (Sem. 2 · sáb)","desc":"Bike longo Z1 · 3h15 · Grupo NPC.\n\nFTP 281 W · Z1 até 211 W · alvo 180–205 W · FC abaixo de 141 bpm. Fonte: lactato R1 (28/10) + carga constante (02/11).\nVocê tem o menor LT1 de potência do grupo: o seu teto é o teto do grupo.\n\n→ Subidas: segure abaixo de 211 W mesmo que o grupo abra.\n→ 3h15 é TETO: ao bater, vo  de fim, e o treino inteiro no nivel errado. O cap existe justamente para proteger o tecido da panturrilha no retorno; rodar longo em tempo derruba o proposito e carrega a lesao. Dor 1/10 no inicio -> 2/10 no fim (mesma curva ascendente da sexta). FORCA manutencao: FC 79, RPE 2 - tranquila. HRV 54.2 (ok), RHR 39 (muito bom), TSB -3.0. Veredito REDUCE (corrida): proximo longo estritamente sob 130 (mesmo que vire corrida/caminhada alternada); se a dor nao estabilizar <=2/10, suspender corrida e manter so bike/natacao.","sum":null,"hrv":"ok","flag":"reduce","items":[{"sport":"run","title":null,"summary":"Corrida longa CAPADA FC<130 rodada a FC media 154 (24 acima do teto) por 60min - Z2/tempo, nao Z1; dor 1->2/10 em retorno de lesao","status":"muito_acima_do_teto","flags":["FC media 154 vs teto 130 (+24 bpm)","60min inteiros acima do teto, nao drift","Dor panturrilha ascendente - precedencia"],"tss":55,"wid":3936084455,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null},{"sport":"strength","title":null,"summary":"Forca manutencao tranquila, RPE 2","status":"ok","flags":[],"tss":33,"wid":3930498117,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-06":{"d":"2026-09-06","at":"07/09 19:21","short":"Bike longa cumprida (2h45, 163 TSS). 2o bloco de ritmo limpo e forte (275W, VI 1.00); 1o bloco picotado pelo terreno. Ritmo de prova saindo a ~95-98% do FTP = mais limiar que ritmo de 70.3. Sem corrida, panturrilha descansou.","tech":"BIKE LONGA (2h45 + 2x15min ritmo de prova, estrada): Bloco 1 NP 252, VI 1.15, decoupling 30% (picotado pelo terreno da estrada - dado de bloco contaminado). Bloco 2 NP 275, VI 1.00, decoupling 2.7% (limpo e forte). FTP 281 / LT2 253 -> blocos a 90-98% FTP. Para 70.3 o ritmo de bike fica ~0.78-0.83 IF (~220-235W); 275W = ~0.98 IF e ritmo de LIMIAR, nao de prova - se mantido na prova, compromete a corrida. EF sessao (work) 1.77 - primeiro ponto bike_other da serie recente, forte. Sem corrida hoje: panturrilha descansou (bom). HRV 51.1 (~96%, warn), TSB -12.3, dia mais pesado da semana. Veredito PROCEED: sessao-chave cumprida; recalibrar alvo de \"ritmo de prova\" para IF de 70.3 real.","sum":null,"hrv":"warn","flag":"proceed","items":[{"sport":"bike","title":null,"summary":"2h45 + 2x15min ritmo. Bloco 2 limpo (275W, VI 1.00); bloco 1 contaminado por terreno (VI 1.15, dec 30%). Ritmo de prova a ~0.90-0.98 IF = limiar, acima do IF de 70.3","status":"ok","flags":["Ritmo de prova ~95-98% FTP - acima do IF tipico de 70.3 (~0.80)","Bloco 1 contaminado por terreno (estrada)","EF work 1.77"],"tss":163,"wid":3936084868,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-07":{"d":"2026-09-07","at":"07/09 19:21","short":"Endurance de 3h em Z1 impecavel (FC 115, RPE 3) - enfim o facil feito facil. Mas HRV amanheceu baixa (41 vs base ~54) e TSB -15: fadiga acumulada do fim de semana. Manter os proximos dias controlados e vigiar HRV.","tech":"BIKE ENDURANCE (3h Z1, feriado): FC media 115 / max 155, pace 2:07/km-equiv, RPE 3, TSS 122.8 (=120 planejado). FC 115 esta bem dentro do Z1 (LT1 HR bike 138) - execucao de facil exemplar, o oposto das corridas da semana. RECUPERACAO: HRV 40.9 = ~76% da base 7d (criterio critical), MAS RHR 45 (estavel) e sono 9.35h (otimo) -> provavel dip transitorio de fadiga de bloco, nao doenca. TSB -15.2, CTL 84.7 (subindo). Veredito REDUCE preventivo: manter os proximos dias controlados; se HRV seguir <45 por mais 2 dias, aliviar. Sem corrida hoje - panturrilha ok.","sum":null,"hrv":"critical","flag":"reduce","items":[{"sport":"bike","title":null,"summary":"Endurance 3h Z1 impecavel, FC 115 (bem dentro do Z1), RPE 3 - facil feito facil","status":"ok","flags":["HRV 41 (~76% base) - dip de fadiga, RHR e sono ok","TSB -15.2"],"tss":123,"wid":3931462142,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[] ":"gate_ok_ritmo_acima","flags":["SEM DOR hoje (<1/10) - otima evolucao do retorno","FC 163 vs teto 130 - corrida condicional virou tempo","Amanha tem intervalado: 2 corridas fortes em 2 dias","RPE 5"],"tss":29,"wid":3931462848,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-09":{"d":"2026-09-09","at":"15/09 12:50","short":"Intervalado de qualidade impecável — 4×2min a ritmo de limiar (~4:00/km, ≈LT2 pace) com FC controlada (143–147) e ZERO dor na panturrilha. Natação técnica e fisio completaram o dia. Recuperação boa (FC repouso 43, sono 9,7h).","tech":"Sessão-chave: corrida intervalada 4×2min \"ritmo de prova\". Reps (laps 4/6/8/10) a ~3:58–4:04/km — exatamente no LT2 pace (3:57) — com FC média 143–147, picos 147–155, cadência 89–91. Alvo era FC 150–157: correu as reps um pouco POR BAIXO na FC, mas o pace bateu ritmo de limiar. Entregou pace de prova a FC mais baixa que o esperado = bom frescor de taper (ou zonas de FC conservadoras; reteste fica pós-prova). EF dos blocos ~1.73; série run_other curta (1 ponto anterior, contexto diferente) → sem tendência confiável, fica o registro. Comentário \"Zero dor hoje\", RPE 3 — leitura de dor ótima, mantém a trajetória de retorno. Natação Z1 técnica 1.5km RPE 5 (um pouco alto pra técnica leve) + fisio (RPE 1). Limitação de dado: API de análise do TP em 404, laps reconstruídos do .fit local — sem potência/tempo-série, decoupling por rep indisponível. Recuperação: FC repouso 43 (boa), sono 9,7h; HRV do dia não sincronizou; TSB -17,8 (resíduo do bloco de feriado, amarelo). Macro: Sem.26, fase Taper (70.3 BsAs 04/10).","sum":null,"hrv":"ok","flag":"proceed","items":[{"sport":"run","title":null,"summary":"4×2min ~4:00/km (LT2 pace), FC 143-147 (alvo 150-157) — reps um pouco por baixo na FC mas pace no limiar. Zero dor. EF ~1.73 (serie curta).","status":"ok","flags":["FC das reps abaixo do alvo (143-147 vs 150-157)","pace no LT2 (3:57-4:04/km) - bom frescor ou zonas }]},"2026-09-11":{"d":"2026-09-11","at":"15/09 12:50","short":"Corrida capada tranquila e SEM dor (segue a boa trajetória da panturrilha). A natação, porém, custou: RPE 6 e sensação \"fraca\" (2/5) num nado leve, e FC repouso ainda alta (50). Sinais de recuperação a monitorar.","tech":"Corrida Z1 25min capada, \"Zero dor\", RPE 2 — mantém a curva de dor excelente do retorno. Ponto de atenção: natação (Lap Swimming 2.1km) com RPE 6 e feeling 2/5 (\"fraco\") num nado que deveria ser leve — carga interna alta pra sessão fácil, sinal de fadiga residual ou dia ruim na água. Cruzando com FC repouso ainda elevada (50 vs base 43-45) e HRV do dia sem sincronizar, a recuperação pede monitoramento. Sono 8,8h. TSB -12,1 (amarelo, melhorando). Sem mudança de plano hoje, mas de olho: se RPE de sessões fáceis seguir alto e FC repouso não ceder, aliviar. Taper Sem.26.","sum":null,"hrv":"warn","flag":"proceed","items":[{"sport":"run","title":null,"summary":"Corrida Z1 25min capada, zero dor, RPE 2. Curva de dor segue otima.","status":"ok","flags":[],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null},{"sport":"swim","title":null,"summary":"Lap Swimming 2.1km com RPE 6 e feeling 2/5 num nado leve - carga interna alta, monitorar.","status":"attention","flags":["RPE 6 / feeling 2 em nado leve - possivel fadiga residual"],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-12":{"d":"2026-09-12","at":"15/09 12:50","short":"Bike de grupo estourou: 2h07 em vez de 75min (+70%), 65km e 683m de subida. A média ficou em Z1 (162W/FC123) mas a pedalada foi picotada (VI 1.185) e o TSS bateu 98. Pernas leves (RPE 2) — o custo foi VOLUME, não intensidade. Em taper, segurar o tempo dos rodízios.","tech":"Bike Z1 endurance prescrita em 75min executada em 2h07 (timer; 2h27 com paradas), 65km, 683m de subida. Potência média 162W e FC média 123 ficaram no Z1 (<211W / <138bpm) — no agregado, aeróbio fácil. MAS NP 192W e VI 1.185 mostram pedalada picotada (surtos do grupo + terreno), FC de pico 153. Decoupling 8.17% é de sessão única não estruturada, com 683m de subida e ~20min de paradas — não é sinal aeróbio limpo, não vale como alerta. Sem blocos → sem EF na tendência (bike_z1). O ponto real é carga: TSS 98 e +70% de duração em semana de TAPER (alvo semanal 520; executado da semana ~661, +27%). Pernas leves (RPE 2) → custo de fadiga baixo, mas o afunilamento não está afunilando. Recomendação: segurar o tempo dos rodízios até a prova. TSB -11,8 (amarelo).","sum":null,"hrv":"ok","flag":"reduce","items":[{"sport":"bike","title":null,"summary":"Z1 endurance 75min->2h07 (+70%), 65km/683m subida. Media Z1 (162W/FC123) mas VI 1.185 picotado, TSS 98. Custo = volume, nao intensidade.","status":"overshoot","flags":["duracao +70% vs prescrito em semana de taper","VI 1.185 - pedalada picotada (grupo/terreno)","TSS semanal ~661 vs alvo 520 (+27%)"],"tss":98,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-13":{"d":"2026-09-13","at":"15/09 12:50","short":"A corrida \"Z1 capada\" virou tempo de 10k: FC 147–164 o tempo todo (teto era <130), duas zonas acima, 48min no lugar de 30. A dor segurou (zero até km5, 1/10 depois), o tecido aguentou — mas em taper e voltando de panturrilha, dia fácil TEM que ser fácil. Prioridade: segurar FC<130 nos regenerativos.","tech":"Corrida prescrita \"Z1 30min CAPADA, FC<130\" executada como 10km/48min contínuos com FC 147–164 em TODOS os km — nenhum abaixo de 130. Põe a sessão inteira na faixa LT1–LT2 (tempo), pace 4:24–4:49/km (entre LT1 4:58 e LT2 3:57), com drift de FC 147→164 nos últimos 2km (deriva de 48min contínuos). Desvio DUPLO: intensidade (2 zonas acima do teto) E duração (+60%), em TAPER e RETORNO de panturrilha. Precedência do comentário: \"zero dor até km5, depois 1/10 mínima\", RPE 3 — o tecido aguentou, NÃO houve dano, leitura de dor segue ótima. Mas o padrão preocupa: \"08/09 forcei um pouquinho\" e agora 13/09 tempo de 10k num dia regenerativo. Em atleta se autotreinando, o risco é afrouxar o teto dos fáceis na reta final. Recomendação (reduce = controlar intensidade, não cortar volume): regenerativos ESTRITAMENTE em FC<130 até a prova; a qualidade já vem dos intervalados. Não é sistêmico — TSB -5,2 (verde), sono 8,0h. Semana somou ~661 TSS vs alvo 520 do taper (+27%); afunilar de verdade a partir de agora.","sum":null,"hrv":"ok","flag":"reduce","items":[{"sport":"run","title":null,"summary":"'Z1 capada 30min' virou tempo de 10k: FC 147-164 (teto <130), 2 zonas acima, 48min. Dor segurou (0->1/10). Desvio de intensidade+duracao em taper/retorno.","status":"deviation","flags":["FC 147-164 vs teto <130 - 2 zonas acima","10km/48min vs 30min prescrito","padrao de esticar os faceis (08/09 e 13/09) em retorno de lesao","dor ok (0 ate km5, 1/10) - tecido aguentou"],"tss":44,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-14":{"d":"2026-09-14","at":"19/09 11:48","short":"Só fisioterapia (RPE1) — o frio cortou a natação de seg e ter. Descanso relativo, recuperação ok (sono 8,8h, TSB +1,5). HRV um pouco baixa (44,5).","tech":"Dia leve: só fisioterapia (32min, RPE 1). O frio em Curitiba cortou as natações de segunda e terça — sem problema num taper, é volume que não faz falta. Recuperação: HRV 44,5 (~80% da base, no limite do amarelo), FC repouso 43, sono 8,8h, TSB +1,5 (já fresco). Nada a corrigir hoje.","sum":null,"hrv":"warn","flag":"proceed","items":[{"sport":"physio","title":null,"summary":"Fisioterapia 32min, RPE 1. Natacao cortada pelo frio.","status":"ok","flags":["frio cortou natacao seg/ter - ok no taper"],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-15":{"d":"2026-09-15","at":"19/09 11:48","short":"Bike ativação virou 95min (prescrito 50!) — TSS 98. Os 3×5min LT2 ok (RPE3), mas quase dobrou o tempo. Recuperação ok (HRV 54). Padrão de esticar o fácil.","tech":"A bike de ativação (3×5min LT2) prescrita em 50min foi executada em 95min, TSS 98 — quase o dobro. FC média 129 (Z1 no agregado), RPE 3. A qualidade dos blocos provavelmente ok, mas transformar uma ativação de 50min em 95min é o mesmo padrão de esticar as sessões. Recuperação: HRV 54,4 (~98%), sono 8,2h, TSB -0,3. Num taper, ativação é pra ativar, não pra somar 98 TSS.","sum":null,"hrv":"ok","flag":"proceed","items":[{"sport":"bike","title":null,"summary":"Ativacao 3x5min LT2 prescrita 50min -> 95min, TSS 98. RPE 3.","status":"overshoot","flags":["95min vs 50 prescrito - quase 2x"],"tss":98,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-16":{"d":"2026-09-16","at":"19/09 11:48","short":"Natação técnica (TSS 59, RPE4) + fisio — no plano, dia tranquilo. Recuperação ok (HRV 51, sono 9h, TSB +0,8).","tech":"Dia conforme o plano: natação técnica 2×1500m (TSS 59, RPE 4) + fisioterapia (RPE 1). Sem excessos hoje. Recuperação: HRV 51,3 (~92%), FC repouso 43, sono 9,05h, TSB +0,8. Bom dia de taper. Nadou hoje (as de seg/ter foram cortadas pelo frio).","sum":null,"hrv":"warn","flag":"proceed","items":[{"sport":"swim","title":null,"summary":"Natacao tecnica 2x1500m, TSS 59, RPE 4 - no plano.","status":"ok","flags":[],"tss":59,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null},{"sport":"physio","title":null,"summary":"Fisioterapia, RPE 1.","status":"ok","flags":[],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-17":{"d":"2026-09-17","at":"19/09 11:55","short":"Corrida em Maringá foi forçada de propósito pra testar o tênis novo — o esforço foi real (e a FC do relógio óptico, sem cinta, ainda infla um pouco). O dado a vigiar é a DOR: subiu pra 2/10 no km4. Teste pontual ok, mas de olho na panturrilha.","tech":"Corrida no parque em Maringá testando tênis novo — e, confirmado pelo Bruno, FORÇADA de propósito (não é desvio acidental de uma capada). FC média 155 / máx 175 e pace 4:26/km refletem esse esforço real; parte da FC ainda está superestimada porque ele está SEM cinta (bateria acabou) e a FC vem do relógio óptico (FR935), que lê alto — temporário, troca a cinta neste fds. O dado que NÃO depende de sensor é a dor: \"zero até o km4, depois 2/10\", o pior das últimas semanas (vinha de 0-1/10). Teste de tênis pontual é aceitável, mas forçar corrida + calçado novo num retorno de panturrilha, com a dor subindo, pede cautela. RPE 4. Sistêmico ok (HRV 55, TSB +3,8). Recomendação: próximas corridas leves de verdade e monitorar a dor; se persistir em 2/10, reduzir corrida e priorizar bike/natação.","sum":null,"hrv":"ok","flag":"reduce","items":[{"sport":"run","title":null,"summary":"Corrida Maringa forcada de proposito (teste de tenis novo). FC 155 real + inflada pelo optico (sem cinta). DOR subiu p/ 2/10 no km4.","status":"attention","flags":["forcada de proposito p/ testar tenis - nao e desvio acidental","FC do relogio optico (sem cinta) superestima - temporario","dor 2/10 (independe de sensor) - pior em semanas, no retorno de lesao","tenis novo + forcado no retorno = cautela"],"tss":58,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-18":{"d":"2026-09-18","at":"19/09 11:55","short":"Correção: a esteira de 1h foi LEVE de verdade (RPE 2). A FC alta (158/186) foi o relógio óptico lendo alto sem a cinta — não foi esforço nem deriva. Fica só a nota de 2º dia de corrida seguido + sono de 4,8h.","tech":"Reinterpretação com o contexto do Bruno: a corrida de 1h na esteira foi LEVE mesmo (pace 5:53/km, RPE 2). A FC média 158 / máx 186 NÃO foi esforço nem deriva cardíaca — foi o relógio óptico (FR935) lendo alto porque a cinta está sem bateria. O \"alarme de FC 186\" de antes se explica como artefato de dispositivo, não fisiologia; a discordância RPE 2 × FC some. O EF 1.403 registrado usa essa FC inflada, então está artificialmente BAIXO — NÃO ler como queda de forma; é ponto de baixa confiança na tendência (mesmo tratamento do Jean). O que permanece: foi o 2º dia de corrida seguido (qui + sex) num retorno de panturrilha, dor mínima (1/10 após 18min), e sono curto (4,83h, viagem). Nada grave; o empilhamento de impacto é a única ressalva. Cinta volta neste fds → FC normaliza na S28.","sum":null,"hrv":"warn","flag":"proceed","items":[{"sport":"run","title":null,"summary":"Esteira 1h LEVE de verdade (RPE 2, pace 5:53). FC 158/186 = artefato do relogio optico (sem cinta), NAO esforco/deriva.","status":"ok","flags":["FC alta = optico sem cinta, nao fisiologia (temporario)","EF 1.403 baixa confianca (FC inflada) - nao e queda de forma","2o dia de corrida seguido no retorno - unica ressalva","sono 4,83h (viagem)"],"tss":64,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-19":{"d":"2026-09-19","at":"19/09 12:00","short":"Com o sync: RPE 4, Feeling 3 — \"fortinha\" confirmado. E como a bike TEM potência (confiável, ao contrário das corridas no óptico), dá pra ver: o tirinho de 10min saiu a 274W/NP279 = ~98% do FTP (Z3), uma zona acima do Z2 prescrito, e o resto rodou firme. Mais estímulo do que um sábado de taper pede.","tech":"Atualização com RPE/Feeling e laps por POTÊNCIA (a bike do Bruno tem medidor — leitura confiável, diferente das corridas no óptico). A bike de taper (prescrita 45min Z1 + 1×10min Z2) virou 66min firmes: Lap 1 ~27min a 235W médios (Z2); o tirinho de 10min (Lap 2) a 274W médios / NP 279 = ~98% do FTP (281W) = Z3/LT2, uma zona acima do 1×10min Z2 prescrito (211–253W); e o restante a 206W (Z2). RPE 4 / Feeling 3 batem com \"fortinha\". Por potência, foi uma pedalada Z2 com um bloco Z3 — bem mais estímulo que o Z1+toque do taper. Não é prejudicial (bloco curto), mas soma ao \"+20min de compensação\" e reforça que sábado, no taper, é pra afunilar. FC 149/181 fica em 2º plano (inflada pelo óptico, sem cinta). HRV caiu pra 45,3 após a noite de 4,8h.","sum":null,"hrv":"warn","flag":"reduce","items":[{"sport":"bike","title":null,"summary":"Por POTENCIA (confiavel): Z2 firme + tirinho 10min a 274W/NP279 = Z3 (98% FTP), uma zona acima do Z2 prescrito. 66min. RPE 4/Feeling 3 (fortinha).","status":"overshoot","flags":["tirinho 10min saiu Z3 (274W) vs Z2 prescrito","ride Z2 firme + '+20min compensacao' - mais que um sabado de taper","bike tem potencia (confiavel); FC 149/181 = optico inflado, 2o plano","HRV 45,3 apos sono 4,8h"],"tss":82,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-20":{"d":"2026-09-20","at":"20/09 19:22","short":"Bom fechamento: correu 35min no ponto (não estourou!), pace tranquilo (4:59/km ≈ LT1) e a panturrilha se comportou — dor só 1/10 depois dos 25min, bem melhor que quinta. E você está fresco: TSB +11,4. HRV ainda baixa (44,3), mas o sono voltou (9,2h).","tech":"Corrida Z1 CAPADA + strides fechando a semana. Desta vez SEM estouro: 36,8min (prescrito 35), pace 4:59/km (≈ LT1 pace 4:58, ponta fácil), RPE 3. A panturrilha respondeu bem: \"dor mínima 1/10, início após 25min\" — bem melhor que quinta (2/10 desde o km4). FC média 146 fica em 2º plano: relógio óptico (sem cinta) inflando; por pace e dor, foi controlada de verdade. Carga: entrou na janela de frescor — TSB +11,4 (o taper funcionou pra você). Recuperação: HRV ainda baixa (44,3, ~80% da base), mas o sono se recuperou (9,17h após a noite de 4,8h) — provável resíduo, não alarme. Fechamento positivo: compliance boa, tecido melhorando, fresco a 2 semanas da prova.","sum":null,"hrv":"warn","flag":"proceed","items":[{"sport":"run","title":null,"summary":"Z1 capada 35min NO PONTO (sem estouro), pace 4:59 (LT1, facil), RPE 3. Dor so 1/10 apos 25min - melhor que quinta.","status":"ok","flags":["compliance boa - 1a vez sem estourar na semana","dor 1/10 tardia (apos 25min) - panturrilha respondeu bem","FC 146 = optico inflado, 2o plano; ler por pace/dor","TSB +11,4 - fresco na janela de prova"],"tss":31,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-21":{"d":"2026-09-21","at":"25/09 07:43","short":"Abertura leve: fisio + natação principal 1.8km firme (RPE 4, TSS 54). Fresco (TSB +11), HRV baixa (44,7) mas sono ótimo (8,9h) — provável ruído do óptico.","tech":"Início da S28: fisioterapia (RPE 1) + natação principal 1.8km (dia forte do seu padrão), RPE 4, TSS 54 — nadou firme, um pouco acima do previsto (32), mas coerente com dia de nado forte. Sem corrida/bike. Recuperação: TSB +11 (fresco, taper no rumo), HRV 44,7 (~81% da base) mas sono 8,9h e RHR 47 — a HRV baixa isolada, com sono bom, tende a ser ruído. Nada a corrigir.","sum":null,"hrv":"warn","flag":"proceed","items":[{"sport":"swim","title":null,"summary":"Natacao principal 1.8km, RPE 4, TSS 54 - nado forte do dia.","status":"ok","flags":["TSS 54 vs 32 previsto - nadou firme"],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null},{"sport":"physio","title":null,"summary":"Fisioterapia, RPE 1.","status":"ok","flags":[],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-22":{"d":"2026-09-22","at":"25/09 07:43","short":"Bike de qualidade no ponto: 4×4min LT2, RPE 3 controlado (56min como prescrito). HRV voltou à base (55), fresco (TSB +12). Sem nadar (terça você não nada).","tech":"Sessão-chave da semana: bike ativação 55min c/ 4×4min LT2, executada como prescrita (56min), RPE 3, feeling 3 — controlado, sem estourar. FC média 138 é do relógio óptico (sem cinta) e infla; a bike tem potência, mas o sync não trouxe NP (se quiser, puxo os laps por watts depois). Sem natação (terça você não nada). Recuperação: HRV 55,1 (de volta à base), RHR 47, sono 7,8h, TSB +12,3 - fresco e no rumo. Bom toque de qualidade mantendo o gume no taper.","sum":null,"hrv":"ok","flag":"proceed","items":[{"sport":"bike","title":null,"summary":"Bike 55min 4x4min LT2 como prescrito, RPE 3 controlado. FC 138 optica (bike tem potencia; NP nao veio no sync).","status":"ok","flags":["FC do optico infla - ler por potencia","toque de qualidade do taper no ponto"],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-23":{"d":"2026-09-23","at":"25/09 07:43","short":"Dia forte (116 TSS): natação principal 2km + a corrida de qualidade (4×3min ritmo de prova, antecipada de quinta). Destaque: ritmo de prova com ZERO dor e RPE 2 — leve e sem incômodo. Ótimo sinal a 11 dias da prova.","tech":"Dois treinos (troca confirmada: a corrida de qualidade veio da quinta pra cá). Natação principal 2km (RPE 4, TSS 64 - nado grande). E a corrida 40min c/ 4×3min ritmo de prova: pace médio 4:55/km (blocos mais rápidos, o médio inclui aquec/trote), FC média 143 (óptica, inflada), RPE 2, feeling 3, \"zero dor\". O ponto alto: rodar RITMO DE PROVA com RPE 2 e sem nenhuma dor na panturrilha = você está fresco, afiado e o tecido aguenta a intensidade. Exatamente o que se quer ver na reta final. Dia somou 116 TSS. Recuperação: HRV 56,5, RHR 47, sono 8,1h, TSB +6,3.","sum":null,"hrv":"ok","flag":"proceed","items":[{"sport":"swim","title":null,"summary":"Natacao principal 2km, RPE 4, TSS 64.","status":"ok","flags":["nado grande (TSS 64)"],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null},{"sport":"run","title":null,"summary":"Corrida 4x3min ritmo de prova (antecipada de qui): RPE 2, zero dor, pace medio 4:55. Leve e afiado.","status":"ok","flags":["ritmo de prova com RPE 2 e zero dor - otimo sinal","FC 143 optica infla"],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-24":{"d":"2026-09-24","at":"25/09 07:43","short":"Corrida soltura esticada de propósito pra 45min (compensar o TSS do nado que não teve na quinta). Leve por pace (~4:54), zero dor de novo. FC 149 é o óptico inflando. HRV deu uma caída (47,9) mas RHR ótimo (43).","tech":"Corrida soltura (troca confirmada: veio da quarta) alongada de propósito pra 45min — você mesmo aumentou pra bater o TSS do dia, já que terça/quinta não nada. Por pace (~4:54/km) é Z1/leve (perto do LT1 pace 4:58); a FC 149/máx 179 é o relógio óptico inflando, não esforço real. RPE 3, \"zero dor\" pela terceira corrida seguida - a panturrilha está sólida. TSS 39. Recuperação: HRV 47,9 (~87%, deu uma caída), mas RHR 43 (ótimo) e sono 8,9h, TSB +10,4 - segue fresco. Sem preocupação.","sum":null,"hrv":"warn","flag":"proceed","items":[{"sport":"run","title":null,"summary":"Corrida soltura 45min (esticada de proposito p/ bater TSS sem nado). Pace 4:54 (Z1/leve), zero dor. FC 149 = optico inflado.","status":"ok","flags":["esticada de proposito p/ compensar TSS do nado","FC 149 optica, nao esforco real","zero dor - 3a corrida seguida solida"],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-25":{"d":"2026-09-25","at":"25/09 13:50","short":"Fecha a semana bem: bike Z1 com os 3×2min ritmo de prova cravada em Z1 (FC 125, RPE 2) — controle exemplar. A natação principal, porém, saiu forte (RPE 5, TSS 61 em 29min), mais quente que um nado de taper pede. Segue fresco (TSB +11, HRV 54).","tech":"Dois treinos como prescrito. Bike Z1 50min c/ 3×2min ritmo de prova, executada em 42min (levemente curta), FC média 125 (Z1 puro, a mais baixa da semana), RPE 2, feeling 3 - controle de intensidade impecável, exatamente o que um toque de taper pede. Natação principal 1.5km: 29min, RPE 5, feeling 4, TSS 60,9 - nadou FORTE (TSS alto pra 29min, IF acima do limiar). Num taper, o nado de sexta ficou mais quente que o necessário; como natação tem baixo custo sistêmico e o RPE foi 5 (não máximo), não é alarme, mas de olho pra não gastar energia à toa na reta final. Dia somou ~102 TSS. Recuperação: HRV 53,8 (~98% da base), RHR 46, sono 8h, TSB +11 - segue fresco e afiado. Bom fechamento de semana.","sum":null,"hrv":"ok","flag":"proceed","items":[{"sport":"bike","title":null,"summary":"Bike Z1 c/ 3x2min ritmo de prova, 42min. FC 125 (Z1 puro), RPE 2 - controle de intensidade exemplar.","status":"ok","flags":["FC 125 = Z1 real, mais baixa da semana","levemente curta (42 vs 50min)"],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null},{"sport":"swim","title":null,"summary":"Natacao principal 1.5km, 29min, RPE 5, TSS 60,9 - nadou forte (acima do limiar).","status":"attention","flags":["TSS 61 em 29min - nado quente pra taper","natacao tem baixo custo sistemico, mas evitar gastar energia a toa"],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-26":{"d":"2026-09-26","at":"26/09 19:01","short":"Brick T2 no ponto (bike 45min → corrida 15min). Destaque grande: a corrida saiu a 4:13/km (ritmo de prova) com ZERO DOR — a panturrilha passou no teste mais difícil, correr rápido descendo da bike. Rodou firme (RPE 4 nos dois). Fresco (TSB +9). Obs: HRV 16,3 é artefato, não crash.","tech":"Brick T2 executado como prescrito: bike Z1 45min (45,4min) emendada na corrida 15min (15,4min). Dois pontos. (1) Rodou mais FIRME que Z1 - bike FC média 152, corrida FC 159, RPE 4 nos dois; a FC é óptica (sem cinta) e infla, mas mesmo assim foi mais um ensaio de prova do que um Z1 leve. Num brick isso é aceitável, é rehearsal de transição. (2) O destaque: a corrida saiu a pace 4:13/km (ritmo de prova) e ZERO DOR - correr rápido logo após descer da bike é o teste mais duro pra panturrilha, e ela passou lisa. Excelente sinal a 8 dias da prova, fecha a fase de dúvida sobre o calf. Dia somou ~72 TSS. Recuperação: TSB +9,1 (fresco), RHR 47, sono 7,6h. ALERTA DE DADO: o HRV de hoje veio 16,3 - quase certamente artefato de medição do óptico; nada corrobora um crash (RHR 47 normal, sono ok, ontem HRV 53,8). NÃO tratado como crítico; re-medir amanhã de manhã.","sum":null,"hrv":"warn","flag":"proceed","items":[{"sport":"bike","title":null,"summary":"Brick parte 1: bike 45min. Rodou firme (FC 152 optica, RPE 4) - mais ensaio de prova que Z1 leve, aceitavel num brick.","status":"ok","flags":["FC 152 optica infla; rodou mais firme que Z1","brick = rehearsal de transicao, ok"],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null},{"sport":"run","title":null,"summary":"Brick parte 2: corrida 15min a 4:13/km (ritmo de prova) com ZERO DOR off-the-bike. Passou no teste mais duro do calf.","status":"ok","flags":["zero dor correndo rapido apos a bike - teste mais dificil, passou","pace 4:13 = ritmo de prova"],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-09-28":{"d":"2026-09-28","at":"29/09 07:44","short":"Segunda de semana de prova pegou pesado: esteira 34min a ~4:00/km (LT2) — 64% do tempo em Z3 (agora dá pra ver!). Zero dor de novo, calf sólido. Mas a 6 dias da prova foi mais intensidade que a semana pede. Fresco (TSB +9,5).","tech":"Corrida na esteira, 34min, pace médio 4:00/km (= LT2 pace 3:57). A distribuição de zona (agora calculada do .fit por pace) confirma: 64% do tempo em Z3, só 24s em Z1 — foi corrida FORTE (tempo/LT2), não ativação. \"Zero dor\" mais uma vez: o calf está sólido, corre rápido sem incômodo, dúvida encerrada. RPE 4, FC 151 (óptica, inflada — leio por pace). Ponto de atenção: é SEGUNDA de semana de prova (largada domingo 04/10). Um toque curto de LT2 no início da semana até mantém o gume, mas 34min majoritariamente em Z3 é bastante — o resto da semana (ter–sáb) precisa ser leve de verdade, só ativações curtas, pra o TSB seguir subindo. Recuperação: HRV 47,6 (~85%, mas é o padrão dele), RHR 47, sono 7,8h, TSB +9,5 (fresco).","sum":null,"hrv":"warn","flag":"proceed","items":[{"sport":"run","title":null,"summary":"Esteira 34min a 4:00/km (LT2): 64% do tempo em Z3. Corrida forte, nao ativacao. Zero dor. Quente pra segunda de semana de prova.","status":"attention","flags":["64% Z3 numa segunda de semana de prova - quente","zero dor a ~4:00/km - calf solido","resto da semana tem que ser leve de verdade"],"tss":null,"wid":null,"laps":[],"zone_time":[],"metrics":{},"lactate":[],"next":null,"kpis":[],"points":[],"detail":null}]},"2026-10-31":{"d":"2026-10-31","at":"31/10 21:54","short":"Bike longo Z1 em grupo: 3h11 de pedal (prescrito 2h30, +41 min), 97,5 km, 1.155 m de subida, TSS 165. NP 203 W dentro da Z1 medida por lactato (≤211 W; alvo 180–205 W) e FC média 137 — intensidade média certa e RPE 3 coerente. Mas o pedal foi picotado (VI 1,19, picos de 773 W e FC máx 174 nas subidas) e a deriva cardíaca ficou alta (12,6%). Nutrição: ~66 g de carbo/h, na meta, em 2 caramanholas concentradas (~18%, o dobro do pedido) — e ZERO desconforto intestinal antes, durante e depois (2 idas ao banheiro antes de sair). Bom sinal de tolerância, ainda em Z1. Sódio 800 mg no total (~250 mg/h), abaixo dos ~600 mg/h pedidos. Recuperação ok (sono 8h44, FC repouso 46, sem HRV; TSB −2,5). Semana: 444 de 515 TSS. Amanhã: longão Z1 70 min — 70 min é teto, FC ≤155 (LT1 do R1, provisório até a validação de 25 min a 4:27), pace 4:45–5:10/km, sem acelerar no fim; dor de panturrilha >2/10 = encerra e anota (na sexta deu 3/10 no fim do teste).","tech":"RECUPERAÇÃO: HRV sem dado (Garmin não sincroniza HRV do Bruno). FC repouso 46 bpm (média 7d ~44, leve alta pós-R1 de corrida). Sono 8,7 h (🟢). CTL 73,7 · ATL 76,1 · TSB −2,5 (🟢); ATL/CTL 1,03 — sem estouro de rampa.\n\nSESSÃO — Bike longo Z1 2h30 grupo (outdoor, estrada; local não informado no comentário). Timer 3h11min (elapsed 3h22) vs 2h30 prescrito (+27%). 97,5 km a 30,6 km/h, 1.155 m de ascensão, 22 °C. Pot. média 171 W · NP 203 W · IF 0,72 (FTP 281) · VI 1,19 · FC média 137 / máx 174 · cadência 77 rpm · Pw:Hr 12,6% · TSS 165.\nZonas: a Z1 de bike agora é medida por lactato (npc_lactate_v1, R1 28/10): ≤211 W, alvo 180–205 W, FC <144. A prescrição ainda citava 208 W (estimado) — NP 203 fica dentro dos dois. FC média 137 também abaixo do teto. A sessão é Z1 sem blocos estruturados → sem EF/decoupling de blocos (regra work_blocks); Pw:Hr da sessão (12,6%) entra só como contexto: deriva relevante para Z1, coerente com volume extra + subidas acima do teto. \nVolume: +41 min é crédito aeróbio pela regra 1 (NP dentro da Z1, rampa ok, sem sessão-chave amanhã). Ressalvas: (a) instrução explícita \"ao bater 2h30, volta — sem esticar\" e coaching_flag volume_tendency=overshoot → reforçar o teto; (b) intensidade escondida nas subidas: VI 1,19, pico 773 W e FC máx 174 (bem acima do teto de 144) indicam que o teto não foi segurado quando o grupo abriu. Tempo em zona indisponível (sem série temporal — análise reconstruída do .fit), então não dá para quantificar quanto ficou em Z2a/Z3.\nRPE 3 · Feeling 3 (normal) — compatível com Z1, sem sinal de fadiga escondida.\nNutrição (treino de intestino sem. 1): comentário relata 2 caramanholas com 90 g de carbo em 500 ml cada + 1 de 500 ml só água + 1 gel 30 g com cafeína = ~210 g de carbo em 3h11 (~66 g/h, meta 60 g/h ✅) e ~1,5 L (~470 ml/h). Concentração das caramanholas ~18% (pedido: ~8%, 3 × 600 ml). 2º comentário (19h23): desconforto intestinal ZERO antes/durante/depois; banheiro 2x antes de sair; sódio total 800 mg (~250 mg/h, ~40% dos ~600 mg/h prescritos). Leitura: tolerância boa a 66 g/h mesmo hipertônico — mas em Z1 (IF 0,72), onde o fluxo esplâncnico é preservado; a tolerância em intensidade de prova (IF ~0,80) ainda precisa ser testada. Rotina de banheiro pré-saída funcionou (foi o problema do 70.3). Sódio: em 22 °C e Z1 o déficit é de baixo risco, mas o protocolo de prova é ~600–700 mg/h — próxima sessão deve bater a meta para ensaiar. Faltou só: local e hora de acordar. \nLesão: panturrilha crônica em retorno — sem corrida hoje; último relato (30/10, R1) dor 3/10 bilateral no fim do teste, após corridas Z1 com zero dor em 25 e 26/10.\nSEMANA: Base Aeróbia I, sem. 1 (load), TSS 444/515; com o longão (~75) fecha ~519 — na meta.\nAMANHÃ: longão Z1 70 min. Teto de FC pelas zonas medidas = 155 bpm, pace alvo 4:45–5:10/km (Z1 > 4:27). Descrição no TP já atualizada (FC até 154–155, LT1 do R1, provisório até a validação de 25 min a 4:27). 70 min é teto (overshoot). Dor >2/10 encerra; anotar nível, local e momento. Pernas vêm de 3h11 com 1.155 m — manter o lado lento do alvo.","sum":{"week":{"tss":444,"label":"Base Aeróbia I · semana 1","target":515},"points":[{"t":"good","area":"Intestino","text":"Zero desconforto intestinal com ~66 g de carbo/h, mesmo com as caramanholas a ~18%. Banheiro 2x antes de sair — a rotina funcionou."},{"t":"warn","area":"Nutrição","text":"Sódio 800 mg em 3h11 (~250 mg/h), abaixo dos ~600 mg/h pedidos. Próxima: completar com cápsulas até ~600 mg/h."},{"t":"info","area":"Concentração","text":"Tolerou bem a ~18%, mas em Z1. Manter 3 × 600 ml (~8%) como padrão até testar a concentração alta em intensidade de prova."},{"t":"info","area":"Panturrilha","text":"Sem corrida hoje. Último relato: 3/10 no fim do teste de sexta."}],"verdict":"proceed","headline":"Longo Z1 com a intensidade média certa — mas passou 41 min do teto e estourou o teto nas subidas.","recovery":{"atl":76.1,"ctl":73.7,"rhr":46,"tsb":-2.5,"note":"FC repouso levemente acima da média (44)","hrv_ms":null,"sleep_h":8.7},"tomorrow":{"rules":["Sem acelerar no fim — pernas vêm de 3h11 com 1.155 m","Dor na panturrilha > 2/10 → encerra e anota"],"title":"Longão Z1 · 70 min","targets":["Pace fé da manhã de sempre ≥1h30 antes do 1º degrau, nada sólido depois; café na quantidade/horário de sempre. Anote tudo.\n→ Durante o teste: SÓ ÁGUA (sem gel/carboidrato).\n→ Kit num ponto fixo fora da pista: aparelho, fitas, lancetas, toalha seca, borrifador com água.\n\nESTRUTURA:\n→ Aquecimento ~23min Z1 (você larga 3min depois do Bruno: com pausa de 2min, as coletas ficam sempre separadas por pelo menos 1min)\n→ Degraus de 5min, cadência ~90rpm: 200 · 225 · 250 · 275 · 300W\n→ Ao fim de CADA degrau: PARAR, pausa de 2min. COLETE LOGO NO 1º MINUTO (o lactato começa a cair depois); o 2º minuto é folga. Dedo MÉDIO: borrife água e seque bem; fita no aparelho ANTES; descarte a 1ª gota; fita toca SÓ a gota, nunca a pele; segure ~1s depois do bipe.\n→ ENCERRAR no primeiro degrau com lactato > 4,0 mmol. Se o 300W não passar de 4,0, faça mais um degrau a 325W (5min no cronômetro).\n→ Desaquecimento 20min Z1\n\nÉ TESTE, não treino: segure cada degrau exatamente na potência, sem passar.\n\nANOTAR por degrau (áudio no celular): mmol + RPE (escala 1–10, a mesma do TP) + erros E3/E4. Potência, FC e cadência saem do arquivo. Mande para o Bruno/Claude junto com o horário do D1 e o que comeu/bebeu antes.","done":true,"plan":{"h":1.25,"tss":59.0,"km":null,"if":null},"act":{"h":1.121,"tss":59.4,"km":30.32,"if":0.73,"np":222,"pw":199,"hr":121,"hrmax":161,"cad":68,"pace":null,"elev":117,"rpe":null,"feel":null},"comments":[]},{"id":4020819419,"date":"2026-10-28","sport":"run","title":"Corrida Z1 — 50min FC ≤143 (Sem. 1 · qua)","desc":"Corrida Z1 contínua · 50min · controle por FC (pace livre).\n\nTETO DE FC: 143bpm (LT1 144bpm da ergo, FC de cinta). LT1 de pace (4:19) é cru — o R1 de sexta vai medir.\n\n→ Conversa possível o tempo todo.\n→ 50min é o TETO do cronômetro, não o mínimo.\n\nSe esquecer a cinta, avise no comentário.","done":true,"plan":{"h":0.833,"tss":55.0,"km":null,"if":null},"act":{"h":0.972,"tss":51.5,"km":11.02,"if":0.69,"np":null,"pw":381,"hr":130,"hrmax":149,"cad":165,"
