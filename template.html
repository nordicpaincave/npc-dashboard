<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPC Endurance — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#171b24;--bg3:#1e2333;--bg4:#262c3f;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
  --text:#eef0f5;--text2:#9aa0b2;--text3:#6b7185;
  --ctl:#4a9eff;--atl:#f472b6;--tsb:#f5c542;--tss:#5b6478;
  --swim:#4a9eff;--bike:#f5a623;--run:#4db87a;--strength:#9b8fff;--brick:#ff7c3a;--race:#ff5252;--other:#8b90a0;
  --ok:#3fbf6f;--warn:#e6b422;--bad:#ff8a3d;--miss:#ef4444;
  --lt1:#3b82f6;--lt2:#f97316;--accent:#ff7c3a;
  --r:12px;
}
html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
body{min-height:100vh}
a{color:#7ab8ff}
button{font:inherit;color:inherit;cursor:pointer}
.page{max-width:1320px;margin:0 auto;padding:16px 16px 48px}
/* Header */
.hdr{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px}
.logo-badge{background:var(--accent);color:#111;font-weight:800;border-radius:8px;padding:6px 9px;letter-spacing:.04em;font-size:13px}
.logo h1{font-size:17px;font-weight:700;letter-spacing:.01em}
.logo small{display:block;color:var(--text3);font-size:11px;font-weight:500}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--text2);font-weight:600;font-size:13px;min-height:36px}
.seg button.on{background:var(--bg4);color:var(--text)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:16px;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--text2);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;min-height:42px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
/* Cards */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media(max-width:520px){.g3{grid-template-columns:1fr}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;min-width:0}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card h3 .sub{text-transform:none;letter-spacing:0;font-weight:500;color:var(--text3)}
.kpi .v{font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi .s{font-size:12px;color:var(--text2);margin-top:4px}
.up{color:var(--ok)}.down{color:var(--bad)}
.section{margin-top:14px}
.muted{color:var(--text3)}
.small{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border2);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--text2);background:none}
.chip.on{background:var(--bg4);color:var(--text);border-color:var(--text3)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--bg4);color:var(--text2)}
.tag.A{background:#7f1d1d;color:#fecaca}.tag.B{background:#78350f;color:#fde68a}.tag.C{background:#1e3a5f;color:#bfdbfe}
.chart-box{position:relative;height:300px}
.chart-box.sm{height:150px}.chart-box.md{height:230px}.chart-box.lg{height:360px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.empty{padding:28px 12px;text-align:center;color:var(--text3)}
.warnbox{background:#2a2212;border:1px solid #5c4716;color:#f3d48a;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:12px}
.note{background:var(--bg3);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text2)}
/* Tables */
.tbl-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);text-align:left;padding:8px 10px;background:var(--bg3);white-space:nowrap;font-weight:700}
td{padding:8px 10px;border-top:1px solid var(--border);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.cur td{background:rgba(255,124,58,.08)}
tr.past td{color:var(--text2)}
/* Races */
.race{display:flex;gap:12px;align-items:center}
.race .days{font-size:26px;font-weight:800;min-width:64px;text-align:center;line-height:1}
.race .days small{display:block;font-size:10px;color:var(--text3);font-weight:700;letter-spacing:.06em;margin-top:2px}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-day{background:var(--bg2);border:1px solid var(--border);border-radius:10px;min-height:150px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cal-day.today{border-color:var(--accent)}
.cal-day .dh{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);font-weight:700}
.cal-day .dh b{color:var(--text)}
.wk{border:0;text-align:left;background:var(--bg3);border-radius:8px;padding:7px 8px 7px 10px;position:relative;width:100%;display:block;min-height:44px}
.wk::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--c)}
.wk .t{font-size:12px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.wk .m{font-size:11px;color:var(--text2);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.wk .st{position:absolute;right:7px;top:7px;width:9px;height:9px;border-radius:50%}
.st-ok{background:var(--ok)}.st-warn{background:var(--warn)}.st-bad{background:var(--bad)}.st-miss{background:var(--miss)}.st-fut{background:transparent;border:1.5px solid var(--text3)}.st-free{background:var(--text2)}
.wsum{margin-top:10px}
@media(max-width:900px){.cal{grid-template-columns:1fr}.cal-day{min-height:0}.cal-day.emptyday{display:none}}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:50;overflow-y:auto}
.modal.on{display:flex}
.modal .box{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;max-width:720px;width:100%;padding:18px}
.modal .x{float:right;border:0;background:var(--bg4);border-radius:8px;width:36px;height:36px;font-size:18px}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
@media(max-width:600px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mgrid div{background:var(--bg3);border-radius:8px;padding:8px}
.mgrid b{display:block;font-size:16px}
.mgrid span{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
pre.desc{white-space:pre-wrap;font-family:inherit;font-size:13px;color:var(--text2);background:var(--bg3);border-radius:8px;padding:10px;max-height:340px;overflow:auto}
/* Macro */
.phasebar{display:flex;width:100%;border-radius:8px;overflow:hidden;min-height:34px}
.phasebar div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#0f1117;padding:4px;text-align:center;line-height:1.15;overflow:hidden}
.notes-cell{max-width:440px;color:var(--text2);font-size:12px}
/* Lactate */
.files a{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:8px 12px;text-decoration:none;color:var(--text);font-weight:600;font-size:13px;min-height:40px}
.files{display:flex;flex-wrap:wrap;gap:8px}
.big-lt{display:flex;gap:12px;flex-wrap:wrap}
.big-lt div{flex:1;min-width:150px;background:var(--bg3);border-radius:10px;padding:12px}
.big-lt b{font-size:28px;display:block}
.big-lt .lt1 b{color:#7cb2ff}.big-lt .lt2 b{color:#ffa45c}
footer{margin-top:28px;color:var(--text3);font-size:12px;border-top:1px solid var(--border);padding-top:12px}
</style>
</head>
<body>
<div class="page">
  <header class="hdr">
    <div class="logo"><span class="logo-badge">NPC</span><div><h1>NPC Endurance</h1><small>Treinos · plano · limiares — dados do TrainingPeaks e do Supabase</small></div></div>
    <div class="seg" id="ath-seg" role="group" aria-label="Atleta"></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Seções">
    <button data-tab="geral">Visão geral</button>
    <button data-tab="cal">Calendário</button>
    <button data-tab="macro">Plano macro</button>
    <button data-tab="lactato">Lactato</button>
    <button data-tab="limiares">Limiares e zonas</button>
    <button data-tab="comp">Comparativo</button>
  </nav>
  <div id="warn"></div>
  <main id="view"></main>
  <footer>Gerado em __GENERATED__ · PMC, treinos e wellness: TrainingPeaks · plano macro, provas, passaportes e lactato: Supabase NPC · Atualização automática a cada 2 dias (GitHub Actions).</footer>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modal-box"></div></div>

<script>
const DB = __NPC_DATA__;
const TODAY = DB.today;
const KEYS = Object.keys(DB.athletes);
const SPORT_LABEL = {swim:'Natação',bike:'Bike',run:'Corrida',strength:'Força',brick:'Brick',race:'Prova',other:'Outro',dayoff:'Folga'};
const SPORT_COLOR = {swim:'#4a9eff',bike:'#f5a623',run:'#4db87a',strength:'#9b8fff',brick:'#ff7c3a',race:'#ff5252',other:'#8b90a0',dayoff:'#555'};
const WEEK_TYPE = {load:'Carga',recovery:'Descarga',peak:'Pico',taper:'Polimento',race:'Prova',test:'Teste'};
const PHASE_COLOR = {base:'#4a9eff',build:'#3fbf6f',peak:'#f5a623',taper:'#f472b6',recovery:'#9aa0b2',transition:'#9b8fff'};
const ATH_COLOR = {bruno:'#4a9eff',jean:'#ff7c3a'};
const DOW = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const charts = {};
let state = {ath: null, tab: 'geral', calMonday: null, pmcRange: 180, lacTest: null};

// ── utils ────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN = (v, d=0) => v == null || isNaN(v) ? '—' : Number(v).toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtH = h => { if (h == null) return '—'; const m = Math.round(h*60); const hh = Math.floor(m/60), mm = m%60; return hh ? `${hh}h${String(mm).padStart(2,'0')}` : `${mm}min`; };
const fmtPace = s => s == null ? '—' : `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;
const D = s => new Date(s + 'T12:00:00');
const iso = dt => dt.toISOString().slice(0,10);
const addDays = (s, n) => { const x = D(s); x.setDate(x.getDate()+n); return iso(x); };
const mondayOf = s => { const x = D(s); const wd = (x.getDay()+6)%7; x.setDate(x.getDate()-wd); return iso(x); };
const ddmm = s => s ? `${s.slice(8,10)}/${s.slice(5,7)}` : '';
const ddmmyy = s => s ? `${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(2,4)}` : '';
const daysBetween = (a, b) => Math.round((D(b) - D(a)) / 86400000);
const sign = v => v == null ? '—' : (v > 0 ? '+' : '') + fmtN(v, 1);
function kill(id){ if (charts[id]) { charts[id].destroy(); delete charts[id]; } }
function A(){ return DB.athletes[state.ath]; }

Chart.defaults.color = '#9aa0b2';
Chart.defaults.font.family = 'system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
Chart.defaults.font.size = 11;
Chart.defaults.borderColor = 'rgba(255,255,255,.06)';
Chart.defaults.plugins.legend.display = false;
Chart.defaults.animation = false;
Chart.defaults.maintainAspectRatio = false;
Chart.defaults.responsive = true;

// Linhas verticais (hoje, provas) e faixas — plugin próprio, sem dependências
const markers = {
  id: 'markers',
  afterDatasetsDraw(chart, _args, opts) {
    const {ctx, chartArea:{top, bottom, left, right}, scales:{x}} = chart;
    // eixo de categorias: converte o rótulo em índice SEM deixar o Chart.js criar rótulos novos
    const px = v => { if (x.type === 'category') { const i = chart.data.labels.indexOf(v); return i < 0 ? null : x.getPixelForValue(i); } return x.getPixelForValue(v); };
    ctx.save();
    for (const b of (opts.bands || [])) {
      const x0 = px(b.from), x1 = px(b.to); if (x0 == null || x1 == null) continue;
      ctx.fillStyle = b.color; ctx.fillRect(Math.max(left, Math.min(x0,x1)), top, Math.abs(x1-x0), bottom-top);
    }
    for (const l of (opts.lines || [])) {
      const p = px(l.x);
      if (p == null || isNaN(p) || p < left - 1 || p > right + 1) continue;
      ctx.strokeStyle = l.color; ctx.lineWidth = l.width || 1; ctx.setLineDash(l.dash || [4,4]);
      ctx.beginPath(); ctx.moveTo(p, top); ctx.lineTo(p, bottom); ctx.stroke(); ctx.setLineDash([]);
      if (l.label) { ctx.fillStyle = l.color; ctx.font = '600 10px system-ui'; const rt = p > right - 90; ctx.textAlign = rt ? 'right' : 'left'; ctx.fillText(l.label, p + (rt ? -4 : 4), top + 10 + (l.row||0)*12); }
    }
    ctx.restore();
  }
};
Chart.register(markers);

// ── header / navegação ───────────────────────────────────────────────
function initNav(){
  $('#ath-seg').innerHTML = KEYS.map(k => `<button data-ath="${k}">${esc(DB.athletes[k].short)}</button>`).join('');
  $('#ath-seg').onclick = e => { const b = e.target.closest('button'); if (b) setAth(b.dataset.ath); };
  $('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); };
  const path = location.pathname.replace(/^\/|\/$/g,'').toLowerCase();
  const hash = location.hash.replace('#','');
  state.ath = KEYS.includes(path) ? path : KEYS[0];
  if (hash && document.querySelector(`[data-tab="${hash}"]`)) state.tab = hash;
  window.addEventListener('popstate', () => { const p = location.pathname.replace(/^\/|\/$/g,'').toLowerCase(); if (KEYS.includes(p)) { state.ath = p; render(); } });
  $('#modal').onclick = e => { if (e.target.id === 'modal' || e.target.closest('.x')) closeModal(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  if (DB.warnings && DB.warnings.length) $('#warn').innerHTML = `<div class="warnbox">${DB.warnings.map(esc).join('<br>')}</div>`;
}
function setAth(k){ state.ath = k; state.calMonday = null; state.lacTest = null; try { history.pushState({}, '', '/' + k + location.hash); } catch(e){} render(); }
function setTab(t){ state.tab = t; try { history.replaceState({}, '', location.pathname + '#' + t); } catch(e){} render(); }
function render(){
  document.querySelectorAll('#ath-seg button').forEach(b => b.classList.toggle('on', b.dataset.ath === state.ath));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  Object.keys(charts).forEach(kill);
  ({geral: vGeral, cal: vCal, macro: vMacro, lactato: vLactato, limiares: vLimiares, comp: vComp})[state.tab]();
}

const SRC_PT = {estimated_pct_ftp:'estimado por % do FTP', estimated_from_run:'estimado a partir da corrida', measured_bike_v1:'medido na bike'};
function srcHuman(s){ if (!s) return ''; return s.split('|').map(p => { const [k,v] = p.split('=').map(x => (x||'').trim()); const val = /^measured_lactate/.test(v) ? 'medido por lactato (' + v.replace('measured_lactate_','').replace(/_/g,' ') + ')' : (SRC_PT[v] || v); return (k === 'watts' ? 'potência: ' : k === 'hr' ? 'FC: ' : k + ': ') + val; }).join(' · '); }
// ── dados derivados ──────────────────────────────────────────────────
function pmcAt(a, s){ let r = null; for (const p of a.pmc) { if (p.d <= s) r = p; else break; } return r; }
function nextRaces(a){ return (a.events||[]).filter(e => e.date >= TODAY).sort((x,y) => x.date.localeCompare(y.date)); }
function curWeek(a){ const m = mondayOf(TODAY); return a.weeks.find(w => w.mon === m); }
function compliance(w){
  if (!w.done) return w.date < TODAY ? 'miss' : 'fut';
  const p = w.plan.tss || null, act = w.act.tss || null;
  let r = null;
  if (p && act) r = act / p; else if (w.plan.h && w.act.h) r = w.act.h / w.plan.h;
  if (r == null) return 'free';
  if (r >= .8 && r <= 1.2) return 'ok';
  if (r >= .5 && r <= 1.5) return 'warn';
  return 'bad';
}
const COMP_LABEL = {ok:'Dentro do planejado (80–120%)', warn:'Fora 50–79% ou 121–150%', bad:'Muito fora (<50% ou >150%)', miss:'Planejado e não feito', fut:'Planejado', free:'Feito sem planejamento'};

// ── VISÃO GERAL ──────────────────────────────────────────────────────
function vGeral(){
  const a = A(), last = a.pmc[a.pmc.length-1], wk = pmcAt(a, addDays(last.d, -7));
  const cw = curWeek(a) || {};
  const races = nextRaces(a);
  const recent = a.workouts.filter(w => w.done && w.date > addDays(TODAY, -7)).slice().reverse();
  const formTxt = last.tsb > 5 ? 'descansado' : last.tsb < -20 ? 'fadiga alta' : last.tsb < -10 ? 'em carga' : 'equilibrado';
  $('#view').innerHTML = `
  <div class="grid g4">
    <div class="card kpi"><div class="l">Fitness · CTL</div><div class="v" style="color:var(--ctl)">${fmtN(last.ctl,1)}</div><div class="s">${sign(wk ? last.ctl-wk.ctl : null)} em 7 dias${a.plan && a.plan.ctl_peak ? ` · pico-alvo ${a.plan.ctl_peak}` : ''}</div></div>
    <div class="card kpi"><div class="l">Fadiga · ATL</div><div class="v" style="color:var(--atl)">${fmtN(last.atl,1)}</div><div class="s">${sign(wk ? last.atl-wk.atl : null)} em 7 dias</div></div>
    <div class="card kpi"><div class="l">Forma · TSB</div><div class="v" style="color:var(--tsb)">${sign(last.tsb)}</div><div class="s">${formTxt}</div></div>
    <div class="card kpi"><div class="l">Semana atual · TSS</div><div class="v">${fmtN(cw.tss)}</div><div class="s">planejado no TP ${fmtN(cw.planned_tss)}${cw.target_tss ? ` · alvo do macro ${fmtN(cw.target_tss)}` : ''}${cw.week ? ` · sem. ${cw.week} (${WEEK_TYPE[cw.type]||cw.type})` : ''}</div></div>
  </div>
  <div class="grid g3 section">${races.slice(0,3).map(raceCard).join('') || '<div class="card muted">Nenhuma prova futura cadastrada no Supabase.</div>'}</div>
  <div class="card section">
    <h3>Gráfico de performance (PMC) <span class="sub">valores do próprio TrainingPeaks</span></h3>
    <div class="toolbar"><div class="seg" id="pmc-range">${[90,180,365].map(n=>`<button data-n="${n}" class="${state.pmcRange===n?'on':''}">${n} dias</button>`).join('')}<button data-n="plan" class="${state.pmcRange==='plan'?'on':''}">Até a prova</button></div></div>
    <div class="chart-box lg"><canvas id="pmc"></canvas></div>
    <div class="legend"><span><i class="dot" style="background:var(--ctl)"></i>CTL (fitness)</span><span><i class="dot" style="background:var(--atl)"></i>ATL (fadiga)</span><span><i class="dot" style="background:var(--tsb)"></i>TSB (forma)</span><span><i class="dot" style="background:var(--tss)"></i>TSS diário</span><span>- - - projeção pelo planejado no TP e pelos alvos do macro</span></div>
  </div>
  <div class="grid g4 section">
    ${['hrv','rhr','sleep','bb'].map(k => `<div class="card"><h3>${({hrv:'HRV',rhr:'FC de repouso',sleep:'Sono',bb:'Body Battery'})[k]} <span class="sub" id="wl-${k}-v"></span></h3><div class="chart-box sm"><canvas id="wl-${k}"></canvas></div></div>`).join('')}
  </div>

  <div class="toolbar">
    <div class="seg"><button id="cal-prev" aria-label="Semana anterior">‹ Anterior</button><button id="cal-today">Hoje</button><button id="cal-next" aria-label="Próxima semana">Próxima ›</button></div>

    return `<div class="cal-day ${dd===TODAY?'today':''} ${!list.length && !rc.length && !extra ? 'emptyday':''}"><div class="dh"><span>${DOW[i]}</span><span>${pd && dd <= TODAY ? `<span class="muted" style="font-weight:600">${fmtN(pd.tss)} TSS · </span>` : ''}<b>${ddmm(dd)}</b></span></div>${extra}

      ${list.map(w => { const c = compliance(w); return `<button class="wk" data-wid="${w.id}" style="--c:${SPORT_COLOR[w.sport]}" title="${esc(COMP_LABEL[c])}"><i class="st st-${c}"></i><div class="t">${esc(w.title)}</div><div class="m">${w.done ? `<span>${fmtH(w.act.h)}</span><span>${fmtN(w.act.tss)} TSS</span>` : `<span>${fmtH(w.plan.h)}</span><span>${fmtN(w.plan.tss)} TSS plan.</span>`}</div></button>`; }).join('')}

  </div>
  <div class="legend">${Object.entries(COMP_LABEL).map(([k,v]) => `<span><i class="st st-${k}" style="position:static;display:inline-block;width:9px;height:9px;border-radius:50%"></i>${v}</span>`).join('')}</div>`;

  }
  if (L.rest && L.rest.length) {
    html += `<div class="card section"><h3>Calibração de repouso e repetibilidade <span class="sub">checagem da técnica de coleta</span></h3><div class="tbl-wrap"><table><thead><tr><th>Quando</th><th class="n">mmol/L</th><th>Dedo</th><th>Erro</th><th>Observações</th></tr></thead><tbody>${L.rest.map(r => `<tr><td>${esc(r.t.slice(8,10)+'/'+r.t.slice(5,7)+' '+r.t.slice(11))}</td><td class="n">${fmtN(r.mmol,1)}</td><td>${esc((r.site||'').replace('finger_','').replace('middle','médio').replace('ring','anelar'))}</td><td>${esc(r.err||'')}</td><td class="notes-cell">${esc(r.notes||'')}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  $('#view').innerHTML = html;
  document.querySelectorAll('[data-test]').forEach(b => b.onclick = () => { state.lacTest = b.dataset.test; vLactato(); });
  if (t) drawLactate(t);
}
function lactateTest(t, a){
  const run = t.sport === 'run';
  const unit = run ? 'km/h' : 'W';
  const fmtL = v => v == null ? '—' : run ? `${fmtN(v,1)} km/h (${fmtPace(3600/v)}/km)` : `${fmtN(v)} W`;
  const an = t.analysis;
  const range = arr => { const v = (arr||[]).map(m => m.value).filter(x => x != null); return v.length ? [Math.min(...v), Math.max(...v)] : null; };
  const r1 = an && range(an.lt1), r2 = an && range(an.lt2);
  const off = t.official || {};
  const files = t.files || [];
  const icon = n => n.endsWith('.html') ? '📄' : n.endsWith('.csv') ? '📊' : '⌚';
  const fname = n => n === 'folheto.html' ? 'Folheto do teste (1 página)' : n === 'amostras.csv' ? 'Planilha das coletas (.csv)' : `Arquivo do treino (${n})`;
  return `
  <div class="grid g2">
    <div class="card">
      <h3>${t.round ? esc(t.round)+' — ' : ''}${run ? 'Corrida' : 'Bike'} · ${ddmmyy(t.date)} <span class="sub">${t.tp_workout_id ? 'treino TP ' + t.tp_workout_id : ''}</span></h3>
      <div class="big-lt">
        <div class="lt1"><span class="small muted">LT1 · limiar aeróbio</span><b>${off.lt1 != null ? fmtL(off.lt1) : r1 ? fmtL((r1[0]+r1[1])/2) : '—'}</b><span class="small muted">${off.lt1 != null ? 'valor oficial do passaporte v'+off.v : 'estimativa (sem passaporte ligado)'}${r1 ? ` · métodos ${fmtN(r1[0])}–${fmtN(r1[1])} ${unit}` : ''}</span></div>
        <div class="lt2"><span class="small muted">LT2 · limiar anaeróbio (≈ MLSS)</span><b>${off.lt2 != null ? fmtL(off.lt2) : r2 ? fmtL((r2[0]+r2[1])/2) : '—'}</b><span class="small muted">${off.lt2 != null ? 'valor oficial do passaporte v'+off.v : 'estimativa (sem passaporte ligado)'}${r2 ? ` · métodos ${fmtN(r2[0])}–${fmtN(r2[1])} ${unit}` : ''}</span></div>
      </div>
      ${t.before ? `<div class="note section">Antes deste teste (passaporte v${t.before.v}${t.before.source ? ' — ' + esc(srcHuman(t.before.source)) : ''}): LT1 ${fmtL(t.before.lt1)} · LT2 ${fmtL(t.before.lt2)}. Diferença: LT1 ${sign(off.lt1 - t.before.lt1)} ${unit}, LT2 ${sign(off.lt2 - t.before.lt2)} ${unit}.</div>` : ''}
      <div class="files section">${files.map(f => `<a href="${esc(f.path)}" ${f.name.endsWith('.html') ? 'target="_blank" rel="noopener"' : 'download'}>${icon(f.name)} ${esc(fname(f.name))}</a>`).join('')}</div>
    </div>
    <div class="card"><h3>Curva de lactato <span class="sub">pontos medidos · curva ajustada (polinômio de 3º grau)</span></h3><div class="chart-box"><canvas id="lac-chart"></canvas></div>
      <div class="legend"><span><i class="dot" style="background:#eef0f5"></i>Coleta</span><span><i class="dot" style="background:#9aa0b2"></i>Curva ajustada</span><span><i class="dot" style="background:var(--lt1)"></i>Faixa dos métodos LT1</span><span><i class="dot" style="background:var(--lt2)"></i>Faixa dos métodos LT2</span><span><i class="dot" style="background:#f87171"></i>FC no degrau</span></div></div>
  </div>
  <div class="grid g2 section">
    <div class="card"><h3>Degraus</h3><div class="tbl-wrap"><table><thead><tr><th>#</th><th>Degrau</th><th class="n">${run?'km/h':'Watts'}</th><th class="n">Lactato</th><th class="n">FC</th><th class="n">${run?'Cad.':'Cad.'}</th><th class="n">RPE</th></tr></thead><tbody>${t.steps.map(s => `<tr><td>${s.i ?? ''}</td><td>${esc(s.label||'')}${s.err ? ` <span class="tag">${esc(s.err)}</span>` : ''}</td><td class="n">${s.load != null ? (run ? fmtN(s.load,1) : fmtN(s.load)) : '—'}</td><td class="n"><b>${fmtN(s.mmol,1)}</b></td><td class="n">${fmtN(s.hr)}</td><td class="n">${fmtN(s.cad)}</td><td class="n">${fmtN(s.rpe)}</td></tr>`).join('')}</tbody></table></div>
      <div class="small muted section">Basal (pré-teste): <b>${fmtN(t.baseline,1)} mmol/L</b>. Observações de cada coleta estão na planilha .csv.</div></div>
    <div class="card"><h3>Como cada método chegou no limiar</h3>${an ? `<div class="tbl-wrap"><table><thead><tr><th></th><th>Método</th><th class="n">Resultado</th><th>Referência</th></tr></thead><tbody>
      ${an.lt1.map(m => `<tr><td><span class="tag" style="background:#1e3a8a;color:#dbeafe">LT1</span></td><td>${esc(m.method)}<div class="small muted">${esc(m.detail)}</div></td><td class="n"><b>${fmtL(m.value)}</b></td><td class="small muted">${esc(m.ref)}</td></tr>`).join('')}
      ${an.lt2.map(m => `<tr><td><span class="tag" style="background:#7c2d12;color:#ffedd5">LT2</span></td><td>${esc(m.method)}<div class="small muted">${esc(m.detail)}</div></td><td class="n"><b>${fmtL(m.value)}</b></td><td class="small muted">${esc(m.ref)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="note section">O dashboard recalcula os métodos com a <b>${run ? 'velocidade' : 'potência'} medida</b> em cada degrau. A análise original do teste pode ter usado a carga nominal do degrau, então diferenças de 1–2 ${unit} em relação ao folheto são esperadas. O valor que vale para as zonas é o do passaporte.</div>` : '<div class="empty">Poucos degraus válidos para calcular (mínimo 4).</div>'}
      ${off.protocol ? `<div class="note section"><b>Decisão registrada no passaporte v${off.v}:</b><br>${esc(off.protocol)}</div>` : ''}
    </div>
  </div>
  <div class="card section"><h3>Como ler este teste</h3><div class="grid g3 small">
    <div><b style="color:#7cb2ff">LT1 (limiar aeróbio)</b><br><span class="muted">É onde o lactato começa a subir acima do repouso. Abaixo dele fica o treino de base (Z1); entre LT1 e LT2 fica a Z2 do método norueguês.</span></div>
    <div><b style="color:#ffa45c">LT2 (limiar anaeróbio)</b><br><span class="muted">É onde a curva "dobra" e o lactato passa a acumular sem parar. É a melhor estimativa do máximo estado estável de lactato (MLSS). Acima dele é Z3.</span></div>
    <div><b>Por que vários métodos?</b><br><span class="muted">Nenhum método sozinho é padrão-ouro. Quando eles convergem numa faixa estreita, o limiar está bem determinado; a decisão final fica registrada no passaporte.</span></div>
  </div></div>`;
}
function drawLactate(t){
  const run = t.sport === 'run';
  const pts = t.steps.filter(s => s.load != null && s.mmol != null && (s.i||0) > 0 && !s.err);
  const an = t.analysis;
  const curve = an ? an.curve.map(([x,y]) => ({x, y})) : [];
  const bands = [];
  if (an) for (const [k, col] of [['lt1','rgba(59,130,246,.18)'],['lt2','rgba(249,115,22,.18)']]) {
    const v = an[k].map(m => m.value).filter(x => x != null); if (v.length) bands.push({from: Math.min(...v), to: Math.max(...v), color: col});
  }
  const off = t.official || {};
  const lines = [];
  if (off.lt1 != null) lines.push({x: off.lt1, color:'#3b82f6', label:`LT1 ${off.lt1}`, dash:[]});
  if (off.lt2 != null) lines.push({x: off.lt2, color:'#f97316', label:`LT2 ${off.lt2}`, dash:[], row:1});
  charts.lac = new Chart($('#lac-chart'), {
    type:'scatter',
    data:{datasets:[
      {label:'Curva ajustada', data: curve, showLine:true, pointRadius:0, borderColor:'#9aa0b2', borderWidth:1.5, yAxisID:'y'},
      {label:'Lactato', data: pts.map(s => ({x:s.load, y:s.mmol})), pointRadius:5, pointBackgroundColor:'#eef0f5', borderColor:'#eef0f5', yAxisID:'y'},
      {label:'FC', data: pts.filter(s=>s.hr).map(s => ({x:s.load, y:s.hr})), showLine:true, pointRadius:3, borderColor:'#f87171', pointBackgroundColor:'#f87171', borderWidth:1, borderDash:[3,3], yAxisID:'y1'},
    ]},
    options:{plugins:{markers:{bands, lines}, tooltip:{callbacks:{label: c => c.dataset.label === 'FC' ? `FC ${c.raw.y} bpm` : `${c.dataset.label}: ${fmtN(c.raw.y,1)} mmol/L a ${run ? fmtN(c.raw.x,1)+' km/h' : fmtN(c.raw.x)+' W'}`}}},
      scales:{x:{type:'linear', title:{display:true, text: run ? 'Velocidade (km/h)' : 'Potência (W)'}}, y:{beginAtZero:true, title:{display:true,text:'Lactato (mmol/L)'}}, y1:{position:'right', grid:{display:false}, title:{display:true,text:'FC (bpm)'}}}}
  });
}

// ── LIMIARES E ZONAS ─────────────────────────────────────────────────
function vLimiares(){
  const a = A(), P = a.passports || {};
  const order = ['bike','run','swim'];
  const keys = order.filter(k => P[k]).concat(Object.keys(P).filter(k => !order.includes(k)));
  if (!keys.length) { $('#view').innerHTML = '<div class="card empty">Sem passaportes fisiológicos no Supabase.</div>'; return; }
  const srcTag = s => !s ? '' : /lactate/.test(s) ? '<span class="tag" style="background:#14532d;color:#bbf7d0">medido por lactato</span>' : /estimated/.test(s) ? '<span class="tag" style="background:#78350f;color:#fde68a">estimado</span>' : `<span class="tag">${esc(s)}</span>`;
  $('#view').innerHTML = `<div class="grid g3">${keys.map(k => {
    const cur = P[k][P[k].length-1];
    const z = [];
    if (k === 'bike' && cur.lt1_w && cur.lt2_w) z.push(['Potência', `< ${cur.lt1_w} W`, `${cur.lt1_w}–${cur.lt2_w} W`, `> ${cur.lt2_w} W${cur.ftp ? ` (até ~${Math.round(cur.ftp*1.05)})` : ''}`]);
    if (cur.lt1_hr && cur.lt2_hr) z.push(['FC', `< ${cur.lt1_hr}`, `${cur.lt1_hr}–${cur.lt2_hr}`, `> ${cur.lt2_hr}`]);
    if (k === 'run' && cur.lt1_pace && cur.lt2_pace) z.push(['Pace', `> ${fmtPace(cur.lt1_pace)}/km`, `${fmtPace(cur.lt1_pace)}–${fmtPace(cur.lt2_pace)}/km`, `< ${fmtPace(cur.lt2_pace)}/km`]);
    return `<div class="card"><h3>${SPORT_LABEL[k]||k} <span class="sub">passaporte v${cur.v}${cur.from ? ' · desde ' + ddmmyy(cur.from) : ''}</span></h3>
      <div>${srcTag(cur.source)}${cur.source ? `<div class="small muted" style="margin-top:4px">${esc(srcHuman(cur.source))}</div>` : ''}</div>
      <div class="mgrid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
        ${cur.ftp ? `<div><span>FTP</span><b>${cur.ftp} W</b></div>` : ''}
        ${cur.lt1_w ? `<div><span>LT1</span><b>${cur.lt1_w} W</b></div>` : ''}
        ${cur.lt2_w ? `<div><span>LT2</span><b>${cur.lt2_w} W</b></div>` : ''}
        ${cur.lt1_pace ? `<div><span>LT1 pace</span><b>${fmtPace(cur.lt1_pace)}/km</b></div>` : ''}
        ${cur.lt2_pace ? `<div><span>LT2 pace</span><b>${fmtPace(cur.lt2_pace)}/km</b></div>` : ''}
        ${cur.lt1_hr ? `<div><span>FC LT1</span><b>${cur.lt1_hr} bpm</b></div>` : ''}
        ${cur.lt2_hr ? `<div><span>FC LT2</span><b>${cur.lt2_hr} bpm</b></div>` : ''}
        ${cur.max_hr ? `<div><span>FC máx</span><b>${cur.max_hr} bpm</b></div>` : ''}
        ${cur.css ? `<div><span>CSS</span><b>${fmtPace(cur.css)}/100m</b></div>` : ''}
      </div>
      ${z.length ? `<div class="tbl-wrap"><table><thead><tr><th></th><th>Z1</th><th>Z2</th><th>Z3</th></tr></thead><tbody>${z.map(r => `<tr><td class="muted">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div>` : ''}
      ${cur.protocol ? `<div class="note section">${esc(cur.protocol)}</div>` : ''}
      ${P[k].length > 1 ? `<details class="section"><summary class="small muted" style="cursor:pointer;min-height:32px">Histórico de versões (${P[k].length})</summary><div class="tbl-wrap section"><table><thead><tr><th>v</th><th>Desde</th><th class="n">LT1</th><th class="n">LT2</th><th class="n">FC</th></tr></thead><tbody>${P[k].slice().reverse().map(v => `<tr><td>${v.v}</td><td>${ddmmyy(v.from)}</td><td class="n">${v.lt1_w ? v.lt1_w+' W' : v.lt1_pace ? fmtPace(v.lt1_pace) : '—'}</td><td class="n">${v.lt2_w ? v.lt2_w+' W' : v.lt2_pace ? fmtPace(v.lt2_pace) : '—'}</td><td class="n">${v.lt1_hr||'—'}/${v.lt2_hr||'—'}</td></tr>`).join('')}</tbody></table></div></details>` : ''}
    </div>`; }).join('')}</div>
    <div class="note section">Convenção NPC (método norueguês, 3 zonas): Z1 abaixo do LT1 · Z2 do LT1 ao LT2 · Z3 do LT2 até ~105% do FTP. "Medido" = veio de teste (lactato ou ergoespirometria); "estimado" = derivado de % do FTP ou de outro esporte.</div>`;
}

// ── COMPARATIVO ──────────────────────────────────────────────────────
function vComp(){
  const start = addDays(TODAY, -120);
  const rows = KEYS.map(k => { const a = DB.athletes[k], l = a.pmc[a.pmc.length-1], cw = curWeek(a) || {}; return {k, a, l, cw}; });
  $('#view').innerHTML = `
  <div class="card"><h3>CTL — últimos 120 dias e projeção</h3><div class="chart-box"><canvas id="comp-ctl"></canvas></div>
    <div class="legend">${KEYS.map(k => `<span><i class="dot" style="background:${ATH_COLOR[k]}"></i>${esc(DB.athletes[k].short)}</span>`).join('')}<span>- - - projeção pelo plano</span></div></div>
  <div class="card section"><h3>% do alvo semanal cumprido</h3><div class="chart-box md"><canvas id="comp-pct"></canvas></div></div>
  <div class="card section"><h3>Agora</h3><div class="tbl-wrap"><table><thead><tr><th>Atleta</th><th class="n">CTL</th><th class="n">ATL</th><th class="n">TSB</th><th class="n">TSS semana</th><th class="n">Alvo semana</th><th>Próxima prova A</th></tr></thead><tbody>${rows.map(r => { const ra = nextRaces(r.a).find(e => e.priority === 'A'); return `<tr><td><span class="dot" style="background:${ATH_COLOR[r.k]}"></span> ${esc(r.a.short)}</td><td class="n">${fmtN(r.l.ctl,1)}</td><td class="n">${fmtN(r.l.atl,1)}</td><td class="n">${sign(r.l.tsb)}</td><td class="n">${fmtN(r.cw.tss)}</td><td class="n">${fmtN(r.cw.target_tss)}</td><td>${ra ? `${esc(ra.name)} · ${daysBetween(TODAY, ra.date)} dias` : '—'}</td></tr>`; }).join('')}</tbody></table></div>
    <div class="note section">Compare tendências e % do plano, não valores absolutos: CTL e TSS dependem do FTP/limiar de cada um.</div></div>`;
  const endAll = KEYS.map(k => DB.athletes[k].projection || []).flat().map(p => p.d).sort().pop() || TODAY;
  const labels = []; for (let x = start; x <= endAll; x = addDays(x, 1)) labels.push(x);
  const ds = [];
  for (const k of KEYS) {
    const a = DB.athletes[k];
    const hm = Object.fromEntries(a.pmc.map(p => [p.d, p.ctl])), pm = Object.fromEntries((a.projection||[]).map(p => [p.d, p.ctl]));
    ds.push({type:'line', label: a.short, data: labels.map(x => x <= TODAY ? hm[x] ?? null : null), borderColor: ATH_COLOR[k], pointRadius:0, borderWidth:2, spanGaps:true});
    ds.push({type:'line', label: a.short + ' (projeção)', data: labels.map(x => x === TODAY ? hm[x] ?? null : x > TODAY ? pm[x] ?? null : null), borderColor: ATH_COLOR[k], borderDash:[5,4], pointRadius:0, borderWidth:1.5, spanGaps:true});
  }
  const races = KEYS.flatMap(k => DB.athletes[k].events || []).filter((e,i,arr) => e.date >= start && e.date <= endAll && arr.findIndex(x => x.date === e.date && x.name === e.name) === i);
  charts.compCtl = new Chart($('#comp-ctl'), {data:{labels, datasets:ds}, options:{interaction:{mode:'index',intersect:false}, plugins:{tooltip:{callbacks:{title: it => ddmmyy(it[0].label), label: c => c.raw==null?null:`${c.dataset.label}: ${fmtN(c.raw,1)}`}}, markers:{lines:[{x:TODAY,color:'#ff7c3a',label:'hoje'}].concat(races.map((e,i)=>({x:e.date,color:'#ff5252',label:e.name,row:i%3,dash:[]})))}},
    scales:{x:{ticks:{maxTicksLimit:10, callback(v){return ddmm(this.getLabelForValue(v));}}, grid:{display:false}}, y:{title:{display:true,text:'CTL'}}}}});
  const mons = [...new Set(KEYS.flatMap(k => DB.athletes[k].weeks.filter(w => w.target_tss && w.tss != null).map(w => w.mon)))].sort();
  charts.compPct = new Chart($('#comp-pct'), {type:'bar', data:{labels: mons.map(ddmm), datasets: KEYS.map(k => { const by = Object.fromEntries(DB.athletes[k].weeks.map(w => [w.mon, w])); return {label: DB.athletes[k].short, data: mons.map(m => by[m] && by[m].target_tss && by[m].tss != null ? Math.round(by[m].tss/by[m].target_tss*100) : null), backgroundColor: ATH_COLOR[k]}; })},
    options:{plugins:{legend:{display:true, labels:{boxWidth:10}}, tooltip:{callbacks:{label: c => `${c.dataset.label}: ${c.raw}%`}}}, scales:{y:{beginAtZero:true, suggestedMax:120, title:{display:true,text:'% do alvo'}}, x:{grid:{display:false}}}}});
}

initNav();
render();
</script>
